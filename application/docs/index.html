<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B-Fabric Documentation</title>
  <meta content="Description" name="description">
  <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" name="viewport">
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
        name: 'bfabric',
        repo: '',
        homepage: 'home.md',
        loadSidebar: 'menu.md',
        loadNavbar: 'navbar.md',
        mergeNavbar: true,
        subMaxLevel: 1,
        themeColor: '#235ba5',
        logo: '/resources/images/menu-logo.png',
        search: 'auto',
        alias: {
            '/.*/menu.md': '/menu.md',
            '/.*/navbar.md': '/navbar.md'
        },
        coverpage: {
            '/': 'cover.md'
        },
        noCompileLinks: [
            '(\\.\\./)*jsdocs/.*', // jsdoc directory
            '.*\.d\.ts*', // TypeScript declarations file
        ],
        plugins: [
            function (hook, vm) {
                hook.ready(function () {
                    let h1Elt = document.querySelector("main aside h1.app-name");
                    let versionElt = document.createElement("div");
                    versionElt.setAttribute("class", "PF-version")
                    versionElt.appendChild(document.createTextNode("V9.0"));

                    h1Elt.appendChild(versionElt);
                });
            }
        ]
    };

    if (typeof navigator.serviceWorker !== 'undefined') {
        navigator.serviceWorker.register('sw.js')
    }
</script>
</body>
</html>
