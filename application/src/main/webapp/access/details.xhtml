<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid columns="2" columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id.xhtml" />
      <ui:include src="/fragments/details/accesstype.xhtml" />
      <ui:include src="/fragments/details/accessprotocol.xhtml" />
      <ui:include src="/fragments/details/host.xhtml" />
      <ui:include src="/fragments/details/basepath.xhtml" />
      <ui:include src="/fragments/details/storage.xhtml" />
      <ui:include src="/fragments/details/typeSpecificPrefix.xhtml" />
      <ui:include src="/fragments/details/enabled.xhtml" />
      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid columns="5" styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <ui:include src="/fragments/button/clone.xhtml" />
      <c:if test="#{identityManager.hasCurrentUserRole('storageManager')}">
        <ui:include src="/fragments/button/switchenabled.xhtml" />
      </c:if>
      <ui:include src="/fragments/button/delete.xhtml" />
      <ui:include src="/fragments/button/list.xhtml" />
    </h:panelGrid>

    <ui:include src="/fragments/details/storage-location-access-check.xhtml">
      <ui:param
        name="instance"
        value="#{access.storage}" />
    </ui:include>
  </c:if>
</ui:composition>
