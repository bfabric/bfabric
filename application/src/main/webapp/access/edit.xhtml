<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core">
  <ui:param
    name="entityManager"
    value="#{accessManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <!-- must be inside the body -->

      <h:form id="edit-access">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">

          <h:outputText value="#{messages.accessType}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="type"
              value="#{access.accessType}"
              styleClass="editWidthExtraLarge"
              converter="omnifaces.SelectItemsConverter">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{accessTypeList.enabledOrderByPosition}"
                var="item"
                itemLabel="#{item.name}" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText value="#{messages.accessProtocol}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="protocol"
              value="#{access.accessProtocol}"
              styleClass="editWidthExtraLarge"
              converter="omnifaces.SelectItemsConverter">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{accessProtocolList.enabledOrderByPosition}"
                var="item"
                itemLabel="#{item.name}" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText value="#{messages.host}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="host"
              value="#{access.host}"
              title="#{messages.accessHostHint}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.basePath}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="basePath"
              value="#{access.basePath}"
              title="#{messages.accessBasePathHint}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.storage}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="storage"
              value="#{access.storage}"
              title="#{messages.accessStorageHint}"
              disabled="#{access.managed and not access.deletable}"
              styleClass="editWidthExtraLarge"
              converter="omnifaces.SelectItemsConverter">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{storageList.supervisedStorages}"
                var="item"
                itemLabel="#{item.displayName}" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText value="#{messages.typeSpecificPrefix}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="typeSpecificPrefix"
              value="#{access.typeSpecificPrefix}"
              title="#{messages.accessTypeSpecificPrefixHint}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{access.enabled}"
              title="#{messages.accessEnabledHint}"
              disabled="#{access.managed and not access.deletable}" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-edit-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
