<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <p:columnGroup type="header">
    <p:row>
      <p:column colspan="1" headerText="#{messages.year}" />
      <p:column colspan="1" headerText="#{messages.accessRequest}" />
      <p:column colspan="3" headerText="#{messages.accessType}" />
    </p:row>
    <p:row>
      <p:column headerText="&#160;" sortBy="#{entity[0]}" filterBy="#{entity[0]}" />
      <p:column headerText="#{messages.quantity}" sortBy="#{entity[1]}" filterBy="#{entity[1]}" />
      <p:column headerText="#{messages.accessRequestCardPersonal}" sortBy="#{entity[2]}" filterBy="#{entity[2]}" />
      <p:column headerText="#{messages.accessRequestCardGuest}" sortBy="#{entity[3]}" filterBy="#{entity[3]}" />
    </p:row>
  </p:columnGroup>

  <ui:include src="/statistics/fragments/column/year.xhtml" />
  <ui:include src="/statistics/fragments/column/integer.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.accessRequest}" />
    <ui:param
      name="value"
      value="#{entity[1]}" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/integer.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.accessRequestCardPersonal}" />
    <ui:param
      name="value"
      value="#{entity[2]}" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/integer.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.accessRequestCardGuest}" />
    <ui:param
      name="value"
      value="#{entity[3]}" />
  </ui:include>
</ui:composition>
