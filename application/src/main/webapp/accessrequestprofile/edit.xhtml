<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{accessRequestProfileManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{accessRequestProfile.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.accessGranted}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="accessGranted"
              value="#{accessRequestProfile.accessGranted}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{accessRequestProfile.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="description"
              value="#{accessRequestProfile.description}"
              rows="3"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <p:commandButton
            action="#{accessRequestProfileManager.save}"
            value="#{messages.save}"
            update="@form" />
          <p:commandButton
            action="#{accessRequestProfileManager.cancel}"
            value="#{messages.cancel}"
            immediate="true" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
