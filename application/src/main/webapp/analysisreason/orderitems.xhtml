<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('orderitems')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="orderitem" />
      <ui:param
        name="tableContext"
        value="#{analysisReason.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{analysisReason.orderItems}" />
      <ui:param
        name="hideColumns"
        value="libraryType, readType, region, insertSize, multiplexing" />
    </ui:include>
  </c:if>
</ui:composition>
