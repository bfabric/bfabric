<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">

  <p:dialog
    id="addAnnotationPanel"
    widgetVar="addAnnotationDialog"
    dynamic="true"
    resizable="false"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{messages.addAnnotation}" />
    </f:facet>
    <h:form
      id="addAnnotationPanelForm"
      rendered="#{not empty manager and not empty manager.annotation}"
      prependId="false">
      <h:panelGrid
        columns="2"
        columnClasses="rtdm, ltd">
        <h:outputText value="#{messages.type}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:outputText
            rendered="#{manager.annotation.type != null}"
            value="#{manager.annotation.type}" />
          <h:selectOneMenu
            rendered="#{manager.annotation.type == null and empty batch}"
            id="annotationType"
            value="#{manager.annotation.type}"
            required="true">
            <f:selectItem
              itemLabel="#{messages.selectAnItem}"
              itemDisabled="true" />
            <f:selectItems
              value="#{manager.extensibleAnnotationTypes}"
              var="item"
              itemValue="#{item.label}"
              itemLabel="#{item.label}" />
          </h:selectOneMenu>
        </ui:decorate>

        <h:outputText value="#{messages.name}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:inputText
            id="annotationName"
            value="#{manager.annotation.name}"
            required="true"
            styleClass="editWidthExtraLarge" />
        </ui:decorate>

        <h:outputText value="#{messages.description}" />
        <ui:decorate template="/fragments/edit.xhtml">
          <h:inputTextarea
            id="description"
            value="#{manager.annotation.description}"
            rows="10"
            styleClass="editWidthExtraLarge" />
        </ui:decorate>

        <c:if test="#{identityManager.hasCurrentUserRole('annotationManager')}">
          <h:outputText value="#{messages.na}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="na"
              value="#{manager.annotation.na}" />
          </ui:decorate>

          <h:outputText value="#{messages.top}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="top"
              value="#{manager.annotation.top}" />
          </ui:decorate>

          <h:outputText value="#{messages.common}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="common"
              value="#{manager.annotation.common}" />
          </ui:decorate>

          <h:outputText value="#{messages.released}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="released"
              value="#{manager.annotation.released}" />
          </ui:decorate>
        </c:if>
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{manager.saveAnnotation}"
          value="#{messages.save}"
          global="false"
          oncomplete="hideDialogOnSuccess(args, 'addAnnotationDialog'); fixOversize();"
          update="#{updateOnSave}, addAnnotationPanelForm" />
        <p:commandButton
          value="#{messages.cancel}"
          immediate="true"
          global="false"
          oncomplete="PF('addAnnotationDialog').hide(); fixOversize();" />
      </h:panelGrid>
    </h:form>
  </p:dialog>
</ui:composition>
