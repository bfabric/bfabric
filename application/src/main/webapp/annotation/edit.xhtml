<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{annotationManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.type}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:outputText
              value="#{annotation.type}"
              rendered="#{annotation.managed}" />
            <h:selectOneMenu
              id="type"
              value="#{annotation.type}"
              rendered="#{not annotation.managed}"
              styleClass="editWidthExtraLarge">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{annotationManager.annotationTypes}"
                var="item"
                itemValue="#{item.label}"
                itemLabel="#{item.label}" />
              <p:ajax
                event="change"
                global="false" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{annotation.name}"
              styleClass="editWidthExtraLarge">
            </h:inputText>
          </ui:decorate>

          <c:if test="#{identityManager.hasCurrentUserRole('annotationManager')}">
            <h:outputText value="#{messages.na}" />
            <ui:decorate template="/fragments/edit.xhtml">
              <h:selectBooleanCheckbox
                id="na"
                value="#{annotation.na}" />
            </ui:decorate>

            <h:outputText value="#{messages.top}" />
            <ui:decorate template="/fragments/edit.xhtml">
              <h:selectBooleanCheckbox
                id="top"
                value="#{annotation.top}" />
            </ui:decorate>

            <h:outputText value="#{messages.common}" />
            <ui:decorate template="/fragments/edit.xhtml">
              <h:selectBooleanCheckbox
                id="common"
                value="#{annotation.common}" />
            </ui:decorate>

            <h:outputText value="#{messages.released}" />
            <ui:decorate template="/fragments/edit.xhtml">
              <h:selectBooleanCheckbox
                id="released"
                value="#{annotation.released}" />
            </ui:decorate>

            <h:outputText value="#{messages.description}" />
            <ui:decorate template="/fragments/edit.xhtml">
              <h:inputTextarea
                id="annotationDescription"
                value="#{annotation.description}"
                rows="10"
                styleClass="editWidthExtraLarge" />
            </ui:decorate>
          </c:if>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
