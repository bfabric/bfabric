<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('samplepreparationprotocols') and identityManager.hasCurrentUserRole('annotationManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="samplepreparationprotocol" />
      <ui:param
        name="tableContext"
        value="#{annotation.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{samplePreparationProtocolList.getLazyModelByAnnotation(annotation)}" />
    </ui:include>
  </c:if>
</ui:composition>
