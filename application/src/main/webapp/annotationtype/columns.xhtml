<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column
    width="150"
    sortBy="#{entity.type}"
    headerText="#{messages.type}">
    <p:link
      outcome="/annotation/list.xhtml"
      value="#{entity.type}">
      <f:param
        name="annotationTypeFilter"
        value="#{entity.type}" />
    </p:link>
  </p:column>
  <p:column
    width="60"
    sortBy="#{entity.count}"
    headerText="#{messages.count}">
    <h:outputText value="#{entity.count}" />
    <h:outputText
      styleClass="warning"
      value=" (#{entity.unreleasedAnnotations.size()})" />
  </p:column>
  <p:column
    width="700"
    styleClass="wrap"
    headerText="#{messages.unreleasedAnnotations}"
    exportValue="#{entity.unreleasedAnnotationsNamesAsString}">
    <ui:repeat
      value="#{entity.unreleasedAnnotations}"
      var="item">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{item}" />
      </ui:include>
      <h:outputText value=" | " />
    </ui:repeat>
  </p:column>
</ui:composition>
