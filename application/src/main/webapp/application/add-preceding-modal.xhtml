<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:dialog
    id="addPrecedingApplicationsModalPanel"
    widgetVar="addPrecedingApplicationsModalDialog"
    dynamic="true"
    height="600px"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{messages.edit} #{messages.precedingApplications}" />
    </f:facet>
    <h:form id="addPrecedingApplicationTableForm">
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param
          name="tableType"
          value="application" />
        <ui:param
          name="tableContext"
          value="addPreceding" />
        <ui:param
          name="tableContent"
          value="#{applicationManager.potentialPrecedingApplications}" />
        <ui:param
          name="showColumns"
          value="checked" />
        <ui:param
          name="hideColumns"
          value="run,help,pageflow,executable,wrapperCreator,submitter,createdBy,createdOn" />
        <ui:param
          name="rowsPerPageDropdown"
          value="none" />
      </ui:include>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          actionListener="#{applicationManager.updatePrecedingApplications}"
          value="#{messages.finish}"
          immediate="true"
          global="false"
          update="@([id$=precedingApplications])"
          oncomplete="PF('addPrecedingApplicationsModalDialog').hide()" />
        <p:commandButton
          value="#{messages.cancel}"
          immediate="true"
          global="false"
          update="@([id$=precedingApplications])"
          oncomplete="PF('addPrecedingApplicationsModalDialog').hide()" />
      </h:panelGrid>
    </h:form>
  </p:dialog>
</ui:composition>
