<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <!--@elvariable id="entity" type="org.bfabric.entity.Application"-->
  <h:outputLink
    value="#{instance.help}"
    title="#{instance.name}: #{messages.applicationHelpHint}"
    target="_blank"
    rel="noopener"
    rendered="#{instance.helpAvailable}">
    <i class="fas fa-circle-info" />
  </h:outputLink>
</ui:composition>
