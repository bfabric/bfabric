<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('importresources') and identityManager.hasCurrentUserRole('applicationReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="importresource" />
      <ui:param
        name="tableContext"
        value="#{app.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{importResourceList.getImportResourcesLazyModelByApplication(app)}" />
      <ui:param
        name="hideColumns"
        value="application" />
    </ui:include>
  </c:if>
</ui:composition>
