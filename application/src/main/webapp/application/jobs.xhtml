<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('jobs') and identityManager.hasCurrentUserRole('applicationReader')}">
  <h:panelGroup rendered="#{not empty app.jobs}">
      <ui:include src="/fragments/show-datatable.xhtml">
        <ui:param name="tableType" value="job" />
        <ui:param name="tableContext" value="#{app.tableContext}" />
        <ui:param name="tableContent" value="#{app.jobs}" />
        <ui:param name="hideColumns" value="#{not empty hideColumns ? hideColumns : 'parent'}" />
      </ui:include>
    </h:panelGroup>
  </c:if>
</ui:composition>
