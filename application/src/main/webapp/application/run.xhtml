<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  template="/layout/template.xhtml">
  <!--@elvariable id="contextContainer" type="org.bfabric.entity.Container"-->
  <ui:define name="pageTitle">
    <h:outputText value="#{messages.applications}" />
  </ui:define>

  <ui:define name="body">
    <h:outputText
      value="#{messages.runnableApplicationNotAvailableHint}"
      rendered="#{not contextContainer.extensible}" />
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="application" />
      <ui:param
        name="tableContext"
        value="run" />
      <ui:param
        name="tableContent"
        value="#{applicationList.getRunnableApplicationsLazyModel(contextContainer)}" />
      <ui:param
        name="hideColumns"
        value="entityId,pageflow,hidden,notifyApplicationSupervisor,notifyContainerMember,forEmployeesOnly,importResourcesRequired,executable,wrapperCreator,submitter,createdBy,createdOn,modifiedBy,modifiedOn" />
      <ui:param
        name="applicationTypeName"
        value="#{applicationManager.applicationTypeName}" />
    </ui:include>
    <c:if test="#{not empty applicationManager.applicationTypeName}">
      <script>$(document).ready(function () {
          if (PF('runapplication')) {
              PF('runapplication').filter();
          }
      });</script>
    </c:if>
  </ui:define>
</ui:composition>
