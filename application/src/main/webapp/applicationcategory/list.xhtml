<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"

                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('applicationReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.applicationCategories}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/lazylist-with-create.xhtml">
      <ui:param name="tableType" value="applicationcategory" />
      <ui:param name="buttonRendered" value="#{identityManager.hasCurrentUserRole('applicationManager')}" />
    </ui:include>
  </ui:define>
</ui:composition>
