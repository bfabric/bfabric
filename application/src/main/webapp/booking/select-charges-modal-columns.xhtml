<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <!--@elvariable id="entity" type="org.bfabric.entity.Charge"-->
  <p:column exportable="false">
    <f:facet name="header">
      <h:panelGrid
        columns="1"
        styleClass="nospace noborder">
        <h:outputText value="#{messages.select}" />
        <h:panelGrid
          columns="2"
          styleClass="select-icon">
          <p:commandLink
            actionListener="#{bookingManager.checkAllCandidateCharges(true)}"
            immediate="true"
            global="false"
            update="#{tableContext}#{tableType}table"
            oncomplete="fixOversize()">
            <i class="far fa-check-square" />
          </p:commandLink>
          <p:commandLink
            actionListener="#{bookingManager.checkAllCandidateCharges(false)}"
            immediate="true"
            global="false"
            update="#{tableContext}#{tableType}table"
            oncomplete="fixOversize()">
            <i class="far fa-square" />
          </p:commandLink>
        </h:panelGrid>
      </h:panelGrid>
    </f:facet>
    <h:selectBooleanCheckbox value="#{entity.checked}">
      <p:ajax
        event="change"
        global="false"
        process="@form" />
    </h:selectBooleanCheckbox>
  </p:column>

  <p:column
    field="#{fieldPrefix}id"
    headerText="#{messages.charge} #{messages.id}" />

  <ui:include src="/fragments/column/servicename.xhtml" />
  <ui:include src="/fragments/column/servicecode.xhtml" />
  <ui:include src="/fragments/column/total.xhtml" />
  <ui:include src="/fragments/column/accounted.xhtml" />
  <ui:include src="/fragments/column/notaccounted.xhtml" />
  <ui:include src="/fragments/column/price.xhtml" />
  <ui:include src="/fragments/column/date.xhtml" />
</ui:composition>
