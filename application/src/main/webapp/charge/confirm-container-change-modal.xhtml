<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <p:dialog
    id="confirmContainerChangePanel"
    widgetVar="confirmContainerChangeDialog"
    dynamic="true"
    closable="false"
    resizable="false"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{messages.confirmContainerChangeActionMessage}" />
    </f:facet>
    <h:form id="confirmContainerChangeForm">
      <h:panelGrid>
        <h:outputFormat
          value="#{messages.confirmContainerChangeMessage}"
          escape="false">
          <c:if test="#{not empty chargeManager.samplesModel and not empty chargeManager.samplesModel.target}">
            <f:param value="samples" />
          </c:if>
          <c:if test="#{not empty chargeManager.orderItemsModel and not empty chargeManager.orderItemsModel.target}">
            <f:param value="order items" />
          </c:if>
          <c:if test="#{not empty chargeManager.charge.instrumentReservations}">
            <f:param value="instrument reservations" />
          </c:if>
        </h:outputFormat>
      </h:panelGrid>
      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          actionListener="#{chargeManager.approveContainerChanged()}"
          value="#{messages.change}"
          global="false"
          update="#{constants.EDIT}"
          oncomplete="PF('confirmContainerChangeDialog').hide();" />
        <p:commandButton
          actionListener="#{chargeManager.cancelContainerChanged()}"
          value="#{messages.cancel}"
          immediate="true"
          global="false"
          update="#{constants.EDIT}"
          oncomplete="PF('confirmContainerChangeDialog').hide();" />
      </h:panelGrid>
    </h:form>
  </p:dialog>
</ui:composition>
