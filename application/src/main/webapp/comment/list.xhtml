<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('commentReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.comments}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="comment" />
      <ui:param
        name="tableContext"
        value="all" />
      <ui:param
        name="tableContent"
        value="#{commentList.lazyModel}" />
    </ui:include>
  </ui:define>
</ui:composition>
