<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('replies') }">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="comment" />
      <ui:param
        name="tableContext"
        value="#{comment.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{commentList.getLazyModelByReplyToId(comment.id)}" />
      <ui:param
        name="hideColumns"
        value="replyTo" />
    </ui:include>
  </c:if>
</ui:composition>
