<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('workunits') and comment.readable}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workunit" />
      <ui:param
        name="tableContext"
        value="#{comment.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{comment.workunits}" />
      <ui:param
        name="hideColumns"
        value="comment" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
