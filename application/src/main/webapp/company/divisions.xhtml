<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('divisions')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="division" />
      <ui:param
        name="tableContext"
        value="#{company.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{company.divisions}" />
      <ui:param
        name="hideColumns"
        value="company" />
    </ui:include>
  </c:if>
</ui:composition>
