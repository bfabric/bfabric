<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('orders') and identityManager.hasCurrentUserRole('containerReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="order" />
      <ui:param
        name="tableContext"
        value="#{company.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{orderList.getLazyModelByCompanyId(company.id)}" />
      <ui:param
        name="hideColumns"
        value="orderRequesterName, referenceNumber, project" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
