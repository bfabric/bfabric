<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:o="http://omnifaces.org/ui">

  <c:if test="#{sidebarHelper.isTab('notes')}">
    <o:importConstants type="org.bfabric.enums.CommentDiscriminator" />
    <ui:include src="/comment/list-by-parent-with-create.xhtml">
      <ui:param
        name="category"
        value="#{constants.COMMENT_CATEGORY_NOTE}" />
      <ui:param
        name="type"
        value="#{CommentDiscriminator.CONSUMABLE_NOTE}" />
      <ui:param
        name="parent"
        value="#{consumable}" />
      <ui:param
        name="comments"
        value="#{consumable.notesCurrentUser}" />
      <ui:param
        name="showform"
        value="#{consumable.updatable}" />
    </ui:include>
  </c:if>
</ui:composition>
