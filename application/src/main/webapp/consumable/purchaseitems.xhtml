<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('purchaseitems')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="purchaseitem" />
      <ui:param
        name="tableContext"
        value="#{consumable.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{consumable.purchaseItems}" />
      <ui:param
        name="hideColumns"
        value="consumable" />
      <ui:param
        name="showColumns"
        value="invoiceReceivedDate, invoiceNumber" />
    </ui:include>
  </c:if>
</ui:composition>
