<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:o="http://omnifaces.org/ui">
  <ui:param name="entityManager" value="#{contactInfoManager}" />
  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid columns="2" columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="name" value="#{contactInfo.name}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.street}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="address" value="#{contactInfo.address.street}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.zip}" title="#{messages.zipHint}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="zip" value="#{contactInfo.address.zip}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.city}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="city" value="#{contactInfo.address.city}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.country}" />
          <ui:decorate template="/fragments/required.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param name="listContext" value="country" />
              <ui:param name="value" value="#{contactInfo.address.country}" />
              <o:methodParam name="completeMethod" value="#{countryService.getCountriesByIdOrNameFiltered}" />
              <ui:param name="itemLabel" value="#{item.displayName}" />
              <ui:param name="required" value="true" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.supplement}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText id="supplement" value="#{contactInfo.address.supplement}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.room}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText id="room" value="#{contactInfo.address.room}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.email}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText id="email" value="#{contactInfo.email}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.mapUrl}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText id="mapUrl" value="#{contactInfo.mapUrl}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.officeHours}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText id="times" value="#{contactInfo.officeHours}" styleClass="editWidthExtraLarge" />
          </ui:decorate>
          <ui:include src="/fragments/edit/enabled.xhtml" />
        </h:panelGrid>

        <h:panelGrid columns="2" styleClass="action">
          <ui:decorate template="/fragments/button/save-edit-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
