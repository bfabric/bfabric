<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('serviceReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.contactInfos}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/lazylist-with-create.xhtml">
      <ui:param name="tableType" value="contactinfo" />
      <ui:param name="buttonRendered" value="#{identityManager.hasCurrentUserRole('serviceManager')}" />
      <ui:param name="showColumns" value="street, zip, city, country, supplement, room" />
    </ui:include>
  </ui:define>
</ui:composition>
