<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('serviceareas')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="servicearea" />
      <ui:param
        name="tableContext"
        value="#{contactInfo.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{contactInfo.serviceAreas}" />
      <ui:param
        name="hideColumns"
        value="parent" />
      <ui:param
        name="showColumns"
        value="internal" />
    </ui:include>
  </c:if>
</ui:composition>
