<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('container')}">
    <p:column
      sortBy="#{entity.container.id}"
      filterBy="#{entity.container.filterValue}"
      filterValue="#{filterValue}"
      headerText="#{messages.container}"
      exportValue="#{entity.container.id}">
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.container}" />
        <ui:param
          name="entityValue"
          value="#{entity.container.entityName} #{entity.container.id}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
