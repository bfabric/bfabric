<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty entity.container}">
    <h:outputText value="#{entity.container.entityName}" />
    <ui:include src="/fragments/entity-link.xhtml">
      <ui:param
        name="entity"
        value="#{entity.container}" />
    </ui:include>
  </c:if>
</ui:composition>
