<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:o="http://omnifaces.org/ui">
  <c:if test="#{container.hasCurrentUserRole('containerReader')}">
    <h:panelGroup styleClass="height-20" />
    <h:panelGrid columns="2" title="#{messages.trackingContainerUsersHint}" styleClass="action align-middle">
      <b>#{messages.trackingUsers}</b>
    </h:panelGrid>
    <c:if test="#{not empty container.trackingUsers}">
      <ui:include src="/fragments/show-datatable.xhtml">
        <ui:param name="tableContext" value="#{container.tableContext}_trackers" />
        <ui:param name="tableContent" value="#{container.trackingUsers}" />
        <ui:param name="include" value="/user/columns-reduced.xhtml" />
        <ui:param name="styleClass" value="column-width-auto" />
      </ui:include>
    </c:if>
    <br />
    <h:form id="#{constants.EDIT}">
      <ui:include src="/fragments/autocomplete.xhtml">
        <ui:param name="listContext" value="containertracker" />
        <ui:param name="value" value="#{container.trackingUsersAsList}" />
        <o:methodParam name="completeMethod" value="#{container.getEmployeesExcludingSupportAndMembers}" />
        <ui:param name="itemLabel" value="#{item.name}" />
        <ui:param name="multiple" value="true" />
        <ui:param name="styleClass" value="editWidthExtraLarge" />
      </ui:include>
      <h:panelGrid columns="2" styleClass="action">
        <ui:decorate template="/fragments/button/save-cancel.xhtml" />
      </h:panelGrid>
    </h:form>
  </c:if>
</ui:composition>
