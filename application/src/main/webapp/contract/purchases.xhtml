<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('purchases')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param name="tableType" value="purchase" />
      <ui:param name="tableContext" value="#{contract.tableContext}" />
      <ui:param name="tableContent" value="#{contract.purchases}" />
      <ui:param name="hideColumns" value="contract" />
    </ui:include>

    <h:panelGrid styleClass="action">
      <p:button outcome="/purchase/edit.xhtml" value="#{messages.create}" rendered="#{identityManager.hasCurrentUserRole('purchaseManager')}">
        <f:param name="contractId" value="#{contract.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
