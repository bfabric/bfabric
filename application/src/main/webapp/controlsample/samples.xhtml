<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('samples') and not empty controlSample.samples and identityManager.hasCurrentUserRole('labManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="sample" />
      <ui:param
        name="tableContext"
        value="#{controlSample.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{sampleList.getLazyModelByControlSampleId(controlSample.id)}" />
      <ui:param
        name="hideColumns"
        value="samplePreparationProtocol" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
