<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id.xhtml" />

      <h:outputText value="#{messages.user}" />
      <ui:include src="/fragments/user-link.xhtml">
        <ui:param
          name="instance"
          value="#{credit.user}" />
      </ui:include>

      <h:outputText value="#{messages.year}" />
      <h:outputText value="#{credit.year}" />

      <h:outputText value="#{messages.days}" />
      <h:outputText value="#{credit.days}" />

      <h:outputText value="#{messages.type}" />
      <h:outputText
        value="#{credit.type.label}"
        title="#{credit.type.description}" />

      <ui:include src="/fragments/details/description-links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="4"
      styleClass="action">
      <ui:include src="/fragments/button/edit-delete-list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
