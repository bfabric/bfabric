<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{creditManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <!-- must be inside the body -->
      <o:importConstants type="org.bfabric.enums.CreditTypeEnum" />

      <h:form
        id="#{constants.EDIT}"
        onsubmit="#{creditManager.resetRefererURL()}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <c:if test="#{identityManager.hasCurrentUserRole('agendaManager')}">
            <h:outputText value="#{messages.user}" />
            <ui:include src="/fragments/autocomplete-required.xhtml">
              <ui:param
                name="listContext"
                value="creditUser" />
              <ui:param
                name="value"
                value="#{credit.user}" />
              <o:methodParam
                name="completeMethod"
                value="#{credit.getEmployeesIncludingUser}" />
              <ui:param
                name="itemLabel"
                value="#{item.fullLastFirstName}" />
            </ui:include>
          </c:if>

          <h:outputText value="#{messages.year}" />
          <ui:decorate template="/fragments/required.xhtml">
            <p:spinner
              id="year"
              value="#{credit.year}"
              size="6"
              decimalPlaces="0"
              thousandSeparator="" />
          </ui:decorate>

          <h:outputText value="#{messages.days}" />
          <ui:decorate template="/fragments/required.xhtml">
            <p:spinner
              id="days"
              value="#{credit.days}"
              min="0.5"
              max="30.0"
              stepFactor="0.5"
              size="6"
              decimalPlaces="1"
              thousandSeparator="" />
          </ui:decorate>

          <h:outputText value="#{messages.type}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="creditType"
              value="#{credit.type}"
              styleClass="editWidthExtraLarge">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{CreditTypeEnum.values()}"
                var="item"
                itemLabel="#{item.label}" />
              <p:ajax
                event="change"
                global="false" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputTextarea
              id="description"
              value="#{credit.description}"
              rows="3"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
