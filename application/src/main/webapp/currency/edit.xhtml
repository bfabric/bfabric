<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <ui:param
    name="entityManager"
    value="#{currencyManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{messages.name}"
              value="#{currency.name}"
              styleClass="editWidthMedium" />
          </ui:decorate>

          <h:outputText value="#{messages.code}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{messages.code}"
              value="#{currency.code}"
              styleClass="editWidthMedium" />
          </ui:decorate>

          <h:outputText value="#{messages.symbol}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{messages.symbol}"
              value="#{currency.symbol}"
              styleClass="editWidthMedium" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
