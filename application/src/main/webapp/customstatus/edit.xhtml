<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{customStatusManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.parentStatusName}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="parentStatusName"
              value="#{customStatus.parentStatusName}"
              styleClass="editWidthExtraLarge">
            </h:inputText>
          </ui:decorate>

          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{customStatus.name}"
              styleClass="editWidthExtraLarge">
            </h:inputText>
          </ui:decorate>

          <h:outputText value="#{messages.type}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="type"
              value="#{customStatus.type}"
              styleClass="editWidthExtraLarge">
            </h:inputText>
          </ui:decorate>

          <h:outputText value="#{messages.color}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:colorPicker
              id="color"
              value="#{customStatus.color}"
              mode="popup" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
