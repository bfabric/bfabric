<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('applications')}">
    <h:outputText
      value="No runnable application available for the dataset"
      rendered="#{empty applicationList.getRunnableApplicationsByDatasetTemplate(dataset.datasetTemplate)}" />
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="application" />
      <ui:param
        name="tableContext"
        value="#{dataset.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{applicationList.getRunnableApplicationsByDatasetTemplate(dataset.datasetTemplate)}" />
      <ui:param
        name="showColumns"
        value="runSucceedingDataset" />
      <ui:param
        name="hideColumns"
        value="hidden,forEmployeesOnly,annotationRequired,importResourcesRequired,pageflow,executable,wrapperCreator,submitter,createdBy,createdOn" />
    </ui:include>
  </c:if>
</ui:composition>
