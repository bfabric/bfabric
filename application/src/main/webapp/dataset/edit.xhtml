<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{datasetManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form
        id="edit"
        onsubmit="#{datasetManager.resetRefererURL()}">
        <c:if test="#{not dataset.prepared}">
          <ui:include src="edit-prepare.xhtml" />
        </c:if>
        <ui:include src="edit-prepared.xhtml" />

        <h:panelGrid
          columns="3"
          styleClass="action">
          <p:commandButton
            actionListener="#{datasetManager.next}"
            value="#{messages.next}"
            oncomplete="fixOversize();"
            rendered="#{not dataset.prepared}"
            update="edit" />
          <p:commandButton
            action="#{datasetManager.save}"
            value="#{messages.save}"
            update="@form"
            oncomplete="fixOversize();"
            rendered="#{dataset.prepared}" />
          <ui:decorate template="/fragments/button/edit-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
