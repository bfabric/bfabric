<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not dataset.contentEmpty and not hideContent}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="include"
        value="/dataset/item-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="#{dataset.tableContext}_item" />
      <ui:param
        name="tableContent"
        value="#{dataset.items}" />
      <ui:param
        name="dataset"
        value="#{dataset}" />
    </ui:include>
  </c:if>
</ui:composition>
