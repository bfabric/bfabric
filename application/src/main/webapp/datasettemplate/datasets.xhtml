<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('datasets') and identityManager.hasCurrentUserRole('containerReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param name="tableType" value="dataset" />
      <ui:param name="tableContext" value="#{datasetTemplate.tableContext}" />
      <ui:param name="tableContent" value="#{datasetTemplate.datasets}" />
    </ui:include>
    <h:form>
      <h:panelGrid columns="2" styleClass="action">
        <p:button rendered="#{identityManager.hasCurrentUserRole('containerManager')}" outcome="/dataset/edit.xhtml" value="#{messages.create} #{messages.fromExistingData}">
          <f:param name="fromExistingData" value="true" />
          <f:param name="datasetTemplateId" value="#{datasetTemplate.id}" />
        </p:button>
        <p:button rendered="#{identityManager.hasCurrentUserRole('containerManager')}" outcome="/dataset/edit.xhtml" value="#{messages.create} #{messages.fromScratch}">
          <f:param name="fromExistingData" value="false" />
          <f:param name="datasetTemplateId" value="#{datasetTemplate.id}" />
        </p:button>
      </h:panelGrid>
    </h:form>
  </c:if>
</ui:composition>
