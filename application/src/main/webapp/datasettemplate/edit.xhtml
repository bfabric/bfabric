<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:o="http://omnifaces.org/ui">
  <ui:param name="entityManager" value="#{datasetTemplateManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid columns="2" columnClasses="rtdm, ltd">
          <c:if test="#{not empty entityManager.dataset}"><h:outputText value="#{messages.derivedFromDataset}" />
            <ui:decorate template="/fragments/display.xhtml">
              <ui:include src="/fragments/entity-link-name.xhtml">
                <ui:param name="instance" value="#{datasetTemplateManager.dataset}" />
              </ui:include>
            </ui:decorate>
          </c:if>

          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="#{constants.NAME}" value="#{datasetTemplate.name}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <ui:include src="/fragments/supervisor-autocomplete-required.xhtml">
            <ui:param name="disabled" value="#{not identityManager.hasCurrentUserRole('containerManager')}" />
          </ui:include>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea id="description" value="#{datasetTemplate.description}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.attributes} (#{datasetTemplate.datasetTemplateAttributes.size()})" />
          <ui:decorate template="/fragments/required.xhtml">
            <p:dataTable id="datasetTemplateAttributes" styleClass="inner hide-table-body">
              <p:column>
                <f:facet name="header">
                  <h:panelGrid columns="1" styleClass="nowrap textleft">
                    <h:outputText value="#{messages.position}" />
                    <h:outputText value="#{messages.name}" />
                    <h:outputText value="#{messages.type}" />
                    <h:outputText value="#{messages.required}" />
                  </h:panelGrid>
                </f:facet>
              </p:column>
              <c:forEach items="#{datasetTemplate.datasetTemplateAttributes}" var="datasetTemplateAttribute" varStatus="status">
                <p:column>
                  <f:facet name="header">
                    <h:panelGrid columns="4" styleClass="icon-table noborder">
                      <h:outputText value="#{datasetTemplateAttribute.position}" title="#{messages.position}" styleClass="normal-font-weight" />
                      <p:commandLink rendered="#{datasetTemplate.isRenderedRemoveAttribute(datasetTemplateAttribute)}"
                                     actionListener="#{datasetTemplate.removeAttribute(datasetTemplateAttribute)}"
                                     title="#{messages.removeAttributeHint}" global="false" process="edit:datasetTemplateAttributes"
                                     update="edit:datasetTemplateAttributes" oncomplete="fixOversize();" styleClass="font-larger">
                        <i class="fas fa-minus-square" />
                      </p:commandLink>
                      <p:commandLink rendered="#{datasetTemplateAttribute.movable}" actionListener="#{datasetTemplateAttribute.move}" title="#{messages.moveAttributeHint}"
                                     global="false" process="edit:datasetTemplateAttributes" update="edit:datasetTemplateAttributes"
                                     oncomplete="fixOversize();" styleClass="font-larger">
                        <i class="fas fa-caret-square-right" />
                      </p:commandLink>
                      <p:message id="attribute#{status.index}message" for="attribute#{status.index}" styleClass="errorMessage" />
                    </h:panelGrid>
                    <h:panelGrid columns="1" styleClass="dataset-header">
                      <h:inputText id="attribute#{status.index}" value="#{datasetTemplateAttribute.name}" valueChangeListener="#{datasetTemplateManager.attributeNameChanged}"
                                   title="#{messages.datasetNameOfAttribute} #{datasetTemplateAttribute.position}" styleClass="datasetField editWidthMedium">
                        <f:attribute name="index" value="#{status.index}" />
                        <p:ajax event="change" process="edit:datasetTemplateAttributes" update="edit:datasetTemplateAttributes" />
                      </h:inputText>
                      <ui:include src="/fragments/autocomplete.xhtml">
                        <ui:param
                          name="forceSelection"
                          value="false" />
                        <ui:param
                          name="clearButtonRendered"
                          value="false" />
                        <ui:param
                          name="componentId"
                          value="datasetTemplateAttributeType#{status.index}" />
                        <ui:param
                          name="value"
                          value="#{datasetTemplateAttribute.type}" />
                        <ui:param
                          name="noConverter"
                          value="true" />
                        <o:methodParam
                          name="completeMethod"
                          value="#{datasetTemplateAttributeManager.getTypesFiltered}" />
                        <ui:param
                          name="itemLabel"
                          value="#{item}" />
                        <ui:param
                          name="styleClass"
                          value="editWidthMedium" />
                        <ui:param
                          name="title"
                          value="#{messages.datasetTypeOfAttribute} #{datasetTemplateAttribute.position}" />
                      </ui:include>
                      <p:selectOneButton id="required" value="#{datasetTemplateAttribute.required}" styleClass="editWidthMedium">
                        <f:selectItem itemLabel="#{messages.no}" itemValue="#{false}" />
                        <f:selectItem itemLabel="#{messages.yes}" itemValue="#{true}" />
                      </p:selectOneButton>
                      <p:message
                        id="datasetTemplateAttributeType#{status.index}message"
                        for="datasetTemplateAttributeType#{status.index}"
                        styleClass="errorMessage" />
                    </h:panelGrid>
                  </f:facet>
                </p:column>
              </c:forEach>
            </p:dataTable>

          </ui:decorate>
          <h:outputText value="&#160;" />
          <ui:decorate template="/fragments/display.xhtml">
            <h:panelGrid columns="3" styleClass="action">
              <p:commandButton actionListener="#{datasetTemplate.addAttribute}" value="#{messages.addAttribute}" title="#{messages.addAttributeHint}"
                               immediate="true" update="@form" global="false" oncomplete="fixOversize();" />
            </h:panelGrid>
          </ui:decorate>
        </h:panelGrid>
        <h:panelGrid columns="2" styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
