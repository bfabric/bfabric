<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('institutes') and not empty department.allInstitutes}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="institute" />
      <ui:param
        name="tableContext"
        value="#{department.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{department.allInstitutes}" />
      <ui:param
        name="hideColumns"
        value="department" />
    </ui:include>
  </c:if>
</ui:composition>
