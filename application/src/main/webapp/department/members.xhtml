<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('members') and identityManager.hasCurrentUserRole('containerReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="user" />
      <ui:param
        name="tableContext"
        value="#{department.tableContext}_member" />
      <ui:param
        name="tableContent"
        value="#{department.members}" />
      <ui:param
        name="showColumns"
        value="institute" />
      <ui:param
        name="hideColumns"
        value="company,organization,active,emailVerified,computerLoginActivated,massMailEnabled,invalidLoginAttempts,lastLogin" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
