<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <ui:define name="pageTitle">
    <h:outputText value="#{messages.mergeDepartments}" />
  </ui:define>

  <ui:define name="body">
    <h:form id="merge">
      <h:panelGrid
        columns="4"
        columnClasses=", textright padding-right-small, , textleft"
        styleClass="align-middle">
        <h:outputText value="#{messages.id}" />
        <ui:include src="/fragments/entity-link.xhtml">
          <ui:param
            name="instance"
            value="#{departmentManager.department}" />
        </ui:include>
        <span />
        <ui:include src="/fragments/entity-link.xhtml">
          <ui:param
            name="instance"
            value="#{departmentManager.merged}" />
        </ui:include>

        <h:outputText value="#{messages.name}" />
        <h:outputText value="#{departmentManager.department.name}" />
        <h:selectOneRadio
          id="#{constants.NAME}"
          layout="lineDirection"
          value="#{departmentManager.mergeSelection.name}">
          <f:selectItem itemValue="#{departmentManager.department.name}" />
          <f:selectItem itemValue="#{departmentManager.merged.name}" />
        </h:selectOneRadio>
        <h:outputText value="#{departmentManager.merged.name}" />

        <h:outputText value="#{messages.organization}" />
        <h:outputText value="#{departmentManager.department.organization.name}" />
        <h:selectOneRadio
          id="organization"
          layout="lineDirection"
          value="#{departmentManager.mergeSelection.organization}"
          converter="omnifaces.SelectItemsConverter">
          <f:selectItem itemValue="#{departmentManager.department.organization}" />
          <f:selectItem itemValue="#{departmentManager.merged.organization}" />
        </h:selectOneRadio>
        <h:outputText value="#{departmentManager.merged.organization.name}" />

        <p:spacer height="10" />
        <h:outputText value="" />
        <h:outputText value="" />
        <h:outputText value="" />

        <h:outputText value="#{messages.institutes}" />
        <h:outputText value="#{departmentManager.department.allInstitutes.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{departmentManager.merged.allInstitutes.size()}" />

        <h:outputText value="#{messages.members}" />
        <h:outputText value="#{departmentManager.department.members.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{departmentManager.merged.members.size()}" />

        <h:outputText value="#{messages.projects}" />
        <h:outputText value="#{projectList.getLazyModelByDepartmentId(departmentManager.department.id).size()}" />
        <h:outputText value="" />
        <h:outputText value="#{projectList.getLazyModelByDepartmentId(departmentManager.merged.id).size()}" />

        <h:outputText value="#{messages.orders}" />
        <h:outputText value="#{orderList.getLazyModelByDepartmentId(departmentManager.department.id).size()}" />
        <h:outputText value="" />
        <h:outputText value="#{orderList.getLazyModelByDepartmentId(departmentManager.merged.id).size()}" />
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{departmentManager.merge}"
          value="#{messages.merge}"
          update="@form" />
        <p:commandButton
          action="#{departmentManager.getManageDuplicatesScreenRedirectURL()}"
          value="#{messages.cancel}"
          immediate="true" />
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
