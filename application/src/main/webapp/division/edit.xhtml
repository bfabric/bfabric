<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{divisionManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.company}" />
          <ui:decorate template="/fragments/required.xhtml">
            <ui:param
              name="componentId"
              value="companyautocomplete" />
            <h:panelGrid
              columns="3"
              styleClass="noborder-rightpadding">
              <h:panelGroup>
                <ui:include src="/fragments/autocomplete.xhtml">
                  <ui:param
                    name="listContext"
                    value="company" />
                  <ui:param
                    name="value"
                    value="#{division.company}" />
                  <o:methodParam
                    name="completeMethod"
                    value="#{companyService.getFilteredOrderedByName}" />
                  <ui:param
                    name="itemLabel"
                    value="#{item.name}" />
                  <ui:param
                    name="attributes"
                    value="className:Company" />
                  <ui:param
                    name="styleClass"
                    value="editWidthExtraLarge" />
                </ui:include>
              </h:panelGroup>
              <p:commandLink
                id="addCompanyButton"
                action="#{divisionManager.createNewParentCompany}"
                immediate="true"
                oncomplete="PF('addCompanyForDivisionDialog').show()"
                update="addCompanyForDivisionForm">
                <ui:include src="/fragments/add-button-icon.xhtml" />
              </p:commandLink>
            </h:panelGrid>
          </ui:decorate>

          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{division.name}"
              styleClass="editWidthExtraLarge">
              <f:attribute
                name="companyautocomplete"
                value="#{constants.EDIT}:companyautocomplete" />
            </h:inputText>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-edit-cancel.xhtml" />
        </h:panelGrid>
      </h:form>

      <ui:include src="/company/add-modal-for-division.xhtml" />
    </ui:define>
  </ui:decorate>
</ui:composition>
