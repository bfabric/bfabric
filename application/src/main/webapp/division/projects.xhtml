<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('projects') and identityManager.hasCurrentUserRole('containerReader') and not empty division.projects}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="project" />
      <ui:param
        name="tableContext"
        value="#{division.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{division.projects}" />
      <ui:param
        name="hideColumns"
        value="institute,department,organization,division,company" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
