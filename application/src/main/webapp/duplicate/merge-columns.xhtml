<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column
    rendered="#{showColumns.contains('addCheckbox')}"
    exportable="false">
    <h:selectBooleanCheckbox disabled="#{duplicateManager.selectedEntities.contains(entity) or duplicateManager.selectedEntities.size() > 1}">
      <p:ajax
        listener="#{duplicateManager.selectEntity(entity)}"
        update="@form"
        process="@([id$=merge-entities-options]), @([id$=merge-entities-options-selected])"
        immediate="true"
        oncomplete="fixOversize();"
        global="true" />
    </h:selectBooleanCheckbox>
  </p:column>

  <p:column
    rendered="#{showColumns.contains('removeCheckbox')}"
    exportable="false">
    <h:selectBooleanCheckbox>
      <p:ajax
        listener="#{duplicateManager.deselectEntity(entity)}"
        update="@form"
        process="@([id$=merge-entities-options]), @([id$=merge-entities-options-selected])"
        immediate="true"
        global="true" />
    </h:selectBooleanCheckbox>
  </p:column>

  <c:if test="#{not empty includeType}">
    <ui:include src="/#{includeType}/columns.xhtml" />
  </c:if>
</ui:composition>
