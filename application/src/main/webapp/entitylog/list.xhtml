<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('containerManager')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.entityLog}" />
  </ui:define>

  <ui:define name="body">
    <p>
      <h:outputText rendered="#{not identityManager.hasCurrentUserRole('admin')}" value="#{messages.entityLogHint} #{entityLogService.excludedEntityClassNames}" />
    </p>
    <ui:include src="/fragments/lazylist.xhtml">
      <ui:param
        name="tableType"
        value="entitylog" />
      <ui:param
        name="tableContent"
        value="#{entityLogManager.lazyModel}" />
      <ui:param
        name="showColumns"
        value="parentEntityClassName,parentEntityId" />
    </ui:include>
  </ui:define>
</ui:composition>
