<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <ui:include src="/fragments/column/select-checkbox.xhtml" />
  <ui:include src="/fragments/column/id.xhtml" />
  <ui:include src="/fragments/column/user.xhtml" />
  <ui:include src="/fragments/column/eventtype.xhtml" />
  <ui:include src="/fragments/column/startdate-time.xhtml" />
  <ui:include src="/fragments/column/enddate-time.xhtml" />
  <p:column
    sortBy="#{entity.duration}"
    filterBy="#{entity.duration}">
    <f:facet name="header">
      <h:outputText value="#{messages.days}" />
    </f:facet>
    <h:outputText value="#{entity.duration}" />
  </p:column>
  <p:column
    sortBy="#{entity.accountedDays}"
    filterBy="#{entity.accountedDays}">
    <f:facet name="header">
      <h:outputText value="#{messages.accountedDays}" />
    </f:facet>
    <h:outputText value="#{entity.accountedDays}" />
  </p:column>
  <p:column
    rendered="#{not hideColumns.contains('repeaterId')}"
    sortBy="#{entity.repeaterId}"
    filterBy="#{entity.repeaterId}">
    <f:facet name="header">
      <h:outputText value="#{messages.repeaterId}" />
    </f:facet>
    <p:link
      rendered="#{not empty entity.repeaterId}"
      outcome="show.xhtml"
      value="#{entity.repeaterId}">
      <f:param
        name="id"
        value="#{entity.repeaterId}" />
      <f:param
        name="tab"
        value="#{constants.DETAILS}" />
    </p:link>
  </p:column>

  <ui:include src="/fragments/column/description.xhtml" />
  <ui:include src="/fragments/column/created-modified.xhtml" />
</ui:composition>
