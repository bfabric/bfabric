<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id.xhtml" />
      <ui:include src="/fragments/details/user.xhtml" />
      <ui:include src="/fragments/details/eventtype.xhtml" />

      <h:outputText value="#{messages.startDate}" />
      <h:outputText value="#{event.startDateAsText}" />

      <h:outputText value="#{messages.endDate}" />
      <h:outputText value="#{event.endDateAsText}" />

      <h:outputText value="#{messages.days}" />
      <h:outputText value="#{event.duration}" />

      <c:if test="#{event.eventType.accountable}">
        <h:outputText value="#{messages.accountedDays}" />
        <h:outputText value="#{event.accountedDays}" />
      </c:if>

      <c:if test="#{event.repeaterEvent}">
        <h:outputText value="#{messages.repeaterId}" />
        <p:link
          outcome="show.xhtml"
          value="#{event.repeaterId}">
          <f:param
            name="id"
            value="#{event.repeaterId}" />
          <f:param
            name="tab"
            value="#{constants.DETAILS}" />
        </p:link>
      </c:if>

      <ui:include src="/fragments/details/description-links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="7"
      styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <ui:include src="/fragments/button/clone.xhtml" />
      <ui:include src="/fragments/button/export-and-download-ics.xhtml" />
      <p:button
        styleClass="nowrap"
        outcome="/eventschedule/list.xhtml"
        value="#{messages.show}"
        title="#{messages.showEventInAgendaHint}">
        <f:param
          name="interval"
          value="#{agendaEventManager.getNewIntervalDate(event.startDate.toLocalDate())}" />
      </p:button>
      <c:if test="#{event.deletable}">
        <c:if test="#{not event.repeaterEvent}">
          <ui:include src="/fragments/button/delete.xhtml" />
        </c:if>
        <c:if test="#{event.repeaterEvent}">
          <h:form>
            <h:panelGrid columns="3">
              <p:commandButton
                action="#{eventManager.removeThis}"
                value="#{messages.deleteEventThis}"
                title="#{messages.deleteEventThisHint}">
                <ui:include src="/fragments/confirm-dialog-delete.xhtml" />
              </p:commandButton>
              <p:commandButton
                action="#{eventManager.removeFollowing}"
                value="#{messages.deleteEventFollowing}"
                title="#{messages.deleteEventFollowingHint}">
                <ui:include src="/fragments/confirm-dialog-delete.xhtml" />
              </p:commandButton>
              <p:commandButton
                action="#{eventManager.removeAll}"
                value="#{messages.deleteEventAll}"
                title="#{messages.deleteEventAllHint}"
                rendered="#{event.deletableAll}">
                <ui:include src="/fragments/confirm-dialog-delete.xhtml" />
              </p:commandButton>
            </h:panelGrid>
          </h:form>
        </c:if>
      </c:if>
      <ui:include src="/fragments/button/list.xhtml">
        <ui:param
          name="rendered"
          value="#{identityManager.hasCurrentUserRole('agendaManager')}" />
      </ui:include>
    </h:panelGrid>
  </c:if>
</ui:composition>
