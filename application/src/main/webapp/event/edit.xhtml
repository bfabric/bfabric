<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{eventManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form
        id="#{constants.EDIT}"
        onsubmit="#{eventManager.resetRefererURL()}">
        <h:panelGrid
          id="eventTypeGrid"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.type}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="eventType"
              value="#{event.eventType}"
              valueChangeListener="#{event.typeChanged}"
              styleClass="editWidthExtraLarge"
              converter="omnifaces.SelectItemsConverter">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{eventTypeList.getEventTypesByUserOrderByName(currentUser)}"
                var="item"
                itemLabel="#{item.name}" />
              <p:ajax
                event="change"
                update="eventTypeGrid"
                process="eventTypeGrid"
                global="false" />
            </h:selectOneMenu>
          </ui:decorate>
          <h:outputText
            value="#{messages.user}"
            rendered="#{event.userEditable}" />
          <h:panelGroup rendered="#{event.userEditable}">
            <ui:include src="/fragments/autocomplete-required.xhtml">
              <ui:param
                name="listContext"
                value="eventUser" />
              <ui:param
                name="value"
                value="#{event.user}" />
              <ui:param
                name="required"
                value="true" />
              <o:methodParam
                name="completeMethod"
                value="#{event.getEmployeesIncludingUser}" />
              <ui:param
                name="itemLabel"
                value="#{item.fullLastFirstName}" />
            </ui:include>
          </h:panelGroup>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.startDate}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:panelGrid
              id="startDateGrid"
              columns="4"
              styleClass="noborder-rightpadding"
              title="#{messages.eventStartDateHint}">
              <p:datePicker
                id="startDate"
                value="#{event.startDateSlot}"
                disabledDays="#{event.disabledWeekends}"
                hideOnDateTimeSelect="true">
                <p:ajax
                  event="dateSelect"
                  listener="#{eventManager.startDateChanged}"
                  update="startDateGrid, endDateGrid, repeaterDetails"
                  process="startDateGrid, endDateGrid"
                  global="false" />
              </p:datePicker>
              <h:selectOneMenu
                id="startSlot"
                value="#{event.startSlot}"
                styleClass="editWidthSmall">
                <f:selectItem itemValue="AM" />
                <f:selectItem itemValue="PM" />
                <p:ajax
                  event="change"
                  listener="#{eventManager.startDateChanged}"
                  update="startDateGrid, endDateGrid, repeaterDetails"
                  process="startDateGrid, endDateGrid"
                  global="false" />
              </h:selectOneMenu>
              <p:message
                for="startDate"
                styleClass="errorMessage" />
            </h:panelGrid>
          </ui:decorate>

          <h:outputText value="#{messages.endDate}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:panelGrid
              id="endDateGrid"
              columns="4"
              styleClass="noborder-rightpadding"
              title="#{messages.eventEndDateHint}">
              <p:datePicker
                id="endDate"
                value="#{event.endDateSlot}"
                disabledDays="#{event.disabledWeekends}"
                hideOnDateTimeSelect="true">
                <p:ajax
                  event="dateSelect"
                  listener="#{eventManager.endDateChanged}"
                  update="startDateGrid, endDateGrid, repeaterDetails"
                  process="startDateGrid, endDateGrid"
                  global="false" />
              </p:datePicker>
              <h:selectOneMenu
                id="endSlot"
                value="#{event.endSlot}"
                styleClass="editWidthSmall">
                <f:selectItem itemValue="AM" />
                <f:selectItem itemValue="PM" />
                <p:ajax
                  event="change"
                  listener="#{eventManager.endDateChanged}"
                  update="startDateGrid, endDateGrid, repeaterDetails"
                  process="startDateGrid, endDateGrid"
                  global="false" />
              </h:selectOneMenu>
              <p:message
                for="endDate"
                styleClass="errorMessage" />
            </h:panelGrid>
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="description"
              value="#{event.description}"
              rows="3"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGroup id="repeaterDetails">
          <h:panelGrid
            columns="2"
            columnClasses="rtdm, ltd"
            rendered="#{not event.managed}">
            <h:outputText value="#{messages.repeat}" />
            <ui:decorate template="/fragments/edit.xhtml">
              <h:selectOneMenu
                id="repeat"
                value="#{event.repeaterHelper.repeat}"
                valueChangeListener="#{event.repeatChanged}"
                immediate="true"
                styleClass="editWidthSmall">
                <f:selectItem
                  itemValue="#{true}"
                  itemLabel="#{messages.yes}" />
                <f:selectItem
                  itemValue="#{false}"
                  itemLabel="#{messages.no}" />
                <p:ajax
                  event="change"
                  update="repeaterDetails"
                  global="false" />
              </h:selectOneMenu>
            </ui:decorate>
          </h:panelGrid>

          <h:panelGrid
            columns="2"
            columnClasses="rtdm, ltd"
            rendered="#{not event.managed and event.repeaterHelper.repeat}">
            <h:outputText value="#{messages.every}" />
            <ui:decorate template="/fragments/required.xhtml">
              <h:panelGrid
                columns="3"
                title="#{repeatPeriodicHint}">
                <p:spinner
                  id="weeks"
                  value="#{event.repeaterHelper.weeks}"
                  valueChangeListener="#{event.repeaterWeeksChanged}"
                  required="true"
                  min="1"
                  max="52"
                  stepFactor="1"
                  size="3"
                  decimalPlaces="0"
                  thousandSeparator="">
                  <p:ajax
                    event="change"
                    update="repeatEndDate"
                    global="false" />
                </p:spinner>
                <h:outputText value="&#160;#{messages.weeks}" />
                <p:message
                  id="weeksError"
                  for="weeks"
                  styleClass="errorMessage" />
              </h:panelGrid>
            </ui:decorate>

            <h:outputText value="#{messages.until}" />
            <ui:decorate template="/fragments/edit.xhtml">
              <p:datePicker
                id="repeatEndDate"
                value="#{event.repeaterHelper.endDate}"
                mindate="#{event.repeaterHelperValidUntilMinDate}"
                required="true">
                <p:ajax
                  event="dateSelect"
                  listener="#{event.repeaterEndChanged}"
                  update="startDateGrid, endDateGrid, repeatEndDate"
                  global="false" />
              </p:datePicker>
            </ui:decorate>
          </h:panelGrid>
        </h:panelGroup>

        <h:panelGrid
          id="mailSend"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.sendEmailNotification}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:panelGrid
              columns="3"
              styleClass="noborder-rightpadding">
              <h:selectBooleanCheckbox
                id="sendEmail"
                value="#{eventManager.sendMail}"
                valueChangeListener="#{eventManager.sendMailChanged}"
                immediate="true">
                <p:ajax
                  event="change"
                  update="mailSend"
                  global="false" />
              </h:selectBooleanCheckbox>
              <c:if test="#{not empty configuration.absencesMailAddress}">
                <h:outputText value="to #{configuration.absencesMailAddress}" />
                <h:outputText value="&#160;and&#160;" rendered="#{eventManager.sendMail}" />
              </c:if>
            </h:panelGrid>
          </ui:decorate>

          <h:outputText
            value="#{messages.recipients}"
            rendered="#{eventManager.sendMail and (not empty userList.employeesRegular or not empty userGroupList.allEnabledInternalOrderByName)}" />
          <h:panelGroup rendered="#{eventManager.sendMail and not empty userGroupList.allEnabledInternalOrderByName}">
            <ui:decorate template="/fragments/edit.xhtml">
              <h:panelGrid
                columns="1"
                styleClass="noborder-rightpadding">
                <h:selectOneMenu
                  id="userGroup"
                  value="#{eventManager.userGroup}"
                  required="false"
                  styleClass="editWidthExtraLarge"
                  converter="omnifaces.SelectItemsConverter">
                  <f:selectItem itemLabel="#{messages.selectUserGroup}" />
                  <f:selectItems
                    value="#{userGroupList.allEnabledInternalOrderByName}"
                    var="item"
                    itemLabel="#{item.getNameWithUserNamesTrunc(120)}" />
                </h:selectOneMenu>
              </h:panelGrid>
            </ui:decorate>
          </h:panelGroup>

          <h:outputText
            value="&#160;"
            rendered="#{eventManager.sendMail and not empty userList.employeesRegular and not empty userGroupList.allEnabledInternalOrderByName}" />
          <h:panelGroup rendered="#{eventManager.sendMail and not empty userList.employeesRegular}">
            <ui:decorate template="/fragments/edit.xhtml">
              <ui:include src="/fragments/autocomplete.xhtml">
                <ui:param
                  name="listContext"
                  value="recipient" />
                <ui:param
                  name="value"
                  value="#{eventManager.recipientsList}" />
                <o:methodParam
                  name="completeMethod"
                  value="#{eventManager.getEmployeesFiltered}" />
                <ui:param
                  name="itemLabel"
                  value="#{item.fullName}" />
                <ui:param
                  name="multiple"
                  value="true" />
                <ui:param
                  name="styleClass"
                  value="editWidthExtraLarge" />
              </ui:include>
            </ui:decorate>
          </h:panelGroup>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
