<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('agendaManager')}" />
    <f:viewAction action="#{agendaEventManager.closeAgendaForPreviousYear}" />
    <f:viewAction action="#{sessionManager.printFacesMessages}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.closeAgendaYear}" />
  </ui:define>

  <ui:define name="body">
    <ui:repeat
      value="#{agendaEventManager.closeAgendaYearResult}"
      var="item">
      <h:outputText value="#{item}" />
      <br />
    </ui:repeat>
  </ui:define>
</ui:composition>
