<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <tr>
    <td class="agendafirstcolumn"><h:outputText value="Public Events&#160;" /></td>
    <ui:repeat
      var="slot"
      value="#{agendaEventHelper.publicSlots}">
      <ui:fragment rendered="#{slot.weekend}">
        <td>&#160;</td>
      </ui:fragment>
      <ui:fragment rendered="#{not slot.weekend}">
        <ui:fragment rendered="#{slot.hasEvent()}">
          <td
            class="slot slotLink"
            title="#{slot.description}"
            onclick="window.location.href='../event/show.html?id=#{slot.event.id}';"
            bgcolor="#{slot.color}">&#160;
          </td>
        </ui:fragment>
        <ui:fragment rendered="#{not slot.hasEvent()}">
          <td
            class="slot"
            title="#{slot.description}"
            bgcolor="#{slot.color}">&#160;
          </td>
        </ui:fragment>
      </ui:fragment>
    </ui:repeat>
  </tr>
</ui:composition>
