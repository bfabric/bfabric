<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <tr>
    <td class="agendafirstcolumn" />
    <ui:repeat
      var="slot"
      value="#{agendaEventHelper.headSlots}">
      <ui:fragment rendered="#{slot.weekend}">
        <td>&#160;</td>
      </ui:fragment>
      <ui:fragment rendered="#{not slot.weekend and slot.morningSlot}">
        <td
          colspan="2"
          class="slotHeader"
          style="#{slot.dayColor}">
          <h:outputText
            value="#{slot.dayOfMonth}" />
          <br />
          <h:outputText value="#{slot.weekday}" />
        </td>
      </ui:fragment>
    </ui:repeat>
  </tr>
</ui:composition>
