<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <tr />
  <tr>
    <td />
    <ui:repeat
      var="slot"
      value="#{agendaEventHelper.headSlots}">
      <ui:fragment rendered="#{slot.isMonthSpanGreaterThan(0)}">
        <ui:fragment rendered="#{slot.isMonthSpanGreaterThan(9)}">
          <td colspan="#{slot.monthSpan}"><h:outputText
            value="#{slot.monthYearAsText}"
            class="slotHeaderYear" /></td>
        </ui:fragment>
        <ui:fragment rendered="#{not slot.isMonthSpanGreaterThan(9)}">
          <td
            colspan="#{slot.monthSpan}"
            class="slotHeaderYear" />
        </ui:fragment>
      </ui:fragment>
    </ui:repeat>
  </tr>
  <tr />
</ui:composition>
