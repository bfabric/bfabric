<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('externaljobs')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="externaljob" />
      <ui:param
        name="tableContext"
        value="#{executable.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{externalJobList.getLazyModelByExecutable(executable)}" />
      <ui:param
        name="hideColumns"
        value="executable" />
    </ui:include>
  </c:if>
</ui:composition>
