<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('executableManager')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.executables}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/lazylist.xhtml">
      <ui:param name="tableType" value="executable" />
      <ui:param name="showColumns" value="wrapperCreatorExecutable, workunitSize" />
    </ui:include>
    <h:panelGrid
      columns="2"
      styleClass="action">
      <p:button
        outcome="edit.xhtml"
        value="#{messages.create}"
        rendered="#{identityManager.hasCurrentUserRole('executableManager')}" />
      <p:button
        outcome="/executable/list.xhtml"
        value="#{messages.list} #{messages.nonWorkunitExecutables}">
        <ui:include src="/fragments/context-container-param.xhtml" />
      </p:button>
    </h:panelGrid>
  </ui:define>
</ui:composition>
