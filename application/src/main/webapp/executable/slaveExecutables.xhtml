<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('slaveExecutables') and not empty executable.slaveExecutables}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="executable" />
      <ui:param
        name="tableContext"
        value="#{executable.tableContext}_slave" />
      <ui:param
        name="tableContent"
        value="#{executable.slaveExecutables}" />
    </ui:include>
  </c:if>
</ui:composition>
