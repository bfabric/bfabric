<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('storages') and not empty executable.storages}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="storage" />
      <ui:param
        name="tableContext"
        value="#{executable.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{executable.storages}" />
    </ui:include>
  </c:if>
</ui:composition>
