<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{feedbackManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="edit-feedback">
        <h:panelGrid
          id="templateGrid"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.template}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="feedbackTemplate"
              value="#{feedback.template}"
              styleClass="editWidthExtraLarge"
              converter="omnifaces.SelectItemsConverter">
              <f:selectItem itemLabel="#{messages.selectAnItem}" />
              <f:selectItems
                value="#{feedbackTemplateList.enabledTemplates}"
                var="item"
                itemLabel="#{item.displayName}" />
              <p:ajax
                event="change"
                listener="#{feedbackManager.feedbackTemplateChange()}"
                update="@form" />
            </h:selectOneMenu>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGroup rendered="#{not empty feedback.template}">
          <h:panelGrid
            columns="2"
            columnClasses="rtdm, ltd">
            <h:outputText value="#{messages.answers}" />
            <ui:decorate template="/fragments/required.xhtml">
              <ui:include src="/fragments/show-datatable.xhtml">
                <ui:param
                  name="tableContext"
                  value="all" />
                <ui:param
                  name="tableType"
                  value="feedbackanswer" />
                <ui:param
                  name="showColumns"
                  value="showInput" />
                <ui:param
                  name="tableContent"
                  value="#{feedback.answersOrderedList}" />
                <ui:param
                  name="paginator"
                  value="false" />
                <ui:param
                  name="styleClass"
                  value="align-middle extraBottomMargin inner" />
              </ui:include>
            </ui:decorate>

            <c:if test="#{feedback.template.projectsRendered}">
              <h:outputText value="#{messages.project}" />
              <ui:include src="/fragments/autocomplete-required.xhtml">
                <ui:param
                  name="listContext"
                  value="feedbackProject" />
                <ui:param
                  name="value"
                  value="#{feedback.container}" />
                <ui:param
                  name="required"
                  value="true" />
                <o:methodParam
                  name="completeMethod"
                  value="#{projectService.getAcceptedReadableProjectsFiltered}" />
                <ui:param
                  name="itemLabel"
                  value="#{item.id}" />
                <ui:param
                  name="includeColumns"
                  value="/container/autocomplete-columns.xhtml" />
              </ui:include>
            </c:if>

            <c:if test="#{feedback.template.ordersRendered}">
              <h:outputText value="#{messages.order}" />
              <ui:include src="/fragments/autocomplete-required.xhtml">
                <ui:param
                  name="listContext"
                  value="feedbackOrder" />
                <ui:param
                  name="value"
                  value="#{feedback.container}" />
                <ui:param
                  name="required"
                  value="true" />
                <o:methodParam
                  name="completeMethod"
                  value="#{orderService.getOrdersFiltered}" />
                <ui:param
                  name="itemLabel"
                  value="#{item.id}" />
                <ui:param
                  name="includeColumns"
                  value="/container/autocomplete-columns.xhtml" />
              </ui:include>
            </c:if>
          </h:panelGrid>
        </h:panelGroup>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <p:commandButton
            action="#{feedbackManager.save}"
            value="#{messages.save}"
            update="@form">
            <p:confirm
              header="#{messages.submitFeedback}"
              message="#{messages.confirmActionMessage}"
              icon="ui-icon-alert" />
            <ui:include src="/fragments/confirm-dialog.xhtml" />
          </p:commandButton>
          <ui:decorate template="/fragments/button/cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
