<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:event
      type="preRenderView"
      listener="#{identityManager.restrict(feedback.editable)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.add} #{messages.feedback}" />
  </ui:define>

  <ui:define name="body">
    <h:form id="edit-feedback">
      <h:panelGroup rendered="#{feedback.template.hintRendered}">
        <h:outputText
          value="#{messages.feedbackNoteHint}"
          styleClass="error" />
        <br />
        <h:outputText value="#{messages.feedbackNoteFormHint} " />
        <h:outputText value="#{feedback.container.entityName} #{feedback.container.id}. " />
      </h:panelGroup>
      <h:panelGroup>
        <h:outputText value="#{messages.feedbackThanksHint}" />
      </h:panelGroup>
      <h:panelGrid rendered="#{not empty feedback.template}">
        <ui:include src="/fragments/show-datatable.xhtml">
          <ui:param
            name="tableContext"
            value="all" />
          <ui:param
            name="tableType"
            value="feedbackanswer" />
          <ui:param
            name="showColumns"
            value="showInput" />
          <ui:param
            name="tableContent"
            value="#{feedback.answersOrderedList}" />
          <ui:param
            name="paginator"
            value="false" />
          <ui:param
            name="styleClass"
            value="align-middle" />
        </ui:include>
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{feedbackManager.save}"
          value="#{messages.submit}"
          update="@form">
          <p:confirm
            header="#{messages.submitFeedback}"
            message="#{messages.confirmActionMessage}"
            icon="ui-icon-alert" />
          <ui:include src="/fragments/confirm-dialog.xhtml" />
        </p:commandButton>
        <p:commandButton
          action="#{feedbackManager.cancelSubmitFeedback}"
          value="#{messages.cancel}"
          immediate="true" />
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
