<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid columns="2" columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />
      <ui:include src="/fragments/details/widgettype.xhtml" />
      <ui:include src="/fragments/details/columns.xhtml" />
      <ui:include src="/fragments/details/decimalplaces.xhtml" />
      <ui:include src="/fragments/details/minvalue.xhtml" />
      <ui:include src="/fragments/details/maxvalue.xhtml" />
      <ui:include src="/fragments/details/rows.xhtml" />
      <ui:include src="/fragments/details/step.xhtml" />
      <ui:include src="/fragments/details/symbol.xhtml" />
      <ui:include src="/fragments/details/requiresCustomOptions.xhtml" />
      <ui:include src="/fragments/details/description-enabled-links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid columns="5" styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <ui:include src="/fragments/button/clone.xhtml" />
      <c:if test="#{identityManager.hasCurrentUserRole('feedbackManager')}">
        <ui:include src="/fragments/button/switchenabled.xhtml" />
      </c:if>
      <ui:include src="/fragments/button/delete.xhtml" />
      <ui:include src="/fragments/button/list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
