<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
  <ui:param name="entityManager" value="#{feedbackQuestionTypeManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid columns="2" columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="#{constants.NAME}" value="#{feedbackQuestionType.name}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.widgetType}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu id="widgetType" value="#{feedbackQuestionType.widgetType}" valueChangeListener="#{feedbackQuestionType.widgetTypeChanged}"
                             styleClass="editWidthExtraLarge" converter="omnifaces.SelectItemsConverter">
              <f:selectItem itemLabel="#{messages.selectAnItem}" itemDisabled="true" />
              <f:selectItems value="#{widgetTypeList.resultList}" var="item" itemLabel="#{item.name}" />
              <p:ajax event="change" update="widgetTypeSpecific" global="false" />
            </h:selectOneMenu>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid id="widgetTypeSpecific" columns="2" columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.columns}" rendered="#{feedbackQuestionType.widgetType.columns}" />
          <h:panelGroup rendered="#{feedbackQuestionType.widgetType.columns}">
            <ui:decorate template="/fragments/edit.xhtml">
              <p:inputNumber value="#{feedbackQuestionType.columns}" thousandSeparator="" decimalPlaces="0" styleClass="editWidthExtraLarge" rendered="#{feedbackQuestionType.widgetType.columns}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.decimalPlaces}" rendered="#{feedbackQuestionType.widgetType.decimalPlaces}" />
          <h:panelGroup rendered="#{feedbackQuestionType.widgetType.decimalPlaces}">
            <ui:decorate template="/fragments/edit.xhtml">
              <p:inputNumber value="#{feedbackQuestionType.decimalPlaces}" thousandSeparator="" decimalPlaces="0" styleClass="editWidthExtraLarge"
                             rendered="#{feedbackQuestionType.widgetType.decimalPlaces}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.minValue}" rendered="#{feedbackQuestionType.widgetType.minValue}" />
          <h:panelGroup rendered="#{feedbackQuestionType.widgetType.minValue}">
            <ui:decorate template="/fragments/edit.xhtml">
              <p:inputNumber value="#{feedbackQuestionType.minValue}" thousandSeparator="" decimalPlaces="0" styleClass="editWidthExtraLarge" rendered="#{feedbackQuestionType.widgetType.minValue}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.maxValue}" rendered="#{feedbackQuestionType.widgetType.maxValue}" />
          <h:panelGroup rendered="#{feedbackQuestionType.widgetType.maxValue}">
            <ui:decorate template="/fragments/edit.xhtml">
              <p:inputNumber value="#{feedbackQuestionType.maxValue}" thousandSeparator="" decimalPlaces="0" styleClass="editWidthExtraLarge" rendered="#{feedbackQuestionType.widgetType.maxValue}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.rows}" rendered="#{feedbackQuestionType.widgetType.rows}" />
          <h:panelGroup rendered="#{feedbackQuestionType.widgetType.rows}">
            <ui:decorate template="/fragments/edit.xhtml">
              <p:inputNumber value="#{feedbackQuestionType.rows}" thousandSeparator="" decimalPlaces="0" styleClass="editWidthExtraLarge" rendered="#{feedbackQuestionType.widgetType.rows}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.step}" rendered="#{feedbackQuestionType.widgetType.step}" />
          <h:panelGroup rendered="#{feedbackQuestionType.widgetType.step}">
            <ui:decorate template="/fragments/edit.xhtml">
              <p:inputNumber value="#{feedbackQuestionType.step}" thousandSeparator="" decimalPlaces="0" styleClass="editWidthExtraLarge" rendered="#{feedbackQuestionType.widgetType.step}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.symbol}" rendered="#{feedbackQuestionType.widgetType.symbol}" />
          <h:panelGroup rendered="#{feedbackQuestionType.widgetType.symbol}">
            <ui:decorate template="/fragments/edit.xhtml">
              <h:inputText id="symbol" value="#{feedbackQuestionType.symbol}" styleClass="editWidthExtraLarge" rendered="#{feedbackQuestionType.widgetType.symbol}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.requiresCustomOptions}" />
          <ui:decorate template="/fragments/required.xhtml">
            <p:selectOneButton id="requiresCustomOptions" value="#{feedbackQuestionType.requiresCustomOptions}">
              <f:selectItem itemLabel="#{messages.no}" itemValue="#{false}" />
              <f:selectItem itemLabel="#{messages.yes}" itemValue="#{true}" />
            </p:selectOneButton>
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="enabled" value="#{feedbackQuestionType.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea id="description" value="#{feedbackQuestionType.description}" rows="3" styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>
        <h:panelGrid columns="2" styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
