<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{feedbackTemplateManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">

      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{feedbackTemplate.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="questionText"
              value="#{feedbackTemplate.description}"
              rows="5"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          id="typeGrid"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.feedbackTemplateType}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="feedbackTemplateType"
              value="#{feedbackTemplate.feedbackTemplateType}"
              styleClass="editWidthExtraLarge"
              converter="omnifaces.SelectItemsConverter">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{feedbackTemplateTypeList.resultList}"
                var="item"
                itemLabel="#{item.name}" />
              <p:ajax
                event="change"
                update="#{constants.EDIT}:typeGrid"
                global="false" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText
            rendered="#{feedbackTemplate.feedbackTemplateType.project}"
            value="#{messages.templateDefaultProject}" />
          <h:outputText
            rendered="#{feedbackTemplate.feedbackTemplateType.order}"
            value="#{messages.templateDefaultOrder}" />
          <h:panelGroup rendered="#{feedbackTemplate.feedbackTemplateType.project || feedbackTemplate.feedbackTemplateType.order}">
            <ui:decorate template="/fragments/edit.xhtml">
              <h:selectBooleanCheckbox
                id="defaultForType"
                value="#{feedbackTemplate.defaultForType}" />
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.enable}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{feedbackTemplate.enabled}" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.questions}" />
          <ui:decorate template="/fragments/display.xhtml">
            <h:panelGroup id="feedback-questions">
              <h:outputText
                value="No question selected yet!"
                rendered="#{empty feedbackTemplate.questions}" />
              <h:panelGroup rendered="#{not empty feedbackTemplate.questions}">
                <ui:include src="/fragments/datatable.xhtml">
                  <ui:param
                    name="tableContext"
                    value="selectedquestions" />
                  <ui:param
                    name="tableType"
                    value="feedbackquestion" />
                  <ui:param
                    name="tableContent"
                    value="#{feedbackTemplate.questions}" />
                  <ui:param
                    name="showColumns"
                    value="removeQuestionButton" />
                  <ui:param
                    name="paginator"
                    value="false" />
                </ui:include>
              </h:panelGroup>
              <h:panelGroup styleClass="margin-top-4">
                <ui:include src="/fragments/datatable.xhtml">
                  <ui:param
                    name="tableContext"
                    value="all" />
                  <ui:param
                    name="tableType"
                    value="feedbackquestion" />
                  <ui:param
                    name="tableContent"
                    value="#{feedbackQuestionList.resultList}" />
                  <ui:param
                    name="showColumns"
                    value="addQuestionButton" />
                </ui:include>
              </h:panelGroup>
            </h:panelGroup>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
