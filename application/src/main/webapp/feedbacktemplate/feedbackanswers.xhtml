<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('feedbackanswers')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="feedbackanswer" />
      <ui:param
        name="tableContext"
        value="#{feedbackTemplate.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{feedbackTemplate.feedbackAnswers}" />
      <ui:param
        name="showColumns"
        value="showQuestions, showForStatistics, showForQuestion" />
      <ui:param
        name="hideColumns"
        value="feedbackTemplate" />
    </ui:include>
  </c:if>
</ui:composition>
