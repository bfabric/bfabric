<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('questions')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="feedbackquestion" />
      <ui:param
        name="tableContext"
        value="#{feedbackTemplate.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{feedbackTemplate.questions}" />
      <ui:param
        name="showColumns"
        value="addMoveButtons" />
    </ui:include>
    <h:panelGrid styleClass="action">
      <p:button
        outcome="/feedbackquestion/edit.xhtml"
        value="#{messages.addFeedbackQuestion}"
        rendered="#{feedbackTemplate.updatable}">
        <f:param
          name="feedbackTemplateId"
          value="#{feedbackTemplate.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
