<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <h:panelGroup>
    <ui:include src="/fragments/user-link.xhtml">
      <ui:param
        name="instance"
        value="#{instance.admin}" />
    </ui:include>
    <h:panelGroup rendered="#{not empty entityBadge ? entityBadge : not instance.adminValid}">
      <i
        class="fas fa-exclamation-circle warning"
        title="#{messages.adminInvalidHint}" />
    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
