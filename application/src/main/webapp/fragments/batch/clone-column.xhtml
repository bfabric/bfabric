<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column
    exportable="false"
    label="#{messages.clone}">
    <f:facet name="header">
      <h:outputText
        value="&#160;"
        styleClass="tdr" />
      <div>
        <h:outputText value="#{messages.clone}" />
      </div>
    </f:facet>
    <h:panelGroup rendered="#{entity.id > 0}">
      <p:commandButton
        id="clonelink"
        disabled="#{bean.addNewBatchItemsDisabled}"
        action="#{bean.initCloneItemPanel}"
        value="#{messages.clone}"
        title="#{bean.addNewBatchItemsDisabled ? bean.itemLimitExceededHint : ''}"
        oncomplete="PF('cloneItemDialog').show()"
        process="@this"
        update="cloneItemPanel"
        styleClass="inline"
        style="width:50px;min-width:50px">
        <f:setPropertyActionListener
          value="#{entity}"
          target="#{bean.currentCloneItem}" />
      </p:commandButton>
    </h:panelGroup>
  </p:column>
</ui:composition>
