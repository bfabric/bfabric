<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <h:form
    rendered="#{entityManager.instance.deletable}"
    onsubmit="#{entityManager.resetRefererURL()}">
    <p:commandButton
      action="#{entityManager.remove}"
      value="#{messages.delete}"
      title="#{title}">
      <ui:include src="/fragments/confirm-dialog-delete-cascade.xhtml" />
    </p:commandButton>
  </h:form>
</ui:composition>
