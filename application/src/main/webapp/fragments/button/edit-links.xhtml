<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:button
    rendered="#{instance.editable}"
    outcome="/link/edit-batch-with-create.xhtml"
    value="#{empty instance.links ? messages.addLinks : messages.editLinks}"
    title="#{title}">
    <f:param
      name="parentId"
      value="#{instance.id}" />
    <f:param
      name="parentClassName"
      value="#{instance.trimmedClassName}" />
  </p:button>
</ui:composition>
