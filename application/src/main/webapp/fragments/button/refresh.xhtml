<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <p:button
    value="#{messages.refresh}"
    title="#{not empty title ? title : messages.refreshHint}">
    <c:forEach
      items="#{uriHelper.requestParametersWithoutCid}"
      var="item">
      <f:param
        name="#{item.key}"
        value="#{item.value}" />
    </c:forEach>
  </p:button>
</ui:composition>
