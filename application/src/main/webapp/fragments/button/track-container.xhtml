<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui">
  <!--@elvariable id="instance" type="org.bfabric.manager.Container"-->
  <!--@elvariable id="entityManager" type="org.bfabric.manager.ContainerManager"-->
  <h:form rendered="#{identityManager.hasCurrentUserRole('containerReader')}">
    <p:commandButton action="#{entityManager.switchTracked()}"
                     value="#{instance.tracked ? messages.untrack : messages.track}"
                     title="#{instance.tracked ? messages.untrackContainerHint : messages.trackContainerHint}"
                     update="@form" />
  </h:form>
</ui:composition>
