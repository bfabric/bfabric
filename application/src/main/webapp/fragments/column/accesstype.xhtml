<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('accessType')}">
    <c:if test="#{identityManager.hasCurrentUserRole('storageReader')}">
      <p:column field="#{fieldPrefix}accessType.name" headerText="#{messages.accessType}" filterMatchMode="exact">
        <f:facet name="filter">
          <h:selectOneMenu id="accessType" onchange="PF('#{tableContext}#{tableType}').filter()">
            <f:selectItem itemLabel="#{messages.noFilter}" />
            <f:selectItems value="#{accessTypeList.resultList}" var="item" itemValue="#{item.name}" itemLabel="#{item.name}" />
          </h:selectOneMenu>
        </f:facet>
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param name="instance" value="#{entity.accessType}" />
        </ui:include>
      </p:column>
    </c:if>
    <c:if test="#{not identityManager.hasCurrentUserRole('storageReader')}">
      <p:column field="#{fieldPrefix}accessType.name" headerText="#{messages.accessType}" />
    </c:if>
  </c:if>
</ui:composition>
