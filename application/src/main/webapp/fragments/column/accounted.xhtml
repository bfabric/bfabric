<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('accounted')}">
    <p:column
      field="#{fieldPrefix}accounted"
      headerText="#{not empty headerText ? headerText : messages.accounted}">
      <h:outputText value="#{entity.accounted}">
        <f:convertNumber pattern="0.00" />
      </h:outputText>
    </p:column>
  </c:if>
</ui:composition>
