<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('acknowledgedBy')}">
    <p:column
      field="#{fieldPrefix}acknowledgedBy.size()"
      headerText="#{messages.acknowledgedBy}">
      <h:outputText
        value="#{entity.acknowledgedBy.size()}"
        title="#{entity.getAcknowledgedByHint(currentUser)}"
        styleClass="#{styleClass}" />
    </p:column>
  </c:if>
</ui:composition>
