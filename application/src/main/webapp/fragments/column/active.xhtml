<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('active')}">
    <p:column
      field="active"
      headerText="#{messages.active}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="active" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.active)}"
        styleClass="#{not entity.active}" />
    </p:column>
  </c:if>
</ui:composition>
