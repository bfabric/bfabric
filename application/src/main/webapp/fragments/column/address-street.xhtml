<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('street')}">
    <p:column
      field="#{fieldPrefix}address.street"
      headerText="#{messages.street}">
      <h:outputLink
        value="#{entity.address.mapLink}"
        target="_blank"
        rel="noopener">
        <h:outputText value="#{entity.address.street}" />
      </h:outputLink>
    </p:column>
  </c:if>
</ui:composition>
