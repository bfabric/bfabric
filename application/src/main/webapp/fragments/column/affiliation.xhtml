<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('organization')}">
    <p:column
      field="#{fieldPrefix}institute.department.organization.name"
      headerText="#{messages.organization}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.institute.department.organization}" />
      </ui:include>
    </p:column>
  </c:if>
  <c:if test="#{not hideColumns.contains('department')}">
    <p:column
      field="#{fieldPrefix}institute.department.name"
      headerText="#{messages.department}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.institute.department}" />
      </ui:include>
    </p:column>
  </c:if>
  <c:if test="#{not hideColumns.contains('institute')}">
    <p:column
      field="#{fieldPrefix}institute.name"
      headerText="#{messages.institute}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.institute}" />
      </ui:include>
    </p:column>
  </c:if>
  <c:if test="#{not hideColumns.contains('company')}">
    <p:column
      field="#{fieldPrefix}division.company.name"
      headerText="#{messages.company}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.division.company}" />
      </ui:include>
    </p:column>
  </c:if>
  <c:if test="#{not hideColumns.contains('division')}">
    <p:column
      field="#{fieldPrefix}division.name"
      headerText="#{messages.division}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.division}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
