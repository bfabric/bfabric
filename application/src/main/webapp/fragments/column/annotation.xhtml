<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('annotation')}">
    <p:column field="#{fieldPrefix}annotation" headerText="#{messages.annotation}" filterMatchMode="exact">
      <f:facet name="filter">
        <h:selectOneMenu id="annotation" onchange="PF('#{tableContext}#{tableType}').filter()">
          <f:selectItem itemLabel="#{messages.noFilter}" />
          <f:selectItems value="#{annotationList.resultList}" var="item" itemLabel="#{item.name}" />
        </h:selectOneMenu>
      </f:facet>
      <h:outputText value="#{entity.annotation.name}" />
    </p:column>
  </c:if>
</ui:composition>
