<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('annotationRequired')}">
    <p:column
      field="#{fieldPrefix}annotationRequired"
      headerText="#{messages.annotation} #{messages.required}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="annotationRequired" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.annotationRequired)}"
        styleClass="#{not entity.annotationRequired and entity.import}" />
    </p:column>
  </c:if>
</ui:composition>
