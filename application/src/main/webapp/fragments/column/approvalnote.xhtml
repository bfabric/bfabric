<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('approvalNote')}">
    <p:column
      field="#{fieldPrefix}approvalNote"
      headerText="#{messages.approvalNote}"
      exportValue="#{entity.approvalNote}">
      <h:outputText
        value="#{stringHelper.truncate(entity.approvalNote,20)}"
        title="#{entity.approvalNote}" />
    </p:column>
  </c:if>
</ui:composition>
