<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('backup')}">
    <p:column field="#{fieldPrefix}backup.name" headerText="#{not empty headerText ? headerText : messages.backup}">
      <ui:include src="/fragments/user-link.xhtml">
        <ui:param name="instance" value="#{entity.backup}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
