<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('basePath')}">
    <p:column
      field="#{fieldPrefix}basePath"
      headerText="#{messages.basePath}">
      <h:outputText
        value="#{stringHelper.truncate(entity.basePath,80)}"
        title="#{entity.basePath}" />
    </p:column>
  </c:if>
</ui:composition>
