<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('billable') and identityManager.hasCurrentUserRole('containerReader')}">
    <p:column
      field="#{fieldPrefix}billable"
      headerText="#{messages.billable}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="billable" />
      </ui:include>
      <h:outputText value="#{stringHelper.toYesNo(entity.billable)}" />
    </p:column>
  </c:if>
</ui:composition>
