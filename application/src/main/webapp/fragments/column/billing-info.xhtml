<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('billingCustomer')}">
    <p:column
      field="#{fieldPrefix}billingInfo.billingCustomerName"
      headerText="#{messages.billingCustomer}" />
  </c:if>
  <c:if test="#{not hideColumns.contains('billingEmail')}">
    <p:column
      field="#{fieldPrefix}billingInfo.billingEmail"
      headerText="#{messages.billingEmail}" />
  </c:if>
  <c:if test="#{not hideColumns.contains('billingAddress')}">
    <p:column
      field="#{fieldPrefix}billingInfo.billingAddress"
      headerText="#{messages.billingAddress}"
      exportValue="#{entity.billingInfo.billingAddress}">
      <h:outputText
        value="#{stringHelper.truncate(entity.billingInfo.billingAddress, 50)}"
        title="#{entity.billingInfo.billingAddress}" />
    </p:column>
  </c:if>
</ui:composition>
