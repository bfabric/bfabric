<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{identityManager.hasCurrentUserRole('containerReader') and configuration.budgetLimitEnabled}">
    <c:if test="#{showColumns.contains('budgetLimit')}">
      <p:column field="budgetLimit" headerText="#{messages.budgetLimit}" filterMatchMode="startsWith">
        <h:outputText value="#{entity.budgetLimit}" title="#{messages.budgetLimitHint}">
          <f:convertNumber pattern="0.00" />
        </h:outputText>
      </p:column>
    </c:if>
    <c:if test="#{showColumns.contains('budgetRemaining')}">
      <p:column field="budgetRemaining" headerText="#{messages.budgetRemaining}" filterMatchMode="startsWith">
        <h:outputText value="#{entity.budgetRemaining}" title="#{messages.budgetRemainingHint}">
          <f:convertNumber pattern="0.00" />
        </h:outputText>
      </p:column>
    </c:if>
  </c:if>
</ui:composition>
