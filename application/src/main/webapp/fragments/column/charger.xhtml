<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('charger')}">
    <p:column
      field="#{fieldPrefix}charger.name"
      headerText="#{not empty headerText ? headerText : messages.charger}">
      <ui:include src="/fragments/user-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.charger}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
