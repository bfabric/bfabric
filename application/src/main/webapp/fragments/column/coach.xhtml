<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('coach')}">
    <p:column
      field="#{fieldPrefix}coach.name"
      headerText="#{messages.coach}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.coach}" />
      </ui:include>
    </p:column>
  </c:if>
  <c:if test="#{showColumns.contains('coachBackup')}">
    <p:column
      field="#{fieldPrefix}coachBackup.name"
      headerText="#{messages.coachBackup}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.coachBackup}" />
      </ui:include>
    </p:column>
  </c:if>
  <c:if test="#{showColumns.contains('bioinformatician')}">
    <p:column
      field="#{fieldPrefix}bioinformatician.name"
      headerText="#{messages.bioinformatician}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.bioinformatician}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
