<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('color')}">
    <p:column
      field="#{fieldPrefix}color"
      headerText="#{messages.color}"
      width="50">
      <h:outputText value="#{entity.color}" style="color:#{entity.color}" />
    </p:column>
  </c:if>
</ui:composition>
