<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('combinedMultiplexId')}">
    <p:column
      field="#{fieldPrefix}combinedMultiplexId"
      headerText="#{messages.combinedMultiplexId}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="combinedMultiplexId" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.combinedMultiplexId)}"
        styleClass="#{stringHelper.toGreenRed(entity.combinedMultiplexId)}" />
    </p:column>
  </c:if>
</ui:composition>
