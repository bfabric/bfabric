<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('comment')}">
    <p:column
      field="#{fieldPrefix}comment"
      headerText="#{messages.comment}"
      exportValue="#{entity.comment}">
      <h:outputText
        value="#{stringHelper.truncate(entity.comment, 80)}"
        title="#{entity.comment}"
        styleClass="#{styleClass}" />
    </p:column>
  </c:if>
</ui:composition>
