<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('container')}">
    <p:column
      field="#{fieldPrefix}container.id"
      headerText="#{messages.container}">
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.container}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
