<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('customOption')}">
    <p:column
      field="#{fieldPrefix}customOption"
      headerText="#{messages.customOptions}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="customOption" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.customOption)}"
        styleClass="#{stringHelper.toGreenRed(entity.customOption)}" />
    </p:column>
  </c:if>
</ui:composition>
