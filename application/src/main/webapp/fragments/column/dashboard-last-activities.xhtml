<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column
    sortable="#{empty sortable ? true : sortable}"
    filterable="#{empty filterable ? true : filterable}"
    rendered="#{not hideColumns.contains('entityId')}"
    field="entityId"
    headerText="#{messages.entityId}">
    <p:link
      outcome="#{entity.urlEntityShowScreen}"
      value="#{entity.entityId}"
      rendered="#{entity.renderedEntityShowLink}">
      <f:param
        name="id"
        value="#{entity.entityId}" />
      <f:param
        name="tab"
        value="#{constants.DETAILS}" />
    </p:link>
    <h:outputText
      value="#{entity.entityId}"
      rendered="#{not entity.renderedEntityShowLink}" />
  </p:column>
  <ui:include src="/fragments/column/entityClassName.xhtml" />
  <ui:include src="/fragments/column/action.xhtml" />
  <ui:include src="/fragments/column/created.xhtml" />
</ui:composition>
