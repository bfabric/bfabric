<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('dataAccessEnabled')}">
    <p:column
      field="#{fieldPrefix}dataAccessEnabled"
      headerText="#{messages.dataAccessEnabled}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="dataAccessEnabled" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.dataAccessEnabled)}"
        styleClass="#{not entity.dataAccessEnabled}" />
    </p:column>
  </c:if>
</ui:composition>
