<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('defaultForType')}">
    <p:column
      field="#{fieldPrefix}defaultForType"
      headerText="#{messages.defaultForType}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="defaultForType" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.defaultForType)}"
        styleClass="#{stringHelper.toGreenRed(entity.defaultForType)}" />
    </p:column>
    headerText="#{messages.default}" />
  </c:if>
</ui:composition>
