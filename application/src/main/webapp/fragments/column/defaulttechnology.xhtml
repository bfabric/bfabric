<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('defaultTechnology')}">
    <p:column
      field="#{fieldPrefix}defaultTechnology.name"
      headerText="#{messages.defaultTechnology}"
      filterMatchMode="exact">
      <f:facet name="filter">
        <h:selectOneMenu
          id="defaultTechnology"
          onchange="PF('#{tableContext}#{tableType}').filter()">
          <f:selectItem itemLabel="#{messages.noFilter}" />
          <f:selectItems
            value="#{technologyList.resultList}"
            var="item"
            itemLabel="#{item.name}" />
        </h:selectOneMenu>
      </f:facet>
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.defaultTechnology}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
