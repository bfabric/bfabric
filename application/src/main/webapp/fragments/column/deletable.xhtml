<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('deletable')}">
    <p:column headerText="#{messages.deletable}">
      <h:outputText
        value="#{stringHelper.toYesNo(entity.deletable)}"
        styleClass="#{entity.deletable}" />
    </p:column>
  </c:if>
</ui:composition>
