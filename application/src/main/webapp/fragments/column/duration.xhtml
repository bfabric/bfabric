<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('duration')}">
    <p:column field="#{fieldPrefix}duration" headerText="#{messages.duration} (#{messages.durationUnitMilliSecond})">
      <h:outputText value="#{entity.duration.toMillis()}" />
    </p:column>
  </c:if>
</ui:composition>
