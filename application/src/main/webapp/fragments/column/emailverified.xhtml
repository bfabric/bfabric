<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('emailVerified')}">
    <p:column
      field="#{fieldPrefix}emailVerified"
      headerText="#{messages.emailVerified}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="emailVerified" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.emailVerified)}"
        styleClass="#{not entity.emailVerified}" />
    </p:column>
  </c:if>
</ui:composition>
