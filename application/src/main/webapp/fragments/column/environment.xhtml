<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <c:if test="#{not hideColumns.contains('discriminator')}">
    <o:importConstants type="org.bfabric.enums.EnvironmentEnum" />
    <p:column
      field="#{fieldPrefix}environment"
      headerText="#{messages.environment}"
      filterMatchMode="exact">
      <f:facet name="filter">
        <h:selectOneMenu
          id="environment"
          onchange="PF('#{tableContext}#{tableType}').filter()">
          <f:selectItem itemLabel="#{messages.noFilter}" />
          <f:selectItems
            value="#{EnvironmentEnum.values()}"
            var="item"
            itemLabel="#{item.name}" />
        </h:selectOneMenu>
      </f:facet>
      <h:outputText value="#{entity.environment}" />
    </p:column>
  </c:if>
</ui:composition>
