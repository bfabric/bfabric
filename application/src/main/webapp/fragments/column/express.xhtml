<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('express')}">
    <p:column
      field="#{fieldPrefix}express"
      headerText="#{messages.express}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="express" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.express)}"
        styleClass="#{stringHelper.toGreenRed(!entity.express)}" />
    </p:column>
  </c:if>
</ui:composition>
