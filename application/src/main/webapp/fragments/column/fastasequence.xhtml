<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('fastaSequence')}">
    <p:column
      field="#{fieldPrefix}fastaSequence"
      headerText="#{messages.fastaSequence}"
      exportValue="#{stringHelper.truncate(entity.fastaSequence, 32700)}">
      <h:outputText
        value="#{stringHelper.truncate(entity.fastaSequence, 20)}"
        title="#{entity.fastaSequence}"
        styleClass="#{styleClass}" />
    </p:column>
  </c:if>
</ui:composition>
