<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('feedbackCount')}">
    <p:column
      field="#{fieldPrefix}feedbacks.size()"
      headerText="#{messages.feedbacks}"
      filterMatchMode="exact" />
  </c:if>
</ui:composition>
