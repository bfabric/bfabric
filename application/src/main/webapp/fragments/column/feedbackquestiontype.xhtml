<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('feedbackQuestionType')}">
    <p:column
      field="#{fieldPrefix}feedbackQuestionType.name"
      headerText="#{messages.answerType}"
      filterMatchMode="exact">
      <f:facet name="filter">
        <h:selectOneMenu onchange="PF('#{tableContext}#{tableType}').filter()">
          <f:selectItem itemLabel="#{messages.noFilter}" />
          <f:selectItems
            value="#{feedbackQuestionTypeList.resultList}"
            var="item"
            itemLabel="#{item.name}"
            itemValue="#{item.name}" />
        </h:selectOneMenu>
      </f:facet>
      <h:outputText value="#{entity.feedbackQuestionType.name}" />
    </p:column>
  </c:if>
</ui:composition>
