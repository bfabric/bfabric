<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('firstName')}">
    <p:column
      filterable="#{filterable != null ? filterable : true}"
      field="#{fieldPrefix}firstName"
      headerText="#{messages.firstName}"
      styleClass="#{firstNameStyleClass != null ? firstNameStyleClass : styleClass}"
      exportValue="#{empty entityValue ? entity.firstName : entityValue.firstName}">
      <ui:include src="/fragments/user-link.xhtml">
        <ui:param
          name="instance"
          value="#{entityValue != null ? entityValue : entity}" />
        <ui:param
          name="entityValue"
          value="#{entityValue != null ? entityValue.firstName : entity.firstName}" />
        <ui:param
          name="noHints"
          value="#{noHints != null ? noHints : true}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
