<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('hidden')}">
    <p:column
      field="#{fieldPrefix}hidden"
      headerText="#{messages.hidden}"
      filterMatchMode="exact"
      style="min-width:110px">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="hidden" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.hidden)}"
        styleClass="#{stringHelper.toGreenRed(entity.hidden)}" />
    </p:column>
  </c:if>
</ui:composition>
