<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('hint')}">
    <p:column
      field="#{fieldPrefix}hint"
      headerText="#{messages.hint}"
      exportValue="#{entity.hint}">
      <h:outputText
        value="#{stringHelper.truncate(entity.hint, 20)}"
        title="#{entity.hint}"
        styleClass="#{styleClass}" />
    </p:column>
  </c:if>
</ui:composition>
