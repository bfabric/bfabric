<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('homeStreet') and identityManager.hasCurrentUserRole('employeeManager')}">
    <p:column
      field="#{fieldPrefix}homeAddress.street"
      headerText="#{messages.homeStreet}">
      <h:outputLink
        value="#{entity.homeAddress.mapLink}"
        target="_blank"
        rel="noopener">
        <h:outputText value="#{entity.homeAddress.street}" />
      </h:outputLink>
    </p:column>
  </c:if>
</ui:composition>
