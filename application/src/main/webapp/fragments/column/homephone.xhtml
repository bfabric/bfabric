<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('homePhone') and identityManager.hasCurrentUserRole('employeeManager')}">
    <p:column
      field="#{fieldPrefix}homePhoneNumber.homePhone"
      headerText="#{messages.homePhone}">
      <h:outputText value="#{entity.homePhone}" />
    </p:column>
  </c:if>
</ui:composition>
