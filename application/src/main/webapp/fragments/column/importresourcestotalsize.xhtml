<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('importResourcesTotalSize')}">
    <p:column
      sortable="#{not tableReference.lazy}"
      sortBy="#{entity.importResourcesTotalSize}"
      headerText="#{messages.importResources} #{messages.size}"
      exportValue="#{entity.printImportResourcesTotalSize}">
      <h:outputText
        value="#{entity.printImportResourcesTotalSize}"
        title="#{messages.importResourcesTotalSizeHint}" />
    </p:column>
  </c:if>
</ui:composition>
