<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('instructionLink')}">
    <p:column
      field="#{fieldPrefix}instructionLink"
      headerText="#{messages.instructionLink}">
      <h:outputLink
        value="#{entity.instructionLink}"
        title="#{entity.instructionLink}"
        target="_blank"
        rel="noopener">
        <h:outputText value="#{stringHelper.truncate(entity.instructionLink, 60)}" />
      </h:outputLink>
    </p:column>
  </c:if>
</ui:composition>
