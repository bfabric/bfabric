<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('instrument_')}">
    <c:if test="#{identityManager.hasCurrentUserRole('containerReader')}">
      <p:column
        field="#{fieldPrefix}instrument.name"
        headerText="#{messages.instrument}">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param
            name="instance"
            value="#{entity.instrument}" />
        </ui:include>
      </p:column>
    </c:if>
    <c:if test="#{not identityManager.hasCurrentUserRole('containerReader')}">
      <p:column
        field="#{fieldPrefix}instrument.name"
        headerText="#{messages.instrument}" />
    </c:if>
  </c:if>
</ui:composition>
