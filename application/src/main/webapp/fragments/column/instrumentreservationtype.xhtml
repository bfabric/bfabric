                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('instrumentReservationType')}">

        <h:selectOneMenu id="instrumentReservationType" onchange="PF('#{tableContext}#{tableType}').filter()">

            itemValue="#{item.name}" />

      </f:facet>
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param name="instance" value="#{entity.instrumentReservationType}" />
