<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('instrumentStatusInfoUserBookable')}">
    <p:column
      field="#{fieldPrefix}instrumentStatusInfo.userBookable"
      headerText="#{messages.userBookable}"
      filterMatchMode="exact"
      title="#{messages.instrumentStatusUserBookable}"
      styleClass="#{entity.instrumentStatusInfo.userBookable ? constants.BACKGROUND_COLOR_GREEN : constants.BACKGROUND_COLOR_RED}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="userBookable" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.userBookable)}"
        styleClass="#{stringHelper.toGreenRed(entity.userBookable)}" />
    </p:column>
  </c:if>
</ui:composition>
