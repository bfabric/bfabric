<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('instrumentStatusInfoUserBookableTimeTotal')}">
    <p:column headerText="#{messages.userBookableTimeTotal}" sortBy="#{entity.instrumentStatusInfo.userBookableTimeTotal}">
      <h:outputText value="#{stringHelper.getFormattedDuration(entity.instrumentStatusInfo.userBookableTimeTotal)}" style="float:right" />
    </p:column>
  </c:if>
</ui:composition>
