<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('inventoryEnabled')}">
    <p:column field="#{fieldPrefix}inventoryEnabled" headerText="#{messages.inventoryEnabled}" filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param name="idPrefix" value="inventoryEnabled" />
      </ui:include>
      <h:outputText value="#{stringHelper.toYesNo(entity.inventoryEnabled)}"
                    styleClass="#{stringHelper.toGreenRed(!entity.inventoryEnabled)}" />
    </p:column>
  </c:if>
</ui:composition>
