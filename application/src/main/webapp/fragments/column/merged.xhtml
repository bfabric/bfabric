<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('mergedBy')}">
    <p:column
      sortable="#{empty sortable ? true : sortable}"
      filterable="#{empty filterable ? true : filterable}"
      field="#{fieldPrefix}mergedBy"
      headerText="#{messages.mergedBy}" />
  </c:if>
  <c:if test="#{not hideColumns.contains('merged')}">
    <p:column
      sortable="#{empty sortable ? true : sortable}"
      filterable="#{empty filterable ? true : filterable}"
      field="#{fieldPrefix}merged"
      headerText="#{messages.merged}">
      <!--      <f:facet name="filter">
              <h:inputText
                value="#{mergedFilter}"
                onkeyup="PF('#{tableContext}#{tableType}').filter()"
                styleClass="ui-column-filter" />
            </f:facet>-->
    </p:column>
  </c:if>
</ui:composition>
