<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('mergeRequestedBy')}">
    <p:column
      sortable="#{empty sortable ? true : sortable}"
      filterable="#{empty filterable ? true : filterable}"
      field="#{fieldPrefix}mergeRequestedBy"
      headerText="#{messages.mergeRequestedBy}" />
  </c:if>
  <c:if test="#{not hideColumns.contains('mergeRequested')}">
    <p:column
      sortable="#{empty sortable ? true : sortable}"
      filterable="#{empty filterable ? true : filterable}"
      field="#{fieldPrefix}mergeRequested"
      headerText="#{messages.mergeRequested}">
      <!--      <f:facet name="filter">
              <h:inputText
                value="#{mergeRequestedFilter}"
                onkeyup="PF('#{tableContext}#{tableType}').filter()"
                styleClass="ui-column-filter" />
            </f:facet>-->
    </p:column>
  </c:if>
</ui:composition>
