<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('modifiedBy')}">
    <p:column
      sortable="#{empty sortable ? true : sortable}"
      filterable="#{empty filterable ? true : filterable}"
      field="#{fieldPrefix}modifiedBy"
      headerText="#{messages.modifiedBy}" />
  </c:if>
  <c:if test="#{not hideColumns.contains('modifiedOn')}">
    <p:column
      sortable="#{empty sortable ? true : sortable}"
      filterable="#{empty filterable ? true : filterable}"
      filterValue="#{filterValueModified}"
      field="#{fieldPrefix}modified"
      headerText="#{messages.modified}" />
  </c:if>
</ui:composition>
