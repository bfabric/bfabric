<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('na')}">
    <p:column
      field="#{fieldPrefix}na"
      headerText="#{messages.na}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="na" />
      </ui:include>
      <h:outputText value="#{stringHelper.toYesNo(entity.na)}" />
    </p:column>
  </c:if>
</ui:composition>
