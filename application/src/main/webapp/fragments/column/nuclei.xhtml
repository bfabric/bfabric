<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('nuclei')}">
    <p:column
      field="#{fieldPrefix}nuclei"
      headerText="#{messages.cellsNuclei}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="nuclei" />
        <ui:param
          name="trueText"
          value="#{messages.nuclei}" />
        <ui:param
          name="falseText"
          value="#{messages.cells}" />
      </ui:include>
      <h:outputText value="#{not empty entity.nuclei ? (entity.nuclei ? messages.nuclei : messages.cells) : null}" />
    </p:column>
  </c:if>
</ui:composition>
