<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('offer')}">
    <p:column
      field="#{fieldPrefix}offer.id"
      headerText="#{messages.offer}">
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.offer}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
