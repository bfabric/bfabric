<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('offerDiscount')}">
    <p:column
      field="#{fieldPrefix}offer.discount"
      headerText="#{not empty headerText ? headerText : messages.offerDiscount}">
      <h:outputText
        value="#{entity.offer.discount}"
        rendered="#{entity.offer.discounted}">
        <f:convertNumber pattern="0" />
      </h:outputText>
    </p:column>
  </c:if>
</ui:composition>
