<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('option')}">
    <p:column field="#{fieldPrefix}option.displayName" headerText="#{messages.option}">
      <ui:include src="/fragments/entity-link-displayname.xhtml">
        <ui:param name="instance" value="#{entity.option}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
