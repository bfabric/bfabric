<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('orderDataOnly')}">
    <p:column
      field="#{fieldPrefix}orderDataOnly"
      headerText="#{messages.orderDataOnly}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="orderDataOnly" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.orderDataOnly)}"
        styleClass="#{stringHelper.toGreenRed(!entity.orderDataOnly)}" />
    </p:column>
  </c:if>
</ui:composition>
