<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('orderDiscount')}">
    <p:column
      field="#{fieldPrefix}container.discount"
      headerText="#{messages.orderDiscount}">
      <h:outputText
        rendered="#{not empty entity.container.discount}"
        value="#{entity.container.discount}">
        <f:convertNumber pattern="0" />
      </h:outputText>
    </p:column>
  </c:if>
</ui:composition>
