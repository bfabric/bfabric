<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('parents')}">
    <p:column headerText="#{messages.parentId}" sortBy="#{entity.singleParent.id}">
      <div class="display">
        <ui:repeat value="#{entity.parents}" var="item">
          <ui:include src="/fragments/entity-link.xhtml">
            <ui:param name="instance" value="#{item}" />
          </ui:include>
        </ui:repeat>
      </div>
    </p:column>
    <p:column headerText="#{messages.parentName}" sortBy="#{entity.singleParent.name}">
      <div class="display">
        <ui:repeat value="#{entity.parents}" var="item">
          <ui:include src="/fragments/entity-link-name.xhtml">
            <ui:param name="instance" value="#{item}" />
          </ui:include>
        </ui:repeat>
      </div>
    </p:column>
  </c:if>
</ui:composition>
