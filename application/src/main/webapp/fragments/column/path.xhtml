<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('path')}">
    <p:column headerText="#{messages.path}" exportValue="#{entity.path}">
      <h:outputText value="#{stringHelper.truncate(entity.path)}" title="#{entity.path}" />
    </p:column>
  </c:if>
</ui:composition>
