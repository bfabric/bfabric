<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('plates')}">
    <p:column
      exportable="false"
      sortable="false"
      filterable="false"
      headerText="#{messages.plates}">
      <ui:repeat
        value="#{entity.plates}"
        var="item">
        <ui:include src="/fragments/entity-link.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
          <ui:param
            name="entityValue"
            value="#{item.name} " />
          <ui:param
            name="entityHint"
            value="#{item.entityInfo}" />
        </ui:include>
        <br />
      </ui:repeat>
    </p:column>
  </c:if>
</ui:composition>
