<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('privateEmailAddress') and identityManager.hasCurrentUserRole('admin')}">
    <p:column
      sortable="#{empty sortable ? true : sortable}"
      filterable="#{empty filterable ? true : filterable}"
      field="#{fieldPrefix}privateEmail"
      headerText="#{messages.privateEmail}" />
  </c:if>
</ui:composition>
