<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('purchase')}">
    <p:column
      field="#{fieldPrefix}purchase.id"
      headerText="#{messages.purchase}">
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.purchase}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
