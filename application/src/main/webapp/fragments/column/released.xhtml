<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('released')}">
    <p:column
      field="#{fieldPrefix}released"
      headerText="#{messages.released}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="released" />
      </ui:include>
      <h:outputText value="#{stringHelper.toYesNo(entity.released)}" />
    </p:column>
  </c:if>
</ui:composition>
