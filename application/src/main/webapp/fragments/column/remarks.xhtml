<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('remarks')}">
    <p:column
      field="#{fieldPrefix}remarks"
      headerText="#{messages.remarks}">
      <h:outputText value="#{stringHelper.truncate(entity.remarks, 20)}" title="#{entity.remarks}" />
    </p:column>
  </c:if>
</ui:composition>
