<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('replacements')}">
    <p:column field="#{fieldPrefix}replacements.size()"
              headerText="#{messages.replacements}"
              exportValue="#{collectionHelper.printDisplayNames(entity.replacements)}">
      <ui:repeat var="item" value="#{entity.replacements}">
        <ui:include src="/fragments/entity-link.xhtml">
          <ui:param name="instance" value="#{item}" />
          <ui:param name="entityValue" value="#{item.displayName}" />
        </ui:include>
        <br />
      </ui:repeat>
    </p:column>
  </c:if>
</ui:composition>
