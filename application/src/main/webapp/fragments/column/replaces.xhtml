<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('replaces')}">
    <p:column field="#{fieldPrefix}replaces.tubeId" headerText="#{messages.replaces}"
              sortable="#{not empty sortable ? sortable : true}" sortBy="#{entity.tubeIdPadded}" filterable="#{not empty filterable ? filterable : true}">
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param name="instance" value="#{entity.replaces}" />
        <ui:param name="entityValue" value="#{entity.replaces.tubeId}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
