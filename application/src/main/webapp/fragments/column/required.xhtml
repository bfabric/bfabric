<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('required')}">
    <p:column
      field="#{fieldPrefix}required"
      headerText="#{messages.required}"
      filterMatchMode="exact">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="required" />
      </ui:include>
      <h:outputText value="#{stringHelper.toYesNo(entity.required)}" />
    </p:column>
  </c:if>
</ui:composition>
