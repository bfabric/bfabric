<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('requiresCustomOptions')}">
    <p:column field="#{fieldPrefix}requiresCustomOptions" headerText="#{messages.requiresCustomOptions}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param name="idPrefix" value="requiresCustomOptions" />
      </ui:include>
      <h:outputText value="#{stringHelper.toYesNo(entity.requiresCustomOptions)}" styleClass="#{stringHelper.toGreenRed(entity.requiresCustomOptions)}" />
    </p:column>
  </c:if>
</ui:composition>
