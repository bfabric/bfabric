<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('resourcesTotalSize')}">
    <p:column
      sortable="#{not tableReference.lazy}"
      sortBy="#{entity.resourcesTotalSize}"
      headerText="#{messages.storage} #{messages.size}"
      exportValue="#{entity.printResourcesTotalSize}">
      <h:outputText
        value="#{entity.printResourcesTotalSize}"
        title="#{messages.resourcesTotalSizeHint}" />
    </p:column>
  </c:if>
</ui:composition>
