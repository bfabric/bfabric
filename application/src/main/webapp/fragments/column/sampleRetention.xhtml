<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('sampleRetention')}">
    <p:column field="#{fieldPrefix}sampleRetention" headerText="#{messages.sampleRetention}">
      <h:outputText value="#{stringHelper.truncate(entity.sampleRetention, 20)}" title="#{entity.sampleRetention}" />
    </p:column>
  </c:if>
</ui:composition>
