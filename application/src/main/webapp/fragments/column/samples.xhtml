<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:set
    value="#{not empty samples ? samples : entity.samples}"
    var="samples" />
  <c:if test="#{not hideColumns.contains('samples')}">
    <p:column
      headerText="#{messages.samples}"
      exportValue="#{collectionHelper.printDisplayNames(samples)}">
      <ui:repeat
        var="item"
        value="#{samples}">
        <ui:include src="/fragments/entity-link-displayname.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
        </ui:include>
        <br />
      </ui:repeat>
    </p:column>
  </c:if>
</ui:composition>
