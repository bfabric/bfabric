<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('sampleType')}">
    <p:column field="#{fieldPrefix}sampleType.name" headerText="#{messages.sampleType}" filterMatchMode="exact">
      <f:facet name="filter">
        <h:selectOneMenu id="sampleType" onchange="PF('#{tableContext}#{tableType}').filter()">
          <f:selectItem itemLabel="#{messages.noFilter}" />
          <f:selectItems value="#{sampleTypeList.resultList}" var="item" itemValue="#{item.name}" itemLabel="#{item.name}" />
        </h:selectOneMenu>
      </f:facet>
      <c:if test="#{identityManager.hasCurrentUserRole('containerReader')}">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param name="instance" value="#{entity.sampleType}" />
        </ui:include>
      </c:if>
    </p:column>
  </c:if>
</ui:composition>
