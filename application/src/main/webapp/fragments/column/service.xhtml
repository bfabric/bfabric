<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('service')}">
    <p:column
      field="#{fieldPrefix}service.name"
      headerText="#{messages.service}">
      <ui:include src="/fragments/entity-link-name.xhtml">
        <ui:param
          name="instance"
          value="#{entity.service}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
