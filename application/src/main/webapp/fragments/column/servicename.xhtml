<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('serviceName')}">
    <!--@elvariable id="entity" type="org.bfabric.entity.AbstractCharge"-->
    <p:column
      field="#{fieldPrefix}serviceName"
      headerText="#{messages.service}"
      exportValue="#{entity.serviceName}">
      <p:link
        rendered="#{identityManager.hasCurrentUserRole('containerReader') and not empty entity.service}"
        outcome="#{entity.service.urlShowScreen}"
        value="#{entity.serviceName}">
        <f:param
          name="id"
          value="#{entity.service.id}" />
      </p:link>
      <h:outputText
        rendered="#{not identityManager.hasCurrentUserRole('containerReader')}"
        value="#{entity.serviceName}" />
      <h:outputText value="&#160;" />
      <h:panelGroup rendered="#{entity.serviceNameChanged}">
        <i
          class="fas fa-info-circle warn"
          title="#{messages.serviceNameChangedHint}" />
      </h:panelGroup>
    </p:column>
  </c:if>
</ui:composition>
