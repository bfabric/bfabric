<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('listServices')}">
    <p:column
      sortBy="#{collectionHelper.printNames(entity.services)}"
      sortable="#{not tableReference.lazy}"
      filterBy="#{collectionHelper.printNames(entity.services)}"
      filterable="#{not tableReference.lazy}"
      headerText="#{messages.services}"
      exportValue="#{collectionHelper.printNames(entity.services)}">
      <ui:repeat
        value="#{entity.services}"
        var="item">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
        </ui:include>
        <br />
      </ui:repeat>
    </p:column>
  </c:if>
</ui:composition>
