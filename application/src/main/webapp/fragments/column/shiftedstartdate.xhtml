<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('shiftedStartDate')}">
    <p:column
      field="#{fieldPrefix}shiftedStartDate"
      headerText="#{messages.newStartDate}">
      <h:outputText
        value="#{entity.shiftedStartDateAsText}"
        styleClass="info" />
    </p:column>
  </c:if>
</ui:composition>
