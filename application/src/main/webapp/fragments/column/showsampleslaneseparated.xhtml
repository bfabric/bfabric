<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('showSamplesLaneSeparated')}">
    <p:column
      field="#{fieldPrefix}showSamplesLaneSeparated"
      headerText="#{messages.showSamplesLaneSeparated}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="showSamplesLaneSeparated" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.showSamplesLaneSeparated)}"
        styleClass="#{stringHelper.toGreenRed(entity.showSamplesLaneSeparated)}" />
    </p:column>
  </c:if>
</ui:composition>
