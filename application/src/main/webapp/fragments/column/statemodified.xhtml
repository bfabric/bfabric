<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{showColumns.contains('stateModifiedBy')}">
    <p:column
      field="#{fieldPrefix}statusModifiedBy.name"
      headerText="#{messages.stateModifiedBy}">
      <ui:include src="/fragments/user-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.statusModifiedBy}" />
      </ui:include>
    </p:column>
  </c:if>
  <c:if test="#{showColumns.contains('stateModifiedOn')}">
    <p:column
      field="#{fieldPrefix}statusModified"
      headerText="#{messages.statusModified}" />
  </c:if>
</ui:composition>
