<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('status')}">
    <p:column
      field="#{fieldPrefix}status"
      headerText="#{messages.status}"
      filterMatchMode="exact"
      exportValue="#{entity.status.label}">
      <f:facet name="filter">
        <h:selectOneMenu onchange="PF('#{tableContext}#{tableType}').filter()">
          <f:selectItem itemLabel="#{messages.noFilter}" />
          <f:selectItems
            value="#{statusEnumList}"
            var="item"
            itemLabel="#{item.label}" />
        </h:selectOneMenu>
      </f:facet>
      <h:outputText
        value="#{entity.status.label}"
        title="#{entity.status.hint}"
        styleClass="#{entity.status.label}" />
      <h:panelGroup rendered="#{showPendingExtensionReportHint}">
        <h:outputText
          rendered="#{entity.extensionReportPending}"
          value="&#160;&#160;#{messages.pendingExtensionReportShort}"
          title="#{messages.pendingExtensionReportHint}"
          styleClass="warning" />
      </h:panelGroup>
      <h:panelGroup rendered="#{not empty resourceDownloadButton}">
        <ui:include src="/resource/download-button.xhtml">
          <ui:param
            name="instance"
            value="#{entity}" />
          <ui:param
            name="hideStatus"
            value="true" />
        </ui:include>
      </h:panelGroup>
      <h:panelGroup rendered="#{not empty workunitDownloadButton}">
        <ui:include src="/workunit/download-button.xhtml">
          <ui:param
            name="instance"
            value="#{entity}" />
          <ui:param
            name="hideStatus"
            value="true" />
        </ui:include>
      </h:panelGroup>
    </p:column>
  </c:if>
</ui:composition>
