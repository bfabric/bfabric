<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('supplier')}">
    <p:column
      field="#{fieldPrefix}supplier.name"
      headerText="#{messages.supplier}">
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.supplier}" />
        <ui:param
          name="entityValue"
          value="#{stringHelper.truncate(instance.name)}" />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
