<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{identityManager.hasCurrentUserRole('containerReader')}">
    <c:if test="#{not hideColumns.contains('totalBillableCharges')}">
      <p:column
        headerText="#{messages.totalBillableCharges}"
        field="totalPriceBillableCharges"
        filterMatchMode="startsWith">
        <h:outputText
          value="#{entity.totalPriceBillableCharges}"
          title="#{messages.totalBillableChargesHint}"
          styleClass="#{entity.nonBookedCharges}">
          <f:convertNumber pattern="0.00" />
        </h:outputText>
        <h:panelGroup rendered="#{entity.bookingRequired}">
          <i class="fas fa-exclamation-circle warning" title="#{messages.bookingRequiredHint}" />
        </h:panelGroup>
      </p:column>
    </c:if>
  </c:if>
</ui:composition>
