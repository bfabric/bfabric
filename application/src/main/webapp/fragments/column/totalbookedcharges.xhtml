<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{identityManager.hasCurrentUserRole('containerReader')}">
    <c:if test="#{not hideColumns.contains('totalBookedCharges')}">
      <p:column
        field="totalPriceBookedBillableCharges"
        headerText="#{messages.totalBookedCharges}"
        filterMatchMode="startsWith">
        <h:outputText
          value="#{entity.totalPriceBookedBillableCharges}"
          title="#{messages.totalBookedChargesHint}">
          <f:convertNumber pattern="0.00" />
        </h:outputText>
      </p:column>
    </c:if>
  </c:if>
</ui:composition>
