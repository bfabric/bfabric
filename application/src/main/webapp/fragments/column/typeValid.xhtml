<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('typeValid')}">
    <p:column field="#{fieldPrefix}typeValid" headerText="#{messages.typeValid}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param name="idPrefix" value="typeValid" />
      </ui:include>
      <h:outputText value="#{stringHelper.toYesNo(entity.typeValid)}" styleClass="#{stringHelper.toGreenRed(entity.typeValid)}" />
    </p:column>
  </c:if>
</ui:composition>
