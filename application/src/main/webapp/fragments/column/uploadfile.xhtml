<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <p:column>
    <p:commandLink
      ajax="false"
      value="#{entity.fileName}"
      immediate="true"
      onclick="hasChanged=false;"
      onblur="hasChanged=true;">
      <p:fileDownload value="#{entity.defaultStreamedContent}" />
    </p:commandLink>
  </p:column>
  <p:column>
    <h:outputText
      value="#{messages.fileUploaded}"
      styleClass="warn" />
  </p:column>
  <p:column>
    <p:commandLink
      ajax="false"
      immediate="true"
      onclick="hasChanged=false;"
      onblur="hasChanged=true;">
      <i class="fas fa-file-download download-icon" />
      <p:fileDownload value="#{entity.defaultStreamedContent}" />
    </p:commandLink>
  </p:column>
  <p:column>
    <h:outputText value="#{numberUtils.getPrintSize(entity.size)}" />
    <h:panelGroup rendered="#{entity.size eq 0}">
      <i class="fas fa-info-circle pending" title="#{messages.emptyFileHint}" />
    </h:panelGroup>
  </p:column>
  <p:column rendered="#{showColumns.contains('buttons')}">
    <p:commandButton
      action="#{tableContent.remove(entity)}"
      value="#{messages.clear}"
      immediate="true"
      update="#{updateOnDelete}"
      styleClass="inline" />
  </p:column>
</ui:composition>
