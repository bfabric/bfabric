<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('userDecisionOnParent')}">
    <p:column
      field="#{fieldPrefix}userDecisionOnParent"
      headerText="#{messages.userDecisionOnParent}">
      <ui:include src="/fragments/boolean-filter.xhtml">
        <ui:param
          name="idPrefix"
          value="userDecisionOnParent" />
      </ui:include>
      <h:outputText
        value="#{stringHelper.toYesNo(entity.userDecisionOnParent)}"
        styleClass="#{stringHelper.toGreenRed(!entity.userDecisionOnParent)}" />
    </p:column>
  </c:if>
</ui:composition>
