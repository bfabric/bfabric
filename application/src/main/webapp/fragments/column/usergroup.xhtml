<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('userGroup')}">
    <p:column
      field="#{fieldPrefix}userGroup.name"
      headerText="#{messages.userGroup}"
      filterMatchMode="exact">
      <f:facet name="filter">
        <h:selectOneMenu
          id="userGroup"
          value="#{sessionManager.userGroupFilterName}"
          title="#{messages.setDefaultUserGroupHint}"
          onchange="PF('#{tableContext}#{tableType}').filter()">
          <f:selectItem itemLabel="#{messages.noFilter}" />
          <f:selectItems
            value="#{userGroupList.resultListEnabledOrderedByName}"
            var="item"
            itemValue="#{item.name}"
            itemLabel="#{item.name}" />
        </h:selectOneMenu>
      </f:facet>
    </p:column>
  </c:if>
</ui:composition>
