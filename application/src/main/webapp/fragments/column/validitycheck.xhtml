<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('validityChecked')}">
    <p:column
      field="#{fieldPrefix}validityChecked"
      headerText="#{messages.validityChecked}">
      <h:outputText value="#{entity.validityCheckedAsText}" />
    </p:column>
  </c:if>
</ui:composition>
