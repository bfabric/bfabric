<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{empty grouped or not grouped}">
    <p:column
      sortBy="#{valueName}"
      filterBy="#{valueName}"
      headerText="#{headerTextName}"
      exportValue="#{valueName}">
      <p:link
        rendered="#{not empty valueId}"
        outcome="/#{valueClass}/show.xhtml"
        value="#{stringHelper.truncate(valueName, 30)}">
        <f:param
          name="id"
          value="#{valueId}" />
      </p:link>
    </p:column>
  </c:if>
  <c:if test="#{grouped}">
    <p:column
      sortBy="#{valueName}"
      filterBy="#{valueName}"
      headerText="#{headerTextName}">
      <p:link
        rendered="#{not empty valueId}"
        outcome="/#{valueClass}/show.xhtml"
        value="#{valueName}">
        <f:param
          name="id"
          value="#{valueId}" />
      </p:link>
    </p:column>
  </c:if>
</ui:composition>
