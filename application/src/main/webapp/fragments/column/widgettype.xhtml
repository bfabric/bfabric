<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('widgettype')}">
    <p:column
      field="#{fieldPrefix}widgetType.name"
      headerText="#{messages.widgetType}">
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param
          name="instance"
          value="#{entity.widgetType}" />
        <ui:param
          name="entityValue"
          value="#{stringHelper.truncate(entity.widgetType.name)} " />
      </ui:include>
    </p:column>
  </c:if>
</ui:composition>
