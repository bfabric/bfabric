<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not hideColumns.contains('workunitLink')}">
    <p:column filterable="false" sortable="false">
      <h:panelGroup rendered="#{not empty entity.link}">
        <ui:include src="/fragments/column/linkurl.xhtml">
          <ui:param name="entity" value="#{entity.link}" />
        </ui:include>
      </h:panelGroup>
    </p:column>
  </c:if>
</ui:composition>
