<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">
  <p:confirmDialog
    global="true"
    closeOnEscape="true"
    appendTo="@(body)"
    width="#{confirmDialogWidth}">
    <p:commandButton
      value="#{messages.yes}"
      type="button"
      styleClass="ui-confirmdialog-yes"
      icon="ui-icon-check" />
    <p:commandButton
      value="#{messages.no}"
      type="button"
      styleClass="ui-confirmdialog-no"
      icon="ui-icon-close" />
  </p:confirmDialog>
</ui:composition>
