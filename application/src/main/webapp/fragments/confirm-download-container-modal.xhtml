<!--
    This modal panel is used to confirm the project download.
-->
<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <p:dialog
    id="confirmContainerDownloadPanel"
    widgetVar="confirmContainerDownloadDialog"
    dynamic="true"
    resizable="false"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText
        id="confirmContainerDownloadHeader"
        value="#{isContainerProject ? messages.confirmProjectDownloadActionMessage : messages.confirmOrderDownloadActionMessage}" />
    </f:facet>
    <h:form id="confirmContainerDownloadForm">
      <h:panelGrid>
        <c:if test="#{configuration.orderEnabled and isContainerProject}">
          <h:panelGrid
            columns="2">
            <h:outputText
              value="#{messages.includeOrderData}"
              styleClass="bold" />
            <h:selectBooleanCheckbox
              value="#{includeOrderData}"
              title="#{messages.includeOrderDataHint}"
              style="margin: 0 0 0 0;">
              <p:ajax
                event="change"
                global="false"
                process="@form"
                update="@form" />
            </h:selectBooleanCheckbox>
          </h:panelGrid>
          <p:spacer height="10" />
        </c:if>
        <h:outputFormat value="#{isContainerProject ? messages.confirmProjectDownloadMessage : messages.confirmOrderDownloadMessage}" escape="false">
          <f:param value="#{stringHelper.format(containerId)}" />
        </h:outputFormat>
        <div>
          <h:outputFormat value="#{messages.confirmContainerDownloadSizeMessage}" escape="false">
            <f:param value="#{numberUtils.getPrintSize(containerSize)}" />
          </h:outputFormat>
        </div>
      </h:panelGrid>
      <h:panelGrid
        columns="2"
        styleClass="action">
        <h:button
          outcome="/fragments/download-jnlp.xhtml"
          value="#{messages.download}"
          onclick="PF('confirmContainerDownloadDialog').hide();"
          styleClass="select download-button">
          <f:param
            name="containerId"
            value="#{containerId}" />
          <f:param
            name="isContainerProject"
            value="#{isContainerProject}" />
          <f:param
            name="includeOrderData"
            value="#{not empty includeOrderData ? includeOrderData : false}" />
        </h:button>
        <p:commandButton
          value="#{messages.cancel}"
          immediate="true"
          global="false"
          oncomplete="PF('confirmContainerDownloadDialog').hide()" />
      </h:panelGrid>
    </h:form>
  </p:dialog>
</ui:composition>
