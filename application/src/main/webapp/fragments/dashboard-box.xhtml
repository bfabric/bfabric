<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty value}">
    <tr>
      <td class="header-table"><h:outputText value="#{messages}" /></td>
      <td><h:outputText value="#{value}" styleClass="preformat" title="#{title}" /></td>
    </tr>
  </c:if>
</ui:composition>
