<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html">
  <!--@elvariable id="instance" type="org.bfabric.entity.Container"-->
  <div class="hide-table-header dashboard-grid">
    <h:panelGroup rendered="#{not empty instance.dashboardHelper.managers}" class="cardBoxAvatar cardBoxShadow">
      <div class="card-header"><h3><h:outputText value="#{messages.managers} (#{instance.dashboardHelper.managers.size()})" /></h3></div>
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param name="listContext" value="instance" />
        <ui:param name="tableContext" value="managers" />
        <ui:param name="tableContent" value="#{instance.dashboardHelper.managers}" />
        <ui:param name="include" value="/fragments/column/dashboard-user-function.xhtml" />
        <ui:param name="showEmpty" value="true" />
        <ui:param name="paginator" value="#{instance.dashboardHelper.managers.size() gt 50}" />
        <ui:param name="styleClass" value="content-table" />
        <ui:param name="scrollable" value="true" />
        <ui:param name="scrollHeight" value="110px" />
        <ui:param name="scrollWidth" value="375px" />
      </ui:include>
    </h:panelGroup>

    <h:panelGroup rendered="#{not empty instance.dashboardHelper.members}" class="cardBoxAvatar cardBoxShadow">
      <div class="card-header"><h3><h:outputText value="#{messages.members} (#{instance.dashboardHelper.members.size()})" /></h3></div>
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param name="listContext" value="instance" />
        <ui:param name="tableContext" value="members" />
        <ui:param name="tableContent" value="#{instance.dashboardHelper.members}" />
        <ui:param name="include" value="/fragments/column/dashboard-user-function.xhtml" />
        <ui:param name="showEmpty" value="true" />
        <ui:param name="paginator" value="#{instance.dashboardHelper.members.size() gt 50}" />
        <ui:param name="styleClass" value="content-table" />
        <ui:param name="scrollable" value="true" />
        <ui:param name="scrollHeight" value="110px" />
        <ui:param name="scrollWidth" value="375px" />
      </ui:include>
    </h:panelGroup>

    <h:panelGroup rendered="#{not empty instance.dashboardHelper.supporters}" class="cardBoxAvatar cardBoxShadow">
      <div class="card-header"><h3><h:outputText value="#{messages.supporters} (#{instance.dashboardHelper.supporters.size()})" /></h3></div>
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param name="listContext" value="instance" />
        <ui:param name="tableContext" value="supporters" />
        <ui:param name="tableContent" value="#{instance.dashboardHelper.supporters}" />
        <ui:param name="include" value="/fragments/column/dashboard-user-function.xhtml" />
        <ui:param name="showEmpty" value="true" />
        <ui:param name="paginator" value="#{instance.dashboardHelper.supporters.size() gt 50}" />
        <ui:param name="styleClass" value="content-table" />
        <ui:param name="scrollable" value="true" />
        <ui:param name="scrollHeight" value="110px" />
        <ui:param name="scrollWidth" value="375px" />
      </ui:include>
    </h:panelGroup>
  </div>
</ui:composition>
