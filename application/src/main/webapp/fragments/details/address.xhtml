<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.address}">
    <h:outputText value="#{messages.address}" />
    <h:outputLink value="#{instance.address.mapLink}" target="_blank" rel="noopener">
      <h:outputText value="#{instance.address.address}" styleClass="preformat" />
    </h:outputLink>
  </c:if>
</ui:composition>
