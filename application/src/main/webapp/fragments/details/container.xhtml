<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.container}">
    <h:outputText value="#{not empty label ? label : messages.container}" />
    <ui:include src="/fragments/entity-link.xhtml">
      <ui:param
        name="instance"
        value="#{instance.container}" />
    </ui:include>
  </c:if>
</ui:composition>
