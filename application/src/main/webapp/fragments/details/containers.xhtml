<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.containers}">
    <h:outputText value="#{messages.containers}" />
    <ui:include src="/container/entity-containers.xhtml">
      <ui:param
        name="containers"
        value="#{instance.containers}" />
    </ui:include>
  </c:if>
</ui:composition>
