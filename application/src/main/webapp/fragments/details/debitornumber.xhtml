<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{identityManager.hasCurrentUserRole('bookingManager')}">
    <c:if test="#{not empty instance.debitorNumber}">
      <h:outputText value="#{messages.debitorNumber}" />
      <h:outputText value="#{instance.debitorNumber}" />
    </c:if>
  </c:if>
</ui:composition>
