<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.division}">
    <c:if test="#{not empty instance.division.company}">
      <h:outputText value="#{messages.company}" />
      <c:if test="#{identityManager.hasCurrentUserRole('affiliationReader')}">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param
            name="instance"
            value="#{instance.division.company}" />
        </ui:include>
      </c:if>
      <c:if test="#{not identityManager.hasCurrentUserRole('affiliationReader')}">
        <h:outputText value="#{instance.division.company.name}" />
      </c:if>
    </c:if>

    <c:if test="#{instance.division.set}">
      <h:outputText value="#{messages.division}" />
      <c:if test="#{identityManager.hasCurrentUserRole('affiliationReader')}">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param
            name="instance"
            value="#{instance.division}" />
        </ui:include>
      </c:if>
      <c:if test="#{not identityManager.hasCurrentUserRole('affiliationReader')}">
        <h:outputText value="#{instance.division.name}" />
      </c:if>
    </c:if>
  </c:if>
</ui:composition>
