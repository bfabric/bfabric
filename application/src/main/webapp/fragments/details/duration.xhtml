<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.duration}">
    <h:outputText value="#{messages.duration} (#{messages.durationUnitMilliSecond})" />
    <h:outputText value="#{instance.duration.toMillis()}" />
  </c:if>
</ui:composition>
