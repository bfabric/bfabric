<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.enabled}">
    <h:outputText value="#{messages.enabled}" />
    <h:outputText value="#{instance.enabled}" styleClass="#{stringHelper.toGreenRed(instance.enabled)}" />
  </c:if>
</ui:composition>
