<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.executionPeriod}">
    <h:outputText value="#{messages.executionPeriod}" />
    <h:panelGroup>
      <h:outputText value="#{instance.executionPeriodString}" />
      <h:outputText rendered="#{instance.executionPeriodString ne instance.executionPeriod.intervalAsString}"
                    value=" (#{messages.container} #{instance.executionPeriod.intervalAsString})"
                    styleClass="warn" />
    </h:panelGroup>
  </c:if>
</ui:composition>
