<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not empty instance.heads}">
    <h:outputText value="#{messages.head}" />
    <h:panelGroup>
      <ui:repeat value="#{instance.heads}" var="item">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param name="instance" value="#{item}" />
        </ui:include>
        <p:spacer width="5" />
      </ui:repeat>
    </h:panelGroup>
  </c:if>
</ui:composition>
