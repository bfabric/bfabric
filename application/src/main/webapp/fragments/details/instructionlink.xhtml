<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.instructionLink}">
    <h:outputText value="#{messages.instructionLink}" />
    <h:outputLink
      value="#{instance.instructionLink}"
      target="_blank"
      rel="noopener">
      <h:outputText value="#{instance.instructionLink}" />
    </h:outputLink>
  </c:if>
</ui:composition>
