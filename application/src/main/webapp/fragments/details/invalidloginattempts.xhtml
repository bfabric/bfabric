<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{instance.maxInvalidLoginAttemptsPassed}">
    <h:outputText value="#{messages.invalidLoginAttempts}" styleClass="warning" />
    <h:outputText value="#{instance.invalidLoginAttempts} #{messages.maxInvalidLoginAttemptsPassedHint}" styleClass="warning" />
  </c:if>
</ui:composition>
