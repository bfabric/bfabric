<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.inventoryEnabled}">
    <h:outputText value="#{messages.inventoryEnabled}" />
    <h:outputText value="#{instance.inventoryEnabled}" styleClass="#{stringHelper.toGreenRed(instance.inventoryEnabled)}" />
  </c:if>
</ui:composition>
