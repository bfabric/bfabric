<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.junkFullComment}">
    <h:outputText value="#{messages.junkComment}" />
    <h:outputText
      value="#{instance.junkFullComment}"
      styleClass="preformat warning" />
  </c:if>
</ui:composition>
