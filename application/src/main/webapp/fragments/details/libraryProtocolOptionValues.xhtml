<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.libraryProtocolOptionValues}">
    <c:forEach items="#{instance.libraryProtocolOptionList}" var="optionItem">
      <h:outputText value="#{optionItem.name}" styleClass="background-grey" />
      <h:outputText value="#{optionItem.optionValueHoldersAsString}" styleClass="warn background-grey" />
    </c:forEach>
  </c:if>
</ui:composition>
