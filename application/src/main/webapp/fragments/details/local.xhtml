<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.local}">
    <h:outputText value="#{messages.local}" />
    <h:outputText value="#{stringHelper.toYesNo(instance.local)}"
                  styleClass="#{stringHelper.toGreenRed(instance.local)}" />
  </c:if>
</ui:composition>
