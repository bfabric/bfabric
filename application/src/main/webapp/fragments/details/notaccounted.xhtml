<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.notAccounted}">
    <h:outputText value="#{messages.notAccounted}" title="#{messages.notAccountedHint}" />
    <h:outputText value="#{instance.notAccounted}" title="#{messages.notAccountedHint}">
      <f:convertNumber pattern="0.00" />
    </h:outputText>
  </c:if>
</ui:composition>
