<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.offer}">
    <h:outputText value="#{messages.offer}" />
    <h:panelGroup>
      <ui:include src="/fragments/entity-link-displayname.xhtml">
        <ui:param
          name="instance"
          value="#{instance.offer}" />
      </ui:include>
      <ui:include src="/offer/download-icon.xhtml">
        <ui:param
          name="instance"
          value="#{instance.offer}" />
      </ui:include>
    </h:panelGroup>
  </c:if>
</ui:composition>
