<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{not empty content}">
    <h:outputText value="#{label}" />
    <h:panelGroup rendered="#{empty showSizeOnly or not showSizeOnly}">
      <c:if test="#{not empty hint}">
        <h:outputText value="#{hint}" styleClass="warn" />
      </c:if>
      <ui:repeat
        value="#{content}"
        var="item">
        <ui:include src="/fragments/entity-link.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
        </ui:include>
        <p:spacer width="5" />
      </ui:repeat>
    </h:panelGroup>
    <h:panelGroup rendered="#{not empty showSizeOnly and showSizeOnly}">
      <h:outputText value="#{content.size()}" />
    </h:panelGroup>
  </c:if>
</ui:composition>
