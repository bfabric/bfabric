<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.required}">
    <h:outputText value="#{messages.required}" />
    <h:outputText value="#{instance.required}" styleClass="#{stringHelper.toGreenRed(instance.required)}" />
  </c:if>
</ui:composition>
