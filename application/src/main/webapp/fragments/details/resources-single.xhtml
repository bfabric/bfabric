<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{instance.resources.size() == 1}">
    <h:outputText value="#{messages.resource}" />
    <h:panelGroup>
      <ui:repeat
        value="#{instance.resources}"
        var="item">
        <h:form>
          <ui:include src="/resource/download-button.xhtml">
            <ui:param
              name="instance"
              value="#{item}" />
            <ui:param
              name="showName"
              value="true" />
          </ui:include>
        </h:form>
      </ui:repeat>
    </h:panelGroup>
  </c:if>
</ui:composition>
