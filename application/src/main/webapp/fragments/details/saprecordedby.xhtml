<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.sapRecordedBy}">
    <h:outputText value="#{messages.sapRecordedBy}" />
    <h:panelGroup>
      <ui:repeat
        var="item"
        value="#{instance.sapRecordedBy}">
        <ui:include src="/fragments/user-link.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
        </ui:include>
        <br />
      </ui:repeat>
    </h:panelGroup>
  </c:if>
</ui:composition>
