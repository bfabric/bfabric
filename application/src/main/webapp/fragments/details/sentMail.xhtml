<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.sentMail}">
    <h:outputText value="#{messages.sentMail}" />
    <h:outputText value="#{instance.sentMail}" styleClass="#{stringHelper.toGreenRed(instance.sentMail)}" />
  </c:if>
</ui:composition>
