<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.servicesEnabled}">
    <h:outputText value="#{messages.services} #{messages.enabled}" />
    <h:outputText value="#{instance.servicesEnabled.size()}" />
  </c:if>
</ui:composition>
