<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.serviceTypesDisabled}">
    <h:outputText value="#{messages.serviceTypesDisabled}" />
    <h:panelGroup styleClass="inner-repeat">
      <ui:repeat
        var="item"
        value="#{instance.serviceTypesDisabled}">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
        </ui:include>
        <br />
      </ui:repeat>
    </h:panelGroup>
  </c:if>
</ui:composition>
