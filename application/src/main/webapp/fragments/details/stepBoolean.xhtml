<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.step}">
    <h:outputText value="#{messages.step}" />
    <h:outputText value="#{instance.step}" styleClass="#{stringHelper.toGreenRed(instance.step)}" />
  </c:if>
</ui:composition>
