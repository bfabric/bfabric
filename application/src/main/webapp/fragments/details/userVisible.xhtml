<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.userVisible}">
    <h:outputText value="#{messages.userVisible}" />
    <h:outputText value="#{instance.userVisible}" styleClass="#{stringHelper.toGreenRed(instance.userVisible)}" />
  </c:if>
</ui:composition>
