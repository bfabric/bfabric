<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.users}">
    <h:outputText value="#{not empty label ? label : messages.users}" />
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="user" />
      <ui:param
        name="tableContext"
        value="#{instance.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{instance.users}" />
      <ui:param
        name="hideColumns"
        value="userLogin, entityId, organization, department, division, emailActive, emailVerified, computerLoginEnabled, dataAccessEnabled, computerLoginActivated, massMailEnabled, invalidLoginAttempts, lastActionTime, createdBy, createdOn, modifiedBy, modifiedOn" />
      <ui:param
        name="styleClass"
        value="inner-table" />
    </ui:include>
  </c:if>
</ui:composition>
