<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.users}">
    <h:outputText value="#{messages.users}" />
    <h:outputText
      rendered="#{empty instance.users}"
      value="#{messages.none}" />
    <h:panelGroup styleClass="inner-repeat">
      <ui:repeat
        value="#{instance.users}"
        var="item">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
        </ui:include>
        <br />
      </ui:repeat>
    </h:panelGroup>
  </c:if>
</ui:composition>
