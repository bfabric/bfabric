<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.valid}">
    <h:outputText value="#{messages.valid}" />
    <h:outputText value="#{instance.valid}" styleClass="#{stringHelper.toGreenRed(instance.valid)}" />
  </c:if>
</ui:composition>
