<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.viewedBy and instance.viewedBy.size() le configuration.maxItemsOnShowDetails}">
    <h:outputText value="#{messages.viewedBy}" />
    <h:panelGroup>
      <ui:repeat
        var="item"
        value="#{instance.viewedBy}">
        <ui:include src="/fragments/entity-link-name.xhtml">
          <ui:param
            name="instance"
            value="#{item}" />
        </ui:include>
        <br />
      </ui:repeat>
    </h:panelGroup>
  </c:if>
</ui:composition>
