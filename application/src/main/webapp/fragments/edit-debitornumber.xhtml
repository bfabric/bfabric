<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <h:panelGroup id="debitorNumberGroup">
    <h:panelGrid
      rendered="#{identityManager.hasCurrentUserRole('bookingManager')}"
      columns="2"
      columnClasses="rtdm, ltd">
      <h:outputText value="#{messages.debitorNumber}" />
      <ui:decorate template="/fragments/edit.xhtml">
        <p:inputNumber
          id="debitorNumber"
          value="#{callerEntity.debitorNumber}"
          thousandSeparator=""
          decimalPlaces="0"
          styleClass="editWidthExtraLarge" />
      </ui:decorate>
    </h:panelGrid>
  </h:panelGroup>
</ui:composition>
