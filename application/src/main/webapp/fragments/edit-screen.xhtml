<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  template="/layout/template.xhtml">
  <ui:define name="metadata">
    <f:event type="preRenderView" listener="#{identityManager.restrict(instance.editable)}" />
  </ui:define>

  <ui:define name="pageTitle">
    <h:panelGroup>
      <c:if test="#{instance.cloned}">
        <h:outputText value="#{messages.clone} #{instance.classLabel} : #{instance.clone.displayName}" />
      </c:if>
      <c:if test="#{instance.moved}">
        <h:outputText value="#{messages.move} #{instance.classLabel} : #{instance.displayName}" />
      </c:if>
      <c:if test="#{not instance.managed and not instance.clonedOrMoved}">
        <h:outputText value="#{messages.create} #{instance.classLabel}" />
      </c:if>
      <c:if test="#{instance.managed and not instance.clonedOrMoved}">
        <h:outputText value="#{messages.edit}  #{instance.classLabel} : #{instance.displayName}" />
      </c:if>
    </h:panelGroup>
  </ui:define>

  <ui:define name="body">
    <ui:include src="/#{instance.classNameLowerCase}/edit.xhtml" />
  </ui:define>
</ui:composition>
