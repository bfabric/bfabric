<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <h:panelGrid
    columns="3"
    columnClasses="ttdRequired, ttd, ttd"
    cellspacing="0"
    cellpadding="0">
    <h:panelGroup styleClass="required">
      <h:outputText
        rendered="#{required}"
        value="*"
        title="#{messages.requiredHint}" />
    </h:panelGroup>
    <ui:insert />
    <p:message
      for="#{componentId == null ? '@previous' : componentId}"
      styleClass="errorMessage" />
  </h:panelGrid>
</ui:composition>
