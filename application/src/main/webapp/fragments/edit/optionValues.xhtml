<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{not empty instance.optionValues}">
    <h:outputText value="#{messages.optionValues}" />
    <ui:decorate template="/fragments/display.xhtml">
      <h:panelGroup styleClass="inner-repeat">
        <ui:repeat value="#{instance.optionValues}" var="item">
          <ui:include src="/fragments/entity-link-name.xhtml">
            <ui:param name="instance" value="#{item}" />
          </ui:include>
          <br />
        </ui:repeat>
      </h:panelGroup>
    </ui:decorate>
  </c:if>
</ui:composition>
