<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:link
    rendered="#{not empty instance and (empty rendered or rendered)}"
    outcome="#{instance.urlShowScreen}"
    value="#{entityValue != null ? entityValue : instance.id}"
    title="#{entityHint != null ? entityHint : instance.entityInfo}"
    target="_blank"
    rel="noopener">
    <f:param
      name="id"
      value="#{instance.id}" />
    <f:param
      name="tab"
      value="#{not empty tab ? tab : constants.DETAILS}" />
  </p:link>
</ui:composition>
