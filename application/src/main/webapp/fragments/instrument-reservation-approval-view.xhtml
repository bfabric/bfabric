<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:set
    var="ajaxChangeListenerRendered"
    value="#{not empty ajaxChangeListener}" />

  <!-- Note: Do not set unselectable="true" as there is no ajax event supported for unselecting a radio button which is needed in order to update the scheduleWidgetVar. -->
  <p:selectOneRadio
    id="#{id}"
    value="#{value}">
    <f:selectItem
      itemLabel="#{messages.all}"
      itemValue="all" />
    <f:selectItem
      itemLabel="#{messages.nonRejected}"
      itemValue="nonRejected" />
    <f:selectItem
      itemLabel="#{messages.approvalPending}"
      itemValue="approvalPending" />
    <f:selectItem
      itemLabel="#{messages.approved}"
      itemValue="approved" />
    <f:selectItem
      itemLabel="#{messages.rejected}"
      itemValue="rejected" />
    <c:if test="#{ajaxChangeListenerRendered}">
      <p:ajax
        event="change"
        global="false"
        listener="#{ajaxChangeListener}" />
    </c:if>
    <c:if test="#{not ajaxChangeListenerRendered and not empty scheduleWidgetVar}">
      <p:ajax
        event="change"
        global="false"
        immediate="true"
        update="#{empty valueChangeUpdate ? '@this' : valueChangeUpdate}"
        oncomplete="PF('#{scheduleWidgetVar}').update();" />
    </c:if>
  </p:selectOneRadio>
  <p:spacer height="14" />
</ui:composition>
