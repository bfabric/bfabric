<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <!--@elvariable id="instance" type="org.bfabric.entity.AbstractEntity"-->
  <c:if test="#{instance.hasDashboard()}">
    <ui:include src="/fragments/sidebar/set.xhtml">
      <ui:param name="label" value="#{not empty label ? label : messages.dashboard}" />
      <ui:param name="tab" value="#{not empty tab ? tab : 'dashboard'}" />
      <ui:param name="showAlways" value="#{not empty showAlways ? showAlways : true}" />
    </ui:include>
  </c:if>
</ui:composition>
