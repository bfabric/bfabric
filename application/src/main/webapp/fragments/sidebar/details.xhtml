<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="false">
    <h:panelGroup styleClass="showOnDesktop">
      <ui:include src="/fragments/qr-code.xhtml" />
    </h:panelGroup>
    <span />
  </c:if>
  <ui:include src="/fragments/sidebar/parent.xhtml" />
  <c:if test="#{identityManager.hasCurrentUserRole('admin') and instance.getClass().getSimpleName() == 'Workunit'}">
    <p:link value="#{messages.details}-gold" styleClass="#{sidebarHelper.tabStyleClass('details-gold')}">
      <f:param name="id" value="#{instance.id}" />
      <f:param name="tab" value="#{constants.DETAILS}-gold" />
    </p:link>
    <span />
  </c:if>
  <p:link value="#{messages.details}" styleClass="#{sidebarHelper.tabStyleClass('details')}">
    <f:param name="id" value="#{instance.id}" />
    <f:param name="tab" value="#{constants.DETAILS}" />
  </p:link>
  <span />
  <ui:include src="/fragments/sidebar/dashboard.xhtml" />
  <ui:include src="/fragments/sidebar/log.xhtml" />
</ui:composition>
