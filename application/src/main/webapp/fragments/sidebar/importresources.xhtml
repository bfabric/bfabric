<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{configuration.dataManagementEnabled and (empty enabled or enabled)}">
    <ui:include src="/fragments/sidebar/set.xhtml">
      <ui:param
        name="content"
        value="#{content != null ? content : instance.importResources}" />
      <ui:param
        name="label"
        value="#{not empty label ? label : messages.importResources}" />
      <ui:param
        name="tab"
        value="#{not empty tab ? tab : 'importresources'}" />
    </ui:include>
  </c:if>
</ui:composition>
