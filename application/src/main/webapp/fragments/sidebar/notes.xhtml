<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  <ui:include src="/fragments/sidebar/set.xhtml">
    <ui:param
      name="content"
      value="#{content != null ? content : instance.notesCurrentUser}" />
    <ui:param
      name="label"
      value="#{not empty label ? label : messages.notes}" />
    <ui:param
      name="tab"
      value="#{not empty tab ? tab : 'notes'}" />
    <ui:param
      name="showAlways"
      value="#{not empty showAlways ? showAlways : 'true'}" />
  </ui:include>
</ui:composition>
