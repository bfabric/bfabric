<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <!--@elvariable id="instance" type="org.bfabric.entity.AbstractEntity"-->
  <c:if test="#{not empty instance.parent}">
    <h:panelGroup>
      <ui:include src="/fragments/entity-link.xhtml">
        <ui:param name="instance" value="#{instance.parent}" />
        <ui:param name="entityValue" value="#{messages.parent} #{messages[instance.classNameFirstLowerCase]}" />
        <ui:param name="title" value="#{instance}" />
      </ui:include>
    </h:panelGroup>
    <span />
  </c:if>
</ui:composition>
