<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  template="/layout/template.xhtml">
  <ui:define name="pageTitle">
    <ui:include src="/fragments/show-page-title.xhtml" />
  </ui:define>

  <ui:param name="sidebar" value="true" />

  <ui:define name="sidebarContent">
    <h:panelGrid
      columns="2"
      columnClasses="sidebar-col-left, sidebar-col-right"
      styleClass="max-width">
      <ui:include src="/fragments/sidebar/details.xhtml" />
    </h:panelGrid>
  </ui:define>

  <ui:define name="body">
    <ui:include src="/#{instance.classNameLowerCase}/#{sidebarHelper.body}" />
  </ui:define>
</ui:composition>
