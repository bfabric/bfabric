<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  <ui:include src="/fragments/sidebar/set.xhtml">
    <ui:param
      name="content"
      value="#{content != null ? content : instance.states}" />
    <ui:param
      name="label"
      value="#{not empty label ? label : messages.states}" />
    <ui:param
      name="tab"
      value="#{not empty tab ? tab : 'states'}" />
    <ui:param
      name="showAlways"
      value="true" />
  </ui:include>
</ui:composition>
