<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <h:panelGroup rendered="#{not empty instance}">
    <p:link
      outcome="#{instance.urlShowScreen}"
      value="#{entityValue != null ? entityValue : instance.name}"
      title="#{entityHint != null ? entityHint : ''}">
      <f:param
        name="id"
        value="#{instance.id}" />
      <f:param
        name="tab"
        value="#{not empty tab ? tab : constants.DETAILS}" />
    </p:link>
    <ui:include src="/fragments/user-hints.xhtml" />
  </h:panelGroup>
</ui:composition>
