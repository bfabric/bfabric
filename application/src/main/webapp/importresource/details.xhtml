<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />
      <ui:include src="/fragments/details/storage.xhtml" />
      <ui:include src="/fragments/details/relativepath.xhtml" />
      <ui:include src="/fragments/details/uri.xhtml" />
      <ui:include src="/fragments/details/url.xhtml" />
      <ui:include src="/fragments/details/application.xhtml" />
      <ui:include src="/fragments/details/container.xhtml" />
      <ui:include src="/fragments/details/size.xhtml" />
      <ui:include src="/fragments/details/filechecksum.xhtml" />
      <ui:include src="/fragments/details/filedate.xhtml" />
      <ui:include src="/fragments/details/expirationdate.xhtml" />
      <ui:include src="/fragments/details/sample.xhtml" />

      <c:if test="#{not empty importResource.report}">
        <h:outputText value="#{messages.report}" />
        <h:outputText value="#{importResource.report}" />
      </c:if>

      <ui:include src="/fragments/details/description-links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="3"
      styleClass="action">
      <ui:include src="/fragments/button/edit-delete-list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
