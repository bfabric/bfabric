<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column>
    <f:facet name="header">
      <div align="left">
        <h:outputText value="#{messages.institute}" />
      </div>
    </f:facet>
    <h:outputText value="#{item.name}" />
  </p:column>
  <p:column>
    <f:facet name="header">
      <div align="left">
        <h:outputText value="#{messages.department}" />
      </div>
    </f:facet>
    <h:outputText value="#{item.department.name}" />
  </p:column>
  <p:column>
    <f:facet name="header">
      <div align="left">
        <h:outputText value="#{messages.organization}" />
      </div>
    </f:facet>
    <h:outputText value="#{item.department.organization.name}" />
  </p:column>
</ui:composition>
