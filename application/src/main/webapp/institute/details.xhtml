<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />

      <h:outputText value="#{messages.department}" />
      <h:panelGroup styleClass="inner-repeat">
        <ui:repeat
          var="item"
          value="#{institute.allDepartments}">
          <ui:include src="/fragments/entity-link-name.xhtml">
            <ui:param
              name="instance"
              value="#{item}" />
          </ui:include>
          <h:outputText value=" - " />
          <ui:include src="/fragments/entity-link-name.xhtml">
            <ui:param
              name="instance"
              value="#{item.organization}" />
          </ui:include>
          <br />
        </ui:repeat>
      </h:panelGroup>

      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <c:if test="#{identityManager.hasCurrentUserRole('affiliationReader')}">
      <h:panelGrid
        columns="4"
        styleClass="action">
        <ui:include src="/fragments/button/edit-delete-list.xhtml" />
        <ui:include src="/fragments/button/export-and-download-xml.xhtml" />
      </h:panelGrid>
    </c:if>
  </c:if>
</ui:composition>
