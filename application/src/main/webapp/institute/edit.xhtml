<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{instituteManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <ui:include src="/fragments/select-affiliations.xhtml">
          <ui:param
            name="callerEntity"
            value="#{institute}" />
          <ui:param
            name="caller"
            value="institute" />
        </ui:include>

        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">

          <h:outputText value="#{messages.jointDepartment}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="jointdepartment" />
              <ui:param
                name="value"
                value="#{institute.jointDepartmentAsList}" />
              <o:methodParam
                name="completeMethod"
                value="#{instituteManager.getPossibleJointDepartments}" />
              <ui:param
                name="itemLabel"
                value="#{item.name} - #{item.organization.name}" />
              <ui:param
                name="includeColumns"
                value="/department/autocomplete-columns.xhtml" />
              <ui:param
                name="multiple"
                value="true" />
              <ui:param
                name="styleClass"
                value="editWidthExtraLarge" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{institute.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-edit-cancel.xhtml" />
        </h:panelGrid>
      </h:form>

      <ui:include src="/institute/add-modal.xhtml" />
    </ui:define>
  </ui:decorate>
</ui:composition>
