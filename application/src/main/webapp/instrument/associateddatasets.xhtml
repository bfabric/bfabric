<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('associateddatasets') and identityManager.hasCurrentUserRole('instrumentManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="dataset" />
      <ui:param
        name="tableContext"
        value="#{instrument.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{instrument.associatedDatasets}" />
    </ui:include>
  </c:if>
</ui:composition>
