<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <p:column>
    <h:outputText value="#{item.id}" />
  </p:column>
  <p:column rendered="#{not hideColumns.contains('label')}">
    <h:outputText
      value="#{item.label}"
      styleClass="#{item.label}" />
  </p:column>
  <p:column>
    <h:outputText value="#{stringHelper.truncate(item.name, 60)}" />
  </p:column>
</ui:composition>
