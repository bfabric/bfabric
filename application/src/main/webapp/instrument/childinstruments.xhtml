<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('childinstruments') and identityManager.hasCurrentUserRole('instrumentManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="instrument" />
      <ui:param
        name="tableContext"
        value="#{instrument.tableContext}_children" />
      <ui:param
        name="tableContent"
        value="#{instrument.childInstruments}" />
      <ui:param
        name="hideColumns"
        value="parent" />
    </ui:include>
  </c:if>
</ui:composition>
