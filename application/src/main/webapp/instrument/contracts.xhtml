<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('contracts') and identityManager.hasCurrentUserRole('instrumentManager')}">
    <h:panelGroup id="show-instrument-contracts">
      <ui:include src="/fragments/show-datatable.xhtml">
        <ui:param
          name="tableType"
          value="contract" />
        <ui:param
          name="tableContext"
          value="#{instrument.tableContext}" />
        <ui:param
          name="tableContent"
          value="#{instrumentManager.childContractsIncluded ? instrument.childContracts : instrument.contracts}" />
        <ui:param
          name="hideColumns"
          value="#{instrumentManager.childContractsIncluded ? '' : 'instrument'}" />
        <ui:param
          name="rowStyleClass"
          value="#{entity.rowStyleClass}" />
      </ui:include>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:button
          outcome="/contract/edit.xhtml"
          value="#{messages.addContract}"
          rendered="#{identityManager.hasCurrentUserRole('contractManager')}">
          <f:param
            name="instrumentId"
            value="#{instrument.id}" />
        </p:button>
        <p:commandButton
          action="#{instrumentManager.setChildContractsIncluded(true)}"
          value="#{messages.includeChildContracts}"
          title="#{messages.includeChildContractsHint}"
          global="false"
          update="show-instrument-contracts"
          rendered="#{not instrumentManager.childContractsIncluded}">
        </p:commandButton>
        <p:commandButton
          action="#{instrumentManager.setChildContractsIncluded(false)}"
          value="#{messages.excludeChildContracts}"
          title="#{messages.excludeChildContractsHint}"
          global="false"
          update="show-instrument-contracts"
          rendered="#{instrumentManager.childContractsIncluded}">
        </p:commandButton>
      </h:panelGrid>
    </h:panelGroup>
  </c:if>
</ui:composition>
