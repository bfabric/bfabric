<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('instrumentEvents')}">
    <h:panelGroup id="instrumentEvents">
      <h:panelGroup rendered="#{instrument.showChildInstrumentEventsRendered}">
        <p:commandButton
          action="#{instrument.switchShowChildInstrumentEvents}"
          actionListener="#{dataTableHelper.clear(instrument.tableContext.concat('instrumenteventtableform').concat(instrument.tableContext).concat('instrumenteventtable'))}"
          value="#{instrument.showChildInstrumentEvents ? messages.hideChildInstrumentEvents : messages.showChildInstrumentEvents} (#{instrument.childInstrumentEventsCount})"
          process="@this"
          update="instrumentEvents"
          styleClass="#{instrument.showChildInstrumentEvents ? 'order-comment-header' : ''}" />
        <p></p>
      </h:panelGroup>

      <ui:include src="/fragments/show-datatable.xhtml">
        <ui:param name="tableType" value="instrumentevent" />
        <ui:param name="tableContext" value="#{instrument.tableContext}" />
        <ui:param name="tableContent" value="#{instrument.instrumentEventsLazyModel}" />
        <ui:param name="hideColumns" value="#{instrument.showChildInstrumentEventsRendered ? '' : 'instrument_'}" />
        <ui:param name="rowStyleClass" value="#{entity.getRowStyleClass(instrument)}" />
      </ui:include>
      <h:panelGrid columns="4" styleClass="action">
        <p:button rendered="#{instrument.eventCreatable}" outcome="/instrumentevent/edit.xhtml" value="#{messages.create}">
          <f:param name="instrumentId" value="#{instrument.id}" />
        </p:button>
      </h:panelGrid>
    </h:panelGroup>
  </c:if>
</ui:composition>
