<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{configuration.instrumentReservationEnabled and sidebarHelper.isTab('reservationsettings') and identityManager.hasCurrentUserRole('instrumentReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="instrumentreservationsetting" />
      <ui:param
        name="tableContext"
        value="#{instrument.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{instrument.reservationSettings}" />
      <ui:param
        name="hideColumns"
        value="instrument_" />
    </ui:include>
    <h:form id="#{constants.EDIT}">
      <h:panelGrid
        columns="1"
        styleClass="action">
        <p:button
          outcome="/instrumentreservationsetting/edit.xhtml"
          value="#{messages.add}"
          rendered="#{identityManager.hasCurrentUserRole('instrumentManager')}">
          <f:param
            name="instrumentId"
            value="#{instrument.id}" />
        </p:button>
      </h:panelGrid>
    </h:form>
  </c:if>
</ui:composition>
