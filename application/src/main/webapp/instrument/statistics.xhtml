<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('statistics') and identityManager.hasCurrentUserRole('instrumentReader')}">
    <c:set
      value="#{statisticsList.getInstrumentsStatisticsDaysPerYear(instrument)}"
      var="tableContent" />
    <h:form>
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param
          name="include"
          value="/instrument/reservation-cube-columns.xhtml" />
        <ui:param
          name="tableContext"
          value="#{instrument.tableContext}_statistics" />
        <ui:param
          name="tableContent"
          value="#{tableContent}" />
        <ui:param
          name="rowsPerPageDropdown"
          value="all" />
      </ui:include>
    </h:form>

    <c:if test="#{empty tableContent}">
      <h:outputText value="#{messages.statisticsPerYearNotAvailable}" />
    </c:if>
    <c:if test="#{not empty tableContent}">
      <p:spacer height="20" />
      <h:panelGrid columns="3">
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentReservationDaysPerYear(instrument), messages.reservationDaysPerYear, null, messages.name, null, null)}" />
        <p:spacer width="20" />
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentMaintenanceDaysPerYear(instrument), messages.maintenanceDaysPerYear,null, messages.name, null, null)}" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentUpDaysPerYear(instrument), messages.upDaysPerYear,null, messages.name, null, null)}" />
        <p:spacer width="20" />
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentBookableDaysPerYear(instrument), messages.bookableDaysPerYear,null, messages.name, null, null)}" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:barChart
          model="#{barChart.getHorizontal(statisticsList.getInstrumentReservationChargedSumPerYear(instrument), messages.totalBookedChargesCHFPerYear, null, messages.name, null, null)}" />
        <p:spacer width="20" />
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentWorkunitsPerYear(instrument), messages.instrumentWorkunitsPerYear, null, messages.name, null, null)}" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentResourcesPerYear(instrument), messages.instrumentResourcesPerYear, null, messages.name, null, null)}" />
        <p:spacer width="20" />
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentResourcesSizePerYear(instrument), messages.instrumentResourcesSizePerYear, null, messages.name, null, null)}" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:spacer height="20" />
        <p:barChart model="#{barChart.getHorizontal(statisticsList.getInstrumentRunsPerYear(instrument), messages.instrumentRunsPerYear, null, messages.name, null, null)}" />
        <p:spacer width="20" />
      </h:panelGrid>
    </c:if>
  </c:if>
</ui:composition>
