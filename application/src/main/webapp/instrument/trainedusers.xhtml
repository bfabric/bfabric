<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('trainedusers') and identityManager.hasCurrentUserRole('instrumentReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="user" />
      <ui:param
        name="tableContext"
        value="#{instrument.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{instrument.trainedUsers}" />
      <ui:param
        name="hideColumns"
        value="entityId, company, emailActive, emailVerified, computerLoginEnabled, dataAccessEnabled, computerLoginActivated, massMailEnabled, invalidLoginAttempts, LastLoginDate, LastActionTime, createdBy, createdOn" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
