<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{instrumentDataDeliveryManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form
        id="#{constants.EDIT}"
        onsubmit="#{instrumentDataDeliveryManager.resetRefererURL()}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{instrumentDataDelivery.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.instrument}" />
          <ui:include src="/fragments/autocomplete-required.xhtml">
            <ui:param
              name="listContext"
              value="instrument" />
            <ui:param
              name="value"
              value="#{instrumentDataDelivery.instrument}" />
            <o:methodParam
              name="completeMethod"
              value="#{instrumentDataDeliveryManager.getInstruments}" />
            <ui:param
              name="itemLabel"
              value="#{item.displayName}" />
          </ui:include>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{instrumentDataDelivery.enabled}" />
          </ui:decorate>
        </h:panelGrid>

        <ui:include src="/fragments/edit/customattributes.xhtml" />

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
