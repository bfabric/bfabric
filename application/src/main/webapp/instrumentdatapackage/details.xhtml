<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />
      <ui:include src="/fragments/details/instrument.xhtml" />
      <ui:include src="/fragments/details/rununittype.xhtml" />

      <c:if test="#{not empty instrumentDataPackage.numberOfLanes}">
        <h:outputText value="#{messages.numberOfLanes}" />
        <h:outputText value="#{instrumentDataPackage.numberOfLanes}" />
      </c:if>

      <ui:include src="/fragments/details/servicetypesdisabled.xhtml" />

      <ui:include src="/fragments/details/enabled.xhtml" />
      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="5"
      styleClass="action">
      <ui:include src="/fragments/button/edit-clone-links-delete-list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
