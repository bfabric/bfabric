<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:event type="preRenderView" listener="#{identityManager.restrictRole('instrumentReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.instrumentEvents}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/lazylist-with-create.xhtml">
      <ui:param name="tableType" value="instrumentevent" />
      <ui:param name="buttonRendered" value="#{identityManager.hasCurrentUserRole('instrumentManager')}" />
    </ui:include>
  </ui:define>
</ui:composition>
