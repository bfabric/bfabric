<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <ui:param name="entityManager" value="#{instrumentEventTypeManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid columns="2" columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="#{constants.NAME}" value="#{instrumentEventType.name}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.userVisible}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="userVisible" value="#{instrumentEventType.userVisible}" />
          </ui:decorate>

          <h:outputText value="#{messages.userCreatable}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="userCreatable" value="#{instrumentEventType.userCreatable}" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea id="description" value="#{instrumentEventType.description}" rows="3" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="enabled" value="#{instrumentEventType.enabled}" />
          </ui:decorate>
        </h:panelGrid>

        <ui:include src="/fragments/edit/customattributes.xhtml" />

        <h:panelGrid columns="2" styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
