<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{instrumentReadConfigurationManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form
        id="#{constants.EDIT}"
        onsubmit="#{instrumentReadConfigurationManager.resetRefererURL()}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{instrumentReadConfiguration.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.instrument}" />
          <ui:include src="/fragments/autocomplete-required.xhtml">
            <ui:param
              name="listContext"
              value="instrument" />
            <ui:param
              name="value"
              value="#{instrumentReadConfiguration.instrument}" />
            <o:methodParam
              name="completeMethod"
              value="#{instrumentReadConfigurationManager.getInstruments}" />
            <ui:param
              name="itemLabel"
              value="#{item.displayName}" />
          </ui:include>

          <h:outputText value="#{messages.hint}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="hint"
              value="#{instrumentReadConfiguration.hint}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.serviceTypesDisabled}"
                        rendered="#{not empty instrumentReadConfiguration.serviceTypesDisabled or not empty instrumentReadConfiguration.instrument.serviceTypes}" />
          <h:panelGroup id="serviceTypePanelGroup" rendered="#{not empty instrumentReadConfiguration.serviceTypesDisabled or not empty instrumentReadConfiguration.instrument.serviceTypes}">
            <ui:decorate template="/fragments/edit.xhtml">
              <p:selectManyButton id="serviceType" value="#{instrumentReadConfiguration.serviceTypesDisabled}" collectionType="java.util.HashSet" styleClass="editWidthExtraHuge"
                                  converter="omnifaces.SelectItemsConverter">
                <f:selectItems var="item" value="#{instrumentReadConfiguration.instrument.serviceTypes}" itemLabel="#{item.displayName}" />
              </p:selectManyButton>
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{instrumentReadConfiguration.enabled}" />
          </ui:decorate>

          <c:if test="#{identityManager.hasCurrentUserRole('samplePreparationProtocolManager')}">
            <h:outputText value="#{messages.samplePreparationProtocols}" />
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param name="listContext" value="samplepreparationprotocol" />
              <ui:param name="value" value="#{instrumentReadConfiguration.samplePreparationProtocolsAsList}" />
              <ui:param name="multiple" value="true" />
              <o:methodParam name="completeMethod" value="#{instrumentReadConfigurationManager.getSamplePreparationProtocolsFiltered}" />
              <ui:param name="itemLabel" value="#{item.displayName}" />
            </ui:include>
          </c:if>
          <c:if test="#{!identityManager.hasCurrentUserRole('samplePreparationProtocolManager')}">
            <h:outputText value="#{messages.samplePreparationProtocols}" />
            <ui:decorate template="/fragments/display.xhtml">
              <h:outputText value="#{instrumentReadConfiguration.samplePreparationProtocolsDisplayNames}" />
            </ui:decorate>
          </c:if>
        </h:panelGrid>

        <ui:include src="/fragments/edit/customattributes.xhtml" />

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
