<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <ui:param name="entityManager" value="#{instrumentReservationTypeManager}" />
  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid columns="2" columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="#{constants.NAME}" value="#{instrumentReservationType.name}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.chargeable}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="chargeable" value="#{instrumentReservationType.chargeable}" />
          </ui:decorate>

          <h:outputText value="#{messages.color}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:colorPicker
              id="color"
              value="#{instrumentReservationType.color}"
              mode="popup" />
          </ui:decorate>

          <h:outputText value="#{messages.containerAssociated}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="containerAssociated" value="#{instrumentReservationType.containerAssociated}" />
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="enabled" value="#{instrumentReservationType.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea id="description" value="#{instrumentReservationType.description}" rows="3" styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>
        <h:panelGrid columns="2" styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
