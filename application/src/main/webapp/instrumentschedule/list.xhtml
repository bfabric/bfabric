<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:o="http://omnifaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('user') or identityManager.hasCurrentUserRole('instrumentReader'))}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.instrumentReservationsOverview}" />
  </ui:define>

  <ui:define name="body">
    <table
      cellpadding="0"
      cellspacing="0">
      <tr>
        <td class="instrumentreservationfirstcolumn" />
        <td>
          <ui:include src="/fragments/instrument-reservation-approval-view.xhtml">
            <ui:param
              name="id"
              value="approvalStatusView" />
            <ui:param
              name="value"
              value="#{agendaInstrumentReservationManager.view}" />
            <o:methodParam
              name="ajaxChangeListener"
              value="#{agendaInstrumentReservationManager.redirectWithApprovalView}" />
          </ui:include>
        </td>
      </tr>
    </table>

    <c:set value="#{identityManager.hasCurrentUserRole('instrumentReader') ? null : currentUser}" var="slotUser" />
    <h:form id="overviewForm">
      <ui:include src="paginator-navigation.xhtml" />
      <div class="oversize">
        <table
          class="overview align-middle"
          cellpadding="0"
          cellspacing="0">
          <tr />
          <ui:include src="paginator-month.xhtml" />
          <ui:include src="paginator-day-filter.xhtml" />
          <c:set
            value="#{instrumentList.getBookableInstrumentsByTechnology(sessionManager.technologyFilter)}"
            var="bookableInstrumentsByTechnologyFilter" />
          <ui:repeat
            value="#{bookableInstrumentsByTechnologyFilter}"
            var="instrumentEntity">
            <tr>
              <td class="instrumentreservationfirstcolumn"><h:panelGroup rendered="#{not instrumentEntity.up}">
                <i class="fas fa-exclamation-circle warning" />
              </h:panelGroup>
                <ui:include src="/fragments/entity-link.xhtml">
                  <ui:param
                    name="instance"
                    value="#{instrumentEntity}" />
                  <ui:param
                    name="entityValue"
                    value="#{stringHelper.truncate(instrumentEntity.label, 26)}" />
                  <ui:param
                    name="entityHint"
                    value="#{instrumentEntity.labelSpecifics} #{not instrumentEntity.up ? ' -> '.concat(messages.instrumentDownHint) : ''}" />
                </ui:include>
              </td>
              <ui:repeat
                value="#{agendaInstrumentReservationHelper.getSlotsForInstrument(instrumentEntity)}"
                var="slot">
                <td
                  class="slotIB slotLink #{slot.slotStyleClass}"
                  title="#{slot.description}"
                  onclick="#{(instrumentEntity.creatable || instrumentEntity.userVisible) ? 'window.location.href=': ''}'#{agendaInstrumentReservationManager.getLink(slot.link)}';"
                  style="#{slot.getStyle(slotUser)}"><h:outputText
                  value="#{slot.content}" /></td>
              </ui:repeat>
            </tr>
          </ui:repeat>
          <c:if test="#{bookableInstrumentsByTechnologyFilter.size() > 20}">
            <ui:include src="paginator-day.xhtml" />
            <ui:include src="paginator-month.xhtml" />
          </c:if>
        </table>
      </div>
    </h:form>
  </ui:define>
</ui:composition>
