<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <tr>
    <td class="instrumentreservationfirstcolumn" />
    <ui:repeat
      var="slot"
      value="#{agendaInstrumentReservationHelper.headSlots}">
      <ui:fragment rendered="#{slot.isMonthSpanGreaterThan(0)}">
        <td colspan="#{slot.monthSpan}"><h:outputText
          value="#{slot.monthYearAsText}"
          class="slotHeaderYear" /></td>
      </ui:fragment>
    </ui:repeat>
  </tr>
</ui:composition>
