<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('jobLogs')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="joblog" />
      <ui:param
        name="tableContext"
        value="#{job.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{job.jobLogs}" />
      <ui:param
        name="hideColumns"
        value="job, action, status, entityId" />
    </ui:include>
  </c:if>
</ui:composition>
