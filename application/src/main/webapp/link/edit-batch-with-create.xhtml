<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:event
      type="preRenderView"
      listener="#{identityManager.restrict(linkParent.editable)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{empty linkParent.links ? messages.addLink : messages.editLinks}" />
  </ui:define>

  <ui:define name="body">
    <h:form id="edit-links">
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param
          name="tableContext"
          value="links" />
        <ui:param
          name="tableContent"
          value="#{linkParent.links}" />
        <ui:param
          name="parent"
          value="#{linkParent}" />
        <ui:param
          name="include"
          value="/link/edit-batch-columns.xhtml" />
        <ui:param
          name="showEmpty"
          value="true" />
        <ui:param
          name="editable"
          value="true" />
        <ui:param
          name="paginator"
          value="false" />
      </ui:include>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{linksManager.save}"
          value="#{messages.save}"
          update="@form">
          <p:ajax listener="#{linksManager.removeEmptyLinks}" update="@form" />
        </p:commandButton>
        <p:commandButton
          action="#{linksManager.cancel}"
          value="#{messages.cancel}"
          immediate="true" />
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
