<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <ui:param
    name="entityManager"
    value="#{linkManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="edit-link">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.url}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              value="#{link.url}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              value="#{link.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.parent}" />
          <ui:decorate template="/fragments/display.xhtml">
            <ui:include src="/fragments/entity-link.xhtml">
              <ui:param
                name="instance"
                value="#{link.parent}" />
              <ui:param
                name="entityValue"
                value="#{instance}" />
            </ui:include>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
