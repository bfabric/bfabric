<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column exportable="false">
    <f:facet name="header">
      <h:panelGrid
        columns="1"
        styleClass="nospace noborder">
        <h:outputText value="#{messages.select}" />
        <h:panelGrid
          columns="2"
          styleClass="select-icon">
          <p:commandLink
            actionListener="#{mailBatchManager.selectAll}"
            immediate="true"
            global="false"
            update="@form">
            <i class="far fa-check-square" />
          </p:commandLink>
          <p:commandLink
            actionListener="#{mailBatchManager.deselectAll}"
            immediate="true"
            global="false"
            update="@form">
            <i class="far fa-square" />
          </p:commandLink>
        </h:panelGrid>
      </h:panelGrid>
    </f:facet>
    <h:selectBooleanCheckbox
      id="check#{entity.id}"
      value="#{entity.checked}">
      <p:ajax
        event="change"
        immediate="true"
        global="false"
        update="send-mail:selectedUsersGrid" />
    </h:selectBooleanCheckbox>
  </p:column>
  <ui:include src="/fragments/column/lastname-userlink.xhtml" />
  <ui:include src="/fragments/column/firstname-userlink.xhtml" />
  <ui:include src="/fragments/column/login.xhtml" />
  <ui:include src="/fragments/column/email.xhtml" />
  <ui:include src="/fragments/column/affiliationstring.xhtml" />
</ui:composition>
