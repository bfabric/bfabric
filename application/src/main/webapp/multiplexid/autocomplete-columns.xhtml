<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <p:column>
    <h:outputText value="#{item.name}" />
  </p:column>
  <p:column rendered="#{not hideColumns.contains('plateNumber')}">
    <p:column>
      <h:outputText value="#{item.plateNumber}" />
    </p:column>
  </p:column>
  <p:column rendered="#{not hideColumns.contains('platePosition')}">
    <h:outputText
      value="#{item.platePosition}" />
  </p:column>
</ui:composition>
