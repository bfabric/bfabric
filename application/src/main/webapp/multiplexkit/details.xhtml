<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />

      <h:outputText
        value="#{messages.combinedMultiplexId}"
        title="#{messages.combinedMultiplexIdHint}" />
      <h:outputText value="#{multiplexKit.combinedMultiplexId}" />

      <h:outputText
        title="#{messages.multiplexIdOrderColumnWiseHint}"
        value="#{messages.multiplexIdOrderColumnWise}" />
      <h:outputText value="#{multiplexKit.multiplexIdOrderColumnWise}" />

      <ui:include src="/fragments/details/servicetypes.xhtml" />
      <ui:include src="/fragments/details/description-enabled-links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid columns="4" styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <c:if test="#{identityManager.hasCurrentUserRole('labManager')}">
        <ui:include src="/fragments/button/switchenabled.xhtml" />
      </c:if>
      <ui:include src="/fragments/button/delete.xhtml" />
      <ui:include src="/fragments/button/list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
