<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{multiplexKitManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{multiplexKit.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText
            title="#{messages.combinedMultiplexIdHint}"
            value="#{messages.combinedMultiplexId}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox value="#{multiplexKit.combinedMultiplexId}" />
          </ui:decorate>

          <h:outputText
            title="#{messages.multiplexIdOrderColumnWiseHint}"
            value="#{messages.multiplexIdOrderColumnWise}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox value="#{multiplexKit.multiplexIdOrderColumnWise}" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="description"
              value="#{multiplexKit.description}"
              rows="3"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{multiplexKit.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.serviceTypes}" />
          <ui:decorate template="/fragments/display.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param name="listContext" value="servicetypes" />
              <ui:param name="value" value="#{multiplexKit.serviceTypesAsList}" />
              <o:methodParam name="completeMethod" value="#{multiplexKitManager.getPossibleServiceTypes}" />
              <ui:param name="itemLabel" value="#{item.displayName}" />
              <ui:param name="multiple" value="true" />
              <ui:param name="styleClass" value="editWidthExtraLarge" />
            </ui:include>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
