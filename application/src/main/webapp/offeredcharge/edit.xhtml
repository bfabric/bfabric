<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{offeredChargeManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          id="chargePanel"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.offer}" />
          <ui:decorate template="/fragments/display.xhtml">
            <ui:include src="/fragments/entity-link-displayname.xhtml">
              <ui:param
                name="instance"
                value="#{offeredCharge.offer}" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.service}" />
          <h:panelGrid>
            <h:panelGroup>
              <ui:decorate template="/fragments/required.xhtml">
                <ui:include src="/fragments/datatable.xhtml">
                  <o:methodParam
                    name="rowSelectRadioListener"
                    value="#{offeredChargeManager.serviceChanged}" />
                  <ui:param
                    name="include"
                    value="/service/select-columns-for-charging.xhtml" />
                  <ui:param
                    name="tableContext"
                    value="#{constants.SERVICE_SELECTION}" />
                  <ui:param
                    name="tableContent"
                    value="#{serviceList.getEnabledServicesForOfferIncluding(offeredCharge.service.id)}" />
                  <ui:param
                    name="selectedService"
                    value="#{offeredCharge.service}" />
                  <ui:param
                    name="selectionMode"
                    value="#{offeredCharge.managed ? 'single' : 'multiple'}" />
                  <ui:param
                    name="styleClass"
                    value="hideCheckAll inner" />
                  <!-- Do not change below selection assignment -->
                  <c:if test="#{offeredCharge.managed}">
                    <ui:param
                      name="selection"
                      value="#{offeredCharge.service}" />
                  </c:if>
                  <c:if test="#{not offeredCharge.managed}">
                    <ui:param
                      name="selection"
                      value="#{offeredChargeManager.selectedServices}" />
                    <ui:param
                      name="update"
                      value="#{constants.EDIT}:selectedService, #{constants.EDIT}:price" />
                  </c:if>
                  <c:if test="#{offeredCharge.managed}">
                    <ui:param
                      name="update"
                      value="#{constants.EDIT}:selectedService, #{constants.EDIT}:basicPrice, #{constants.EDIT}:price" />
                  </c:if>
                </ui:include>
              </ui:decorate>
            </h:panelGroup>
          </h:panelGrid>

          <h:outputText value="#{messages.selectedService}" />
          <h:panelGroup id="selectedService">
            <h:panelGroup rendered="#{offeredCharge.managed}">
              <ui:decorate template="/fragments/display.xhtml">
                <h:panelGrid rendered="#{offeredCharge != null and offeredCharge.service != null}">
                  <h:outputText value="#{offeredCharge.service.fullName}" />
                </h:panelGrid>
                <h:outputText
                  rendered="#{offeredCharge != null and offeredCharge.service == null}"
                  value="#{messages.none}" />
              </ui:decorate>
            </h:panelGroup>

            <h:panelGroup rendered="#{not offeredCharge.managed}">
              <ui:decorate template="/fragments/display.xhtml">
                <h:panelGrid rendered="#{not empty offeredChargeManager.selectedServices}">
                  <ui:repeat
                    value="#{offeredChargeManager.selectedServices}"
                    var="item">
                    <h:outputText value="#{item.fullName}" />
                    <br />
                  </ui:repeat>
                </h:panelGrid>
                <h:outputText
                  rendered="#{empty offeredChargeManager.selectedServices}"
                  value="#{messages.none}" />
              </ui:decorate>
            </h:panelGroup>
          </h:panelGroup>

          <h:outputText value="#{messages.charger}" />
          <ui:include src="/fragments/autocomplete-required.xhtml">
            <ui:param
              name="listContext"
              value="charger" />
            <ui:param
              name="value"
              value="#{offeredCharge.charger}" />
            <o:methodParam
              name="completeMethod"
              value="#{offeredCharge.getEmployeesIncludingCharger}" />
            <ui:param
              name="itemLabel"
              value="#{item.fullLastFirstName}" />
          </ui:include>

          <h:outputText value="#{messages.quantity}" />
          <ui:decorate template="/fragments/required.xhtml">
            <p:inputNumber id="total"
                           align="right"
                           value="#{offeredCharge.total}"
                           valueChangeListener="#{offeredCharge.totalChanged}"
                           thousandSeparator=""
                           styleClass="editWidthMedium">
              <p:ajax event="change" update="#{constants.EDIT}:price" />
            </p:inputNumber>
          </ui:decorate>

          <h:outputText value="#{messages.taxType}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="taxType"
              value="#{offeredCharge.taxType}"
              valueChangeListener="#{offeredCharge.taxTypeChanged}"
              styleClass="editWidthMedium"
              converter="omnifaces.SelectItemsConverter">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{taxTypeList.resultList}"
                var="item"
                itemLabel="#{item.name}" />
              <p:ajax
                event="change"
                update="#{constants.EDIT}:price" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText
            rendered="#{offeredCharge.managed}"
            value="#{messages.basicPrice}" />
          <h:panelGroup rendered="#{offeredCharge.managed}">
            <ui:decorate template="/fragments/display.xhtml">
              <ui:include src="/fragments/formatted-price.xhtml">
                <ui:param
                  name="formattedPriceId"
                  value="basicPrice" />
                <ui:param
                  name="formattedPriceCurrent"
                  value="#{offeredCharge.basicPrice}" />
                <ui:param
                  name="formattedPrice"
                  value="#{offeredCharge.serviceBasicPrice}" />
              </ui:include>
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.total} #{messages.price}" />
          <ui:decorate template="/fragments/display.xhtml">
            <ui:include src="/fragments/formatted-price.xhtml">
              <ui:param
                name="formattedPriceId"
                value="price" />
              <ui:param
                name="formattedPriceCurrent"
                value="#{offeredCharge.price}" />
              <ui:param
                name="formattedPrice"
                value="#{offeredChargeManager.totalPrice}" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="description"
              value="#{offeredCharge.description}"
              rows="3"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.notes}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="notes"
              value="#{offeredCharge.notes}"
              rows="3"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
