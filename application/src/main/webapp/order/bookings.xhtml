<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('bookings')}">
    <c:if test="#{order.project != null and bookingList.getLazyModelByContainers(order.associatedContainers).size() > 0}">
      <ui:include src="/fragments/switch.xhtml">
        <ui:param
          name="widgetVarName"
          value="'orderbooking'" />
        <ui:param
          name="type"
          value="booking" />
        <ui:param
          name="count"
          value="#{bookingList.getLazyModelByContainers(order.associatedContainers).size()}" />
        <ui:param
          name="update"
          value="#{order.tableContext}bookingtableform" />
      </ui:include>
    </c:if>
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="booking" />
      <ui:param
        name="tableContext"
        value="#{order.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{bookingList.getResultListByContainerId(order.id, order.associatedContainers, orderManager.containerAll)}" />
      <ui:param
        name="showColumns"
        value="accountNr, costCentre, bookingDate" />
      <ui:param
        name="hideColumns"
        value="entityId, name, order, project, billingCustomerName, billingEmail, billingAddress, charges" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
    <h:panelGrid
      columns="1"
      styleClass="action">
      <p:button
        outcome="/booking/edit.xhtml"
        value="#{messages.create}"
        rendered="#{order.bookingAddable}">
        <f:param
          name="containerId"
          value="#{order.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
