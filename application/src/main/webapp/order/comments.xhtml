<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:o="http://omnifaces.org/ui">
  <o:importConstants type="org.bfabric.enums.CommentDiscriminator" />
  <c:if test="#{sidebarHelper.isTab('comments') and order.renderedAddCommentButton}">
    <ui:include src="/comment/list-by-parent-with-create.xhtml">
      <ui:param
        name="category"
        value="#{constants.COMMENT_CATEGORY_COMMENT}" />
      <ui:param
        name="type"
        value="#{CommentDiscriminator.ORDER_COMMENT}" />
      <ui:param
        name="parent"
        value="#{order}" />
      <ui:param
        name="comments"
        value="#{order.commentsCurrentUser}" />
      <ui:param
        name="showform"
        value="#{order.renderedAddCommentButton}" />
    </ui:include>
    <ui:include src="/comment/datascroller-listeners.xhtml" />
  </c:if>
</ui:composition>
