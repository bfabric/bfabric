<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{orderManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form
        id="#{constants.EDIT}"
        onsubmit="#{orderManager.resetRefererURL()}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <c:if test="#{identityManager.hasCurrentUserRole('containerManager')}">
            <h:outputText value="#{messages.express}" />
            <ui:decorate template="/fragments/required.xhtml">
              <h:selectOneRadio
                id="express"
                value="#{order.express}">
                <f:selectItem
                  itemLabel="#{messages.no}"
                  itemValue="#{false}" />
                <f:selectItem
                  itemLabel="#{messages.yes}"
                  itemValue="#{true}" />
              </h:selectOneRadio>
            </ui:decorate>

            <h:outputText value="#{messages.internal}" />
            <ui:decorate template="/fragments/required.xhtml">
              <h:selectOneRadio
                id="internal"
                value="#{order.internal}"
                valueChangeListener="#{order.internalChanged}">
                <f:selectItem
                  itemLabel="#{messages.no}"
                  itemValue="#{false}" />
                <f:selectItem
                  itemLabel="#{messages.yes}"
                  itemValue="#{true}" />
                <p:ajax
                  event="change"
                  update="#{constants.EDIT}:servicetype, #{constants.EDIT}:selectedservicetype, #{constants.EDIT}:projectgrid"
                  oncomplete="if(#{order.serviceTypeUpdatable}){PF('serviceSelection').clearFilters();}" />
              </h:selectOneRadio>
            </ui:decorate>
          </c:if>

          <c:if test="#{currentUser.hasNoOrderAssignableProject()}">
            <h:outputText />
            <ui:decorate template="/fragments/display.xhtml">
              <h:outputText value="#{messages.userHasNoOrderAssignableProjectsHint}" styleClass="warning bold" />
            </ui:decorate>
          </c:if>

          <h:outputText rendered="#{order.serviceTypeUpdatable}" value="#{messages.serviceType}" />
          <h:panelGroup id="servicetype" rendered="#{order.serviceTypeUpdatable}">
            <ui:decorate template="/fragments/required.xhtml">
              <ui:include src="/fragments/datatable.xhtml">
                <o:methodParam
                  name="rowSelectRadioListener"
                  value="#{orderManager.serviceTypeSelected}" />
                <ui:param
                  name="include"
                  value="/servicetype/select-columns.xhtml" />
                <ui:param
                  name="tableContext"
                  value="#{constants.SERVICE_SELECTION}" />
                <ui:param
                  name="tableContent"
                  value="#{serviceTypeService.getEnabledServiceTypesByOrder(order)}" />
                <ui:param
                  name="selectionMode"
                  value="single" />
                <ui:param
                  name="selection"
                  value="#{order.serviceType}" />
                <ui:param
                  name="disabledSelection"
                  value="#{currentUser.hasNoOrderAssignableProject() and entity.requiresProject}" />
                <ui:param
                  name="update"
                  value="#{constants.EDIT}:selectedservicetype, #{constants.EDIT}:projectgrid" />
                <ui:param
                  name="customListingRows"
                  value="25" />
                <ui:param
                  name="customRowsPerPageTemplate"
                  value="25,50,100,200" />
                <ui:param
                  name="rowsPerPageDropdown"
                  value="all" />
                <ui:param
                  name="styleClass"
                  value="inner" />
              </ui:include>
            </ui:decorate>
          </h:panelGroup>
        </h:panelGrid>

        <h:panelGroup id="selectedservicetype">
          <h:panelGrid
            rendered="#{not empty order.serviceType}"
            columns="2"
            columnClasses="rtdm, ltd">
            <c:if test="#{order.hasServiceTypeHighThroughputSequencing()}">
              <h:outputText />
              <ui:decorate template="/fragments/display.xhtml">
                <h:outputText
                  value="#{messages.highThroughputSequencingWarning}"
                  styleClass="warning" />
              </ui:decorate>
            </c:if>
            <h:outputText value="#{messages.selectedServiceType}" />
            <ui:decorate template="/fragments/display.xhtml">
              <h:panelGroup>
                <h:outputText value="#{order.serviceType.name}&#160;" />
                <h:outputText
                  rendered="#{not empty order.serviceType.servicesEnabled}"
                  value="#{messages.offersHint}&#160;" />
                <p:commandLink
                  rendered="#{not empty order.serviceType.servicesEnabled}"
                  value="#{order.serviceType.servicesEnabled.size()} #{messages.services}&#160;"
                  title="#{collectionHelper.print(order.serviceType.servicesEnabled)}"
                  global="false"
                  action="#{orderManager.setServiceTypeShowServices(order.serviceType)}"
                  process="@this"
                  update="servicesPanel"
                  oncomplete="PF('servicesDialog').show();"
                  styleClass="inline bold" />
                <h:outputText
                  rendered="#{not empty order.serviceType.servicesEnabled}"
                  value="#{messages.editOrderServiceTypeServicesHint}&#160;" />
                <h:outputText
                  rendered="#{not empty order.orderItems and not empty order.sampleType}"
                  value="(#{messages.editOrderServiceTypeHint.replace('{0}', order.sampleType.name)})" />
                <h:outputText
                  rendered="#{not empty order.orderItems and empty order.sampleType and not empty order.serviceType.sampleType}"
                  value="(#{messages.editOrderServiceTypeHint.replace('{0}', order.serviceType.sampleType.name)})" />
              </h:panelGroup>
            </ui:decorate>

            <c:if test="#{identityManager.hasCurrentUserRole('containerManager') and technologyList.getTechnologiesEnabledIncludingTechnologies(order.technologies).size() > 1}">
              <h:outputText
                value="#{messages.technologies}"
                title="#{messages.editOrderTechnologiesHint}" />
              <ui:decorate template="/fragments/required.xhtml">
                <h:selectManyCheckbox
                  id="technologies"
                  value="#{order.technologies}"
                  collectionType="java.util.HashSet"
                  styleClass="rightpadding"
                  layout="#{collectionHelper.getCheckboxLayout(technologyList.getTechnologiesEnabledIncludingTechnologies(order.technologies))}"
                  converter="omnifaces.SelectItemsConverter">
                  <f:selectItems
                    value="#{technologyList.getTechnologiesEnabledIncludingTechnologies(order.technologies)}"
                    var="item"
                    itemLabel="#{item.nameWithEnabledMessage}"
                    itemDescription="#{item.description}" />
                </h:selectManyCheckbox>
              </ui:decorate>
            </c:if>

            <c:if test="#{not empty order.serviceType.instructionLink}">
              <h:outputText value="#{messages.instructionLink}" />
              <ui:decorate template="/fragments/display.xhtml">
                <h:outputLink
                  value="#{order.serviceType.instructionLink}"
                  target="_blank"
                  rel="noopener">
                  <h:outputText value="#{messages.orderInstructionLinkHint}" />
                </h:outputLink>
              </ui:decorate>
            </c:if>
          </h:panelGrid>

          <h:panelGrid
            rendered="#{not empty order.orderAttributes}"
            columns="2"
            columnClasses="rtdm, ltd">
            <c:if test="#{order.serviceType.isOrderAttribute('bioSafetyLevel2PrecautionsRequired')}">
              <h:outputText value="#{messages.bioSafetyLevel2PrecautionsRequired}" title="#{order.getOrderAttributeHint('bioSafetyLevel2PrecautionsRequired')}" />
              <ui:decorate template="/fragments/required.xhtml">
                <ui:param name="componentId" value="bioSafetyLevel2PrecautionsRequired" />
                <h:selectOneRadio id="bioSafetyLevel2PrecautionsRequired" value="#{order.bioSafetyLevel2PrecautionsRequired}" required="true"
                                  title="#{order.getOrderAttributeHint('bioSafetyLevel2PrecautionsRequired')}">
                  <f:selectItem itemValue="false" itemLabel="#{messages.no}" />
                  <f:selectItem itemValue="true" itemLabel="#{messages.yes}" />
                </h:selectOneRadio>
              </ui:decorate>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('samplesContainTransgenes')}">
              <h:outputText value="#{messages.samplesContainTransgenes}" title="#{order.getOrderAttributeHint('samplesContainTransgenes')}" />
              <ui:decorate template="/fragments/edit.xhtml">
                <ui:param name="componentId" value="samplesContainTransgenes" />
                <h:selectOneRadio id="samplesContainTransgenes" value="#{order.samplesContainTransgenes}" title="#{order.getOrderAttributeHint('samplesContainTransgenes')}">
                  <f:selectItem itemValue="false" itemLabel="#{messages.no}" />
                  <f:selectItem itemValue="true" itemLabel="#{messages.yes}" />
                </h:selectOneRadio>
              </ui:decorate>
            </c:if>
          </h:panelGrid>

          <h:panelGrid
            id="sampleSubmission"
            rendered="#{not empty order.orderAttributes}"
            columns="2"
            columnClasses="rtdm, ltd">
            <c:if test="#{order.serviceType.isOrderAttribute('processesPlates')}">
              <c:if test="#{not empty order.serviceType and (order.serviceType.processesPlates or order.processesPlates)}">
                <h:outputText
                  value="#{messages.sampleSubmission}"
                  title="#{order.getOrderAttributeHint('processesPlates')}" />
                <h:panelGroup rendered="#{not empty order.orderItems}">
                  <ui:decorate template="/fragments/display.xhtml">
                    <h:outputText value="#{order.processesPlates ? messages.plate : messages.tube}" />
                  </ui:decorate>
                </h:panelGroup>
                <h:panelGroup rendered="#{empty order.orderItems}">
                  <ui:decorate template="/fragments/required.xhtml">
                    <ui:param
                      name="componentId"
                      value="processesPlates" />
                    <h:panelGrid columns="2">
                      <h:selectOneRadio
                        id="processesPlates"
                        value="#{order.processesPlates}"
                        valueChangeListener="#{order.processesPlatesChanged}"
                        title="#{order.getOrderAttributeHint('processesPlates')}">
                        <f:selectItem
                          itemValue="false"
                          itemLabel="#{messages.tube}" />
                        <f:selectItem
                          itemValue="true"
                          itemLabel="#{messages.plate}" />
                        <p:ajax
                          event="change"
                          update="#{''.concat(order.serviceType.isOrderAttribute('sequencingApplication') ? 'edit:sequencingApplication' : '')}, #{constants.EDIT}:instrumentIndependent, #{constants.EDIT}:sampleSubmission" />
                      </h:selectOneRadio>
                      <h:outputText
                        rendered="#{not empty order.serviceType.plateSubmissionProposalLimit}"
                        value="&#160;#{order.serviceType.plateSubmissionProposalLimitHint}"
                        styleClass="warning" />
                    </h:panelGrid>
                  </ui:decorate>
                </h:panelGroup>
              </c:if>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('numberOfPlates') and order.processesPlates}">
              <h:outputText
                rendered="#{order.processesPlates and order.serviceType.isOrderAttribute('numberOfPlates')}"
                value="#{messages.numberOfPlates}"
                title="#{order.getOrderAttributeHint('numberOfPlates')}" />
              <h:panelGroup rendered="#{not empty order.orderItems}">
                <ui:decorate template="/fragments/display.xhtml">
                  <h:outputText value="#{order.numberOfPlates}" />
                </ui:decorate>
              </h:panelGroup>
              <h:panelGroup rendered="#{empty order.orderItems}">
                <h:panelGroup rendered="#{order.processesPlates and order.serviceType.isOrderAttribute('numberOfPlates')}">
                  <ui:decorate template="/fragments/required.xhtml">
                    <ui:param
                      name="componentId"
                      value="numberOfPlates" />
                    <h:panelGrid columns="2">
                      <p:inputNumber
                        id="numberOfPlates"
                        value="#{order.numberOfPlates}"
                        title="#{order.getOrderAttributeHint('numberOfPlates')}"
                        thousandSeparator=""
                        decimalPlaces="0"
                        styleClass="editWidthExtraLarge" />
                      <h:outputText
                        value="&#160;#{messages.orderEnterPlatesHint}"
                        styleClass="warn" />
                    </h:panelGrid>
                  </ui:decorate>
                </h:panelGroup>
              </h:panelGroup>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('numberOfSamples') and not order.processesPlates}">
              <h:outputText
                rendered="#{order.serviceType.isOrderAttribute('numberOfSamples')}"
                value="#{messages.numberOfTubes}"
                title="#{order.getOrderAttributeHint('numberOfSamples')}" />
              <h:panelGroup rendered="#{not empty order.orderItems and not empty order.numberOfSamples}">
                <ui:decorate template="/fragments/display.xhtml">
                  <h:outputText value="#{order.numberOfSamples}" />
                </ui:decorate>
              </h:panelGroup>
              <h:panelGroup rendered="#{empty order.orderItems or empty order.numberOfSamples}">
                <h:panelGroup rendered="#{not order.processesPlates and order.serviceType.isOrderAttribute('numberOfSamples')}">
                  <ui:decorate template="/fragments/required.xhtml">
                    <ui:param
                      name="componentId"
                      value="numberOfSamples" />
                    <h:panelGrid columns="2">
                      <p:inputNumber
                        id="numberOfSamples"
                        value="#{order.numberOfSamples}"
                        title="#{order.getOrderAttributeHint('numberOfSamples')}"
                        thousandSeparator=""
                        decimalPlaces="0"
                        styleClass="editWidthExtraLarge">
                        <p:ajax
                          event="change"
                          update="#{constants.EDIT}:sampleSubmission" />
                      </p:inputNumber>
                      <h:outputText
                        value="&#160;#{messages.orderEnterSamplesHint}"
                        styleClass="warn" />
                    </h:panelGrid>
                  </ui:decorate>
                </h:panelGroup>
              </h:panelGroup>
            </c:if>
          </h:panelGrid>

          <h:panelGrid
            rendered="#{not empty order.orderAttributes}"
            columns="2"
            columnClasses="rtdm, ltd">
            <c:if test="#{order.serviceType.isOrderAttribute('sequencingApplication')}">
              <h:outputText
                value="#{messages.sequencingApplication}"
                title="#{order.getOrderAttributeHint('sequencingApplication')}" />
              <ui:decorate template="/fragments/required.xhtml">
                <h:selectOneMenu
                  id="sequencingApplication"
                  value="#{order.sequencingApplication}"
                  valueChangeListener="#{order.sequencingApplicationChanged}"
                  title="#{order.getOrderAttributeHint('sequencingApplication')}"
                  styleClass="editWidthExtraLarge"
                  converter="omnifaces.SelectItemsConverter">
                  <f:selectItem
                    itemLabel="#{messages.selectAnItem}"
                    itemDisabled="true" />
                  <f:selectItems
                    value="#{not order.processesPlates ? sequencingApplicationList.getResultListEnabledIncludingByServiceType(order.serviceType, order.sequencingApplication) : sequencingApplicationList.getResultListEnabledIncludingExcludingByServiceType(order.serviceType, order.sequencingApplication, 'Ready-made Libraries')}"
                    var="item"
                    itemLabel="#{item.name}" />
                  <p:ajax
                    event="change"
                    update="#{constants.EDIT}:instrumentDependent, #{constants.EDIT}:instrumentSpecific, #{constants.EDIT}:libraryProtocolOptionValues" />
                </h:selectOneMenu>
              </ui:decorate>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('instrument')}">
              <h:outputText
                value="#{messages.instrument}"
                title="#{order.getOrderAttributeHint('instrument')}" />
              <ui:decorate template="/fragments/required.xhtml">
                <h:selectOneMenu
                  id="instrument"
                  value="#{order.instrument}"
                  valueChangeListener="#{order.instrumentChanged}"
                  title="#{order.getOrderAttributeHint('instrument')}"
                  styleClass="editWidthExtraLarge"
                  converter="omnifaces.SelectItemsConverter">
                  <f:selectItem
                    itemLabel="#{messages.selectAnItem}"
                    itemDisabled="true" />
                  <f:selectItems
                    value="#{instrumentList.getResultListEnabledIncludingByServiceType(order.instrument, order.serviceType)}"
                    var="item"
                    itemLabel="#{item.name}" />
                  <p:ajax
                    event="change"
                    update="#{constants.EDIT}:instrumentDependent, #{constants.EDIT}:instrumentSpecific" />
                </h:selectOneMenu>
              </ui:decorate>
            </c:if>
          </h:panelGrid>

          <h:panelGroup id="instrumentDependent">
            <h:panelGrid
              rendered="#{not empty order.orderAttributes}"
              columns="2"
              columnClasses="rtdm, ltd">
              <c:if
                test="#{order.serviceType.isOrderAttribute('libraryProtocol') and (not empty order.instrument or not empty order.sequencingApplication) and not order.hasServiceTypeReadyMadeLibrariesSequencingAndSequencingApplicationCustomOther()}">
                <h:outputText
                  value="#{messages.libraryProtocol}"
                  title="#{order.getOrderAttributeHint('libraryProtocol')}" />
                <ui:decorate template="/fragments/required.xhtml">
                  <h:selectOneMenu
                    id="libraryProtocol"
                    value="#{order.libraryProtocol}"
                    title="#{order.getOrderAttributeHint('libraryProtocol')}"
                    valueChangeListener="#{order.libraryProtocolChanged}"
                    styleClass="editWidthExtraLarge"
                    converter="omnifaces.SelectItemsConverter">
                    <f:selectItem
                      itemLabel="#{messages.selectAnItem}"
                      itemDisabled="true" />
                    <f:selectItems
                      value="#{samplePreparationProtocolList.getEnabledLibraryProtocolsIncludingByInstrumentOrSequencingApplication(order.instrument, order.sequencingApplication, order.libraryProtocol)}"
                      var="item"
                      itemLabel="#{item.name}">
                    </f:selectItems>
                    <p:ajax
                      event="change"
                      global="false"
                      update="edit:libraryProtocolOptionValues" />
                  </h:selectOneMenu>
                </ui:decorate>
              </c:if>
            </h:panelGrid>

            <h:panelGroup id="libraryProtocolOptionValues">
              <c:set var="libraryProtocolOptions" value="#{order.libraryProtocolOptions}" />
              <h:panelGrid rendered="#{not empty libraryProtocolOptions}" columns="2" columnClasses="rtdm background-grey, ltd background-grey">
                <c:forEach items="#{libraryProtocolOptions}" var="item">
                  <c:if test="#{not empty item.enabledOptionValues}">
                    <h:outputText value="#{item.name}" />
                    <ui:decorate template="/fragments/#{item.required ? 'required' : 'edit'}.xhtml">
                      <p:selectOneRadio rendered="#{not item.multiple and item.enabledOptionValues.size() le 10}"
                                        value="#{item.optionValueHolder}"
                                        valueChangeListener="#{order.libraryProtocolOptionValueChanged}"
                                        required="#{item.required}"
                                        converter="omnifaces.SelectItemsConverter">
                        <f:selectItems value="#{item.enabledOptionValues}" var="optionValueItem" itemLabel="#{optionValueItem.name}" itemDescription="#{optionValueItem.description}" />
                        <c:if test="#{not item.required}">
                          <f:selectItem itemLabel="#{messages.none}" noSelectionOption="true" />
                        </c:if>
                        <p:ajax event="change" global="false" />
                      </p:selectOneRadio>
                      <p:selectOneMenu rendered="#{not item.multiple and item.enabledOptionValues.size() gt 10}"
                                       value="#{item.optionValueHolder}"
                                       valueChangeListener="#{order.libraryProtocolOptionValueChanged}"
                                       required="#{item.required}"
                                       converter="omnifaces.SelectItemsConverter">
                        <f:selectItem itemLabel="" itemDisabled="#{item.required}" />
                        <f:selectItems value="#{item.enabledOptionValues}" var="optionValueItem" itemLabel="#{optionValueItem.name}" itemDescription="#{optionValueItem.description}" />
                        <p:ajax event="change" global="false" />
                      </p:selectOneMenu>
                      <p:selectManyCheckbox rendered="#{item.multiple}" value="#{item.optionValueHolders}" collectionType="java.util.HashSet"
                                            valueChangeListener="#{order.libraryProtocolOptionValuesChanged}" required="#{item.required}" converter="omnifaces.SelectItemsConverter">
                        <f:selectItems value="#{item.enabledOptionValues}" var="optionValueItem" itemLabel="#{optionValueItem.name}" itemDescription="#{optionValueItem.description}" />
                        <p:ajax event="change" global="false" />
                      </p:selectManyCheckbox>
                      <!--
                      <p:selectManyMenu rendered="#{item.multiple and item.enabledOptionValues.size() gt 5}" value="#{item.optionValueHolders}" collectionType="java.util.HashSet"
                                       valueChangeListener="#{order.libraryProtocolOptionValuesChanged}" required="#{item.required}" converter="omnifaces.SelectItemsConverter">
                        <f:selectItem itemLabel="" itemDisabled="#{item.required}" />
                        <f:selectItems value="#{item.enabledOptionValues}" var="optionValueItem" itemLabel="#{optionValueItem.name}" />
                        <p:ajax event="change" global="false" />
                      </p:selectManyMenu>
                      -->
                    </ui:decorate>
                  </c:if>
                </c:forEach>
              </h:panelGrid>
            </h:panelGroup>
          </h:panelGroup>

          <h:panelGrid
            id="instrumentIndependent"
            rendered="#{not empty order.orderAttributes}"
            columns="2"
            columnClasses="rtdm, ltd">
            <c:if test="#{order.serviceType.isOrderAttribute('numberOfRunsSequencing')}">
              <h:outputText
                value="#{messages.numberOfRunsSequencing}"
                title="#{order.getOrderAttributeHint('numberOfRunsSequencing')}" />
              <ui:decorate template="/fragments/required.xhtml">
                <p:inputNumber
                  id="numberOfRunsSequencing"
                  value="#{order.numberOfRunsSequencing}"
                  title="#{order.getOrderAttributeHint('numberOfRunsSequencing')}"
                  thousandSeparator=""
                  decimalPlaces="0"
                  styleClass="editWidthExtraLarge" />
              </ui:decorate>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('numberOfRunsTapeStation')}">
              <h:outputText
                value="#{messages.numberOfRunsTapeStation}"
                title="#{order.getOrderAttributeHint('numberOfRunsTapeStation')}" />
              <ui:decorate template="/fragments/edit.xhtml">
                <p:inputNumber
                  id="numberOfRunsTapeStation"
                  value="#{order.numberOfRunsTapeStation}"
                  title="#{order.getOrderAttributeHint('numberOfRunsTapeStation')}"
                  thousandSeparator=""
                  decimalPlaces="0"
                  styleClass="editWidthExtraLarge" />
              </ui:decorate>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('userBenchUsage')}">
              <h:outputText
                value="#{messages.userBenchUsage}"
                title="#{order.getOrderAttributeHint('userBenchUsage')}" />
              <ui:decorate template="/fragments/edit.xhtml">
                <p:inputNumber
                  id="userBenchUsage"
                  value="#{order.userBenchUsage}"
                  title="#{order.getOrderAttributeHint('userBenchUsage')}"
                  thousandSeparator=""
                  styleClass="editWidthExtraLarge" />
              </ui:decorate>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('kitsUsed')}">
              <h:outputText
                value="#{messages.kitsUsed}"
                title="#{order.getOrderAttributeHint('kitsUsed')}" />
              <ui:decorate template="/fragments/edit.xhtml">
                <h:inputText
                  id="kitsUsed"
                  value="#{order.kitsUsed}"
                  title="#{order.getOrderAttributeHint('kitsUsed')}"
                  styleClass="editWidthExtraLarge"
                  pt:placeholder="#{order.getOrderAttributeHint('kitsUsed')}" />
              </ui:decorate>
            </c:if>

            <c:if
              test="#{order.serviceType.isOrderAttributeAndEnabled('nuclei') and not (order.serviceType.isOrderAttributeAndEnabled('numberOfCellsNuclei') or not empty order.numberOfCellsNucleiOld)}">
              <h:outputText
                value="#{messages.cellsNuclei}"
                title="#{order.getOrderAttributeHint('nuclei')}" />
              <ui:decorate template="/fragments/required.xhtml">
                <h:selectOneRadio
                  id="nuclei"
                  value="#{order.nuclei}"
                  title="#{order.getOrderAttributeHint('nuclei')}">
                  <f:selectItem
                    itemValue="false"
                    itemLabel="#{messages.cells}" />
                  <f:selectItem
                    itemValue="true"
                    itemLabel="#{messages.nuclei}" />
                </h:selectOneRadio>
              </ui:decorate>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttributeAndEnabled('numberOfCellsNuclei') or not empty order.numberOfCellsNucleiOld}">
              <h:outputText
                value="#{messages.numberOfCellsNuclei}"
                title="#{order.getOrderAttributeHint('numberOfCellsNuclei')}" />
              <ui:decorate template="/fragments/required.xhtml">
                <p:inputNumber
                  id="numberOfCellsNuclei"
                  value="#{order.numberOfCellsNuclei}"
                  title="#{order.getOrderAttributeHint('numberOfCellsNuclei')}"
                  thousandSeparator=""
                  styleClass="editWidthExtraLarge" />
              </ui:decorate>
            </c:if>

            <c:if test="#{order.serviceType.isOrderAttribute('insertSize')}">
              <h:outputText
                value="#{messages.insertSize}"
                title="#{order.getOrderAttributeHint('insertSize')}" />
              <ui:decorate template="/fragments/edit.xhtml">
                <p:inputNumber
                  id="insertSize"
                  value="#{order.insertSize}"
                  title="#{order.getOrderAttributeHint('insertSize')}"
                  thousandSeparator=""
                  decimalPlaces="0"
                  styleClass="editWidthExtraLarge" />
              </ui:decorate>
            </c:if>
          </h:panelGrid>

          <h:panelGrid
            id="instrumentSpecific"
            rendered="#{not empty order.orderAttributes}"
            columns="2"
            columnClasses="rtdm, ltd">
            <c:if test="#{order.serviceType.isOrderAttribute('consumable')}">
              <h:outputText
                value="#{messages.consumable}"
                title="#{order.getOrderAttributeHint('consumable')}" />
              <ui:decorate template="/fragments/required.xhtml">
                <h:selectOneMenu
                  id="consumable"
                  value="#{order.consumable}"
                  title="#{order.getOrderAttributeHint('consumable')}"
                  styleClass="editWidthExtraLarge"
                  converter="omnifaces.SelectItemsConverter">
                  <f:selectItem itemLabel="#{messages.bringOwnConsumables}" />
                  <f:selectItems
                    value="#{consumableList.getResultListEnabledIncludingByInstrumentId(order.instrument.id, order.consumable.id)}"
                    var="item"
                    itemLabel="#{item.displayName}" />
                </h:selectOneMenu>
              </ui:decorate>
            </c:if>
