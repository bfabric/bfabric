<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('feedbacks') and order.feedbacksRendered}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="feedback" />
      <ui:param
        name="tableContext"
        value="#{order.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{order.feedbacks}" />
      <ui:param
        name="hideColumns"
        value="container" />
    </ui:include>
  </c:if>
</ui:composition>
