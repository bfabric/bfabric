<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('importresources') and identityManager.hasCurrentUserRole('containerReader')}">
    <c:if test="#{order.project != null and importResourceList.getLazyModelByContainers(order.associatedContainers).size() > 0}">
      <ui:include src="/fragments/switch.xhtml">
        <ui:param name="widgetVarName" value="'orderimportresource'" />
        <ui:param name="type" value="importresource" />
        <ui:param name="count" value="#{importResourceList.getLazyModelByContainers(order.associatedContainers).size()}" />
        <ui:param name="update" value="#{order.tableContext}importresourcetableform" />
      </ui:include>
    </c:if>
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param name="tableType" value="importresource" />
      <ui:param name="tableContext" value="#{order.tableContext}" />
      <ui:param name="tableContent" value="#{importResourceList.getLazyModelByContainerId(order.id, order.associatedContainers, orderManager.containerAll)}" />
      <ui:param name="hideColumns" value="#{not entityManager.containerAll ? 'container' : ''}" />
    </ui:include>
  </c:if>
</ui:composition>
