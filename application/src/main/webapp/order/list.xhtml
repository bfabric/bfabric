<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('containerReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.orders}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/lazylist-with-create.xhtml">
      <ui:param
        name="tableType"
        value="order" />
      <ui:param
        name="showColumns"
        value="coachBackup, bioinformatician, euGrant, costCentre, pspElement, express, internal" />
      <ui:param
        name="hideColumns"
        value="dependentServiceType" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </ui:define>
</ui:composition>
