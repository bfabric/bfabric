<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">
  <p:dialog rendered="#{order.setMailTrackingNumberRendered}"
            id="mailTrackingNumberPanel" widgetVar="mailTrackingNumberDialog"
            dynamic="true" resizable="false" modal="true" onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{empty order.mailTrackingNumber ? messages.set : messages.reset} #{messages.mailTrackingNumber}" />
    </f:facet>
    <h:form id="mailTrackingNumberForm">
      <h:panelGrid columns="2" columnClasses="rtdm, ltd">
        <h:outputText value="#{messages.order}" />
        <ui:decorate template="/fragments/display.xhtml">
          <h:outputText value="#{order.displayName}" />
        </ui:decorate>

        <h:outputText value="#{messages.mailTrackingNumber}" title="#{order.getOrderAttributeHint('mailTrackingNumber')}" />
        <ui:decorate template="/fragments/edit.xhtml">
          <p:inputText id="mailTrackingNumber" value="#{order.mailTrackingNumber}"
                       title="#{order.getOrderAttributeHint('mailTrackingNumber')}" styleClass="editWidthExtraLarge" />
        </ui:decorate>
      </h:panelGrid>
      <h:panelGrid columns="2" styleClass="action">
        <p:commandButton action="#{orderManager.save}" value="#{messages.save}" global="false"
                         update="mailTrackingNumberForm" oncomplete="hideDialogOnSuccess(args, 'mailTrackingNumberDialog')" />
        <p:commandButton value="#{messages.cancel}" immediate="true" global="false" oncomplete="PF('mailTrackingNumberDialog').hide()">
        </p:commandButton>
      </h:panelGrid>
    </h:form>
  </p:dialog>
</ui:composition>
