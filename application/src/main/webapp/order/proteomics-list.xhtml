<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('containerReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.proteomicsOrders}" />
  </ui:define>

  <ui:define name="body">
    <h:form id="#{constants.EDIT}">
      <h:panelGrid columns="6">
        <p:selectOneButton value="#{proteomicsViewManager.selectedServiceType}" valueChangeListener="#{dataTableHelper.clear('edit:proteomicsordertable')}" converter="omnifaces.SelectItemsConverter">
          <f:selectItems value="#{proteomicsViewManager.serviceTypes}" var="item" itemLabel="#{item.name}" />
          <p:ajax event="change" global="true" process="@this" update="@form" oncomplete="fixOversize(); PF('proteomicsorder').filter();" />
        </p:selectOneButton>
      </h:panelGrid>

      <p:spacer height="16" />

      <ui:include src="/fragments/datatable.xhtml">
        <ui:param name="tableType" value="order" />
        <ui:param name="tableContext" value="proteomics" />
        <ui:param name="tableContent" value="#{proteomicsViewManager.getOrdersLazyModelByServiceType(proteomicsViewManager.selectedServiceType)}" />
        <ui:param name="include" value="/order/proteomics-columns.xhtml" />
        <ui:param name="lazy" value="true" />
        <ui:param name="showEmpty" value="true" />
      </ui:include>

      <p:spacer height="16" />

      <h:panelGrid columns="2">
        <ui:include src="/fragments/datatable.xhtml">
          <ui:param name="include" value="/statistics/orderCountPerStatus-columns.xhtml" />
          <ui:param name="tableContext" value="orderCountPerStatus" />
          <ui:param name="tableContent" value="#{proteomicsViewManager.orderCountPerStatus}" />
          <ui:param name="paginator" value="false" />
        </ui:include>
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
