<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:dialog
    id="servicesPanel"
    widgetVar="servicesDialog"
    dynamic="true"
    resizable="false"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{messages.servicesOfServiceType} #{orderManager.serviceTypeShowServices.name}" />
    </f:facet>
    <p:dataTable
      rendered="#{not empty orderManager.serviceTypeShowServices.servicesEnabled}"
      id="servicesEnabled"
      value="#{orderManager.serviceTypeShowServices.servicesEnabled}"
      var="serviceItem"
      styleClass="hide-table-header">
      <p:column
        exportable="false"
        sortable="false"
        filterable="false"
        headerText="#{messages.services}">
        <h:outputText value="#{serviceItem.name}" />
      </p:column>
    </p:dataTable>
  </p:dialog>
</ui:composition>
