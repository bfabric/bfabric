<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('institutes')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="institute" />
      <ui:param
        name="tableContext"
        value="#{organization.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{instituteList.getInstitutesByOrganizationId(organization.id)}" />
      <ui:param
        name="hideColumns"
        value="organization" />
    </ui:include>
  </c:if>
</ui:composition>
