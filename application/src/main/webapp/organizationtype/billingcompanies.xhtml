<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('billingcompanies')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="company" />
      <ui:param
        name="tableContext"
        value="#{organizationType.tableContext}_billing" />

        name="tableContent"
        value="#{organizationType.billingCompanies}" />

        name="hideColumns"
        value="organizationType" />

</ui:composition>
