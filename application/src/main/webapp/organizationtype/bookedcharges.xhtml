<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('bookedcharges') and identityManager.hasCurrentUserRole('containerReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="include"
        value="/fragments/grouped-charge-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="#{organizationType.tableContext}_charge" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.getBookedChargeOrganizationType(organizationType.id)}" />
      <ui:param
        name="rowsPerPageDropdown"
        value="all" />
    </ui:include>
  </c:if>
</ui:composition>
