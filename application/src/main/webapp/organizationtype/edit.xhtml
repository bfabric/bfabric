<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{organizationTypeManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{organizationType.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.academic}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneRadio
              id="academicRadio"
              value="#{organizationType.academic}"
              title="#{messages.academicHint}">
              <f:selectItem
                itemValue="true"
                itemLabel="#{messages.yes}" />
              <f:selectItem
                itemValue="false"
                itemLabel="#{messages.no}" />
            </h:selectOneRadio>
          </ui:decorate>

          <h:outputText value="#{messages.domestic}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneRadio
              id="domesticRadio"
              value="#{organizationType.domestic}"
              title="#{messages.domesticHint}">
              <f:selectItem
                itemValue="true"
                itemLabel="#{messages.yes}" />
              <f:selectItem
                itemValue="false"
                itemLabel="#{messages.no}" />
            </h:selectOneRadio>
          </ui:decorate>

          <h:outputText value="#{messages.extensible}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneRadio
              id="extensibleRadio"
              value="#{organizationType.extensible}"
              title="#{messages.extensibleOrganizationTypeHint}">
              <f:selectItem
                itemValue="true"
                itemLabel="#{messages.yes}" />
              <f:selectItem
                itemValue="false"
                itemLabel="#{messages.no}" />
            </h:selectOneRadio>
          </ui:decorate>

          <h:outputText value="#{messages.color}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:colorPicker
              id="color"
              value="#{organizationType.color}"
              mode="popup" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
