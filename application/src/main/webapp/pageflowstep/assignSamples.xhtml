<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <h:panelGrid
    id="available-importresources"
    columns="1"
    styleClass="topline">
    <h:outputText
      value="#{messages.selectedResources} (#{resourceHelper.selectedImportResources.size()})"
      styleClass="bold" />
    <ui:include src="/fragments/datatable.xhtml">
      <ui:param
        name="include"
        value="/pageflowstep/assignSamples-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="workunit" />
      <ui:param
        name="tableContent"
        value="#{resourceHelper.selectedImportResources}" />
      <ui:param
        name="paginator"
        value="false" />
      <ui:param
        name="editable"
        value="true" />
    </ui:include>

    <h:panelGrid
      id="available-importresources-buttons"
      columns="3"
      styleClass="action">
      <p:commandButton
        action="#{workunitManager.next}"
        value="#{messages.next}"
        immediate="true"
        rendered="#{not empty resourceHelper.selectedImportResources}"
        oncomplete="fixOversize();"
        update="pageTitle, @form" />
      <p:commandButton
        action="#{workunitManager.back}"
        value="#{messages.back}"
        immediate="true"
        oncomplete="fixOversize();"
        update="pageTitle, @form" />
      <p:commandButton
        action="#{workunitManager.cancel}"
        value="#{messages.cancel}"
        immediate="true" />
    </h:panelGrid>
  </h:panelGrid>
</ui:composition>
