<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column
    id="#{constants.SELECT_CHECK_BOX_COLUMN}"
    exportable="false"
    styleClass="#{entity.imported ? 'already' : ''}">
    <f:facet name="header">
      <h:panelGrid
        columns="1"
        styleClass="nospace noborder">
        <h:outputText value="#{messages.select}" />
        <h:panelGrid
          columns="2"
          styleClass="select-icon">
          <p:commandLink
            actionListener="#{resourceHelper.checkAll(true)}"
            immediate="true"
            global="false"
            update="#{tableContext}#{tableType}#{constants.TABLE}"
            oncomplete="fixOversize();">
            <f:attribute
              name="#{constants.TABLE_CLIENT_ID}"
              value="#{tableReference.clientId}" />
            <i class="far fa-check-square" />
          </p:commandLink>
          <p:commandLink
            actionListener="#{resourceHelper.checkAll(false)}"
            immediate="true"
            global="false"
            update="#{tableContext}#{tableType}#{constants.TABLE}"
            oncomplete="fixOversize();">
            <f:attribute
              name="#{constants.TABLE_CLIENT_ID}"
              value="#{tableReference.clientId}" />
            <i class="far fa-square" />
          </p:commandLink>
        </h:panelGrid>
      </h:panelGrid>
    </f:facet>
    <h:selectBooleanCheckbox
      id="#{constants.SELECT_CHECK_BOX}"
      value="#{not tableReference.lazy ? entity.checked : resourceHelper.markedSelectImportResourcesMap[entity]}"
      title="#{entity.imported ? messages.importResourceImportedHint : ''}"
      disabled="#{(selected == null or not selected) ? resourceHelper.selectedImportResources.contains(entity) : false}">
      <c:if test="#{not tableReference.lazy}">
        <p:ajax
          listener="#{resourceHelper.markImportResource(entity)}"
          global="false" />
      </c:if>
      <c:if test="#{tableReference.lazy}">
        <p:ajax
          listener="#{resourceHelper.markImportResource(entity, resourceHelper.markedSelectImportResourcesMap[entity])}"
          global="false" />
      </c:if>
    </h:selectBooleanCheckbox>
  </p:column>
  <p:column
    rendered="#{workunit.linkImport}"
    field="relativePath"
    headerText="#{messages.relativePath}"
    exportValue="#{entity.relativePath}">
    <p:link
      outcome="/importresource/show.xhtml"
      value="#{stringHelper.truncate(entity.relativePath)}"
      title="#{entity.uri}"
      target="_blank"
      rel="noopener">
      <f:param
        name="id"
        value="#{entity.id}" />
    </p:link>
  </p:column>
  <p:column
    rendered="#{not workunit.linkImport}"
    field="uri"
    headerText="#{messages.url}"
    exportValue="#{entity.uri}">
    <p:link
      outcome="/importresource/show.xhtml"
      value="#{stringHelper.truncate(entity.uri, 45, 45)}"
      title="#{entity.uri}"
      target="_blank"
      rel="noopener">
      <f:param
        name="id"
        value="#{entity.id}" />
    </p:link>
  </p:column>
  <ui:include src="/container/entity-container-column.xhtml">
    <c:if test="#{not empty filterValue}">
      <ui:param
        name="filterValue"
        value="#{contextManager.containerFilterValue}" />
    </c:if>
  </ui:include>
  <p:column
    sortBy="#{entity.size}"
    headerText="#{messages.size}"
    styleClass="textright">
    <h:outputText value="#{entity.printSize}" />
  </p:column>
  <p:column
    sortBy="#{entity.fileDate}"
    headerText="#{messages.fileDate}">
    <h:outputText value="#{entity.fileDate}" />
  </p:column>
</ui:composition>
