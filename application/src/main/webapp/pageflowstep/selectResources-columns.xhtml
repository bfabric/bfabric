<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <ui:include src="/fragments/column/relativepath.xhtml" />

  <p:column
    sortBy="#{entity.container.id}"
    headerText="#{messages.container}">
    <h:outputText value="#{entity.container.id}" />
  </p:column>

  <p:column
    sortBy="#{entity.workunit.name}"
    headerText="#{messages.workunitName}"
    exportValue="#{entity.workunit.name}">
    <h:outputText
      value="#{stringHelper.truncate(entity.workunit.name)}"
      title="#{entity.workunit.name}" />
  </p:column>

  <p:column
    sortBy="#{entity.id}"
    headerText="#{messages.id}">
    <h:outputText value="#{entity.id}" />
  </p:column>

  <ui:include src="/fragments/column/junk.xhtml" />
</ui:composition>
