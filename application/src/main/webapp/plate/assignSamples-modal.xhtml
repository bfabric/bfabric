<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:dialog
    id="assignSamplesModalPanel"
    widgetVar="assignSamplesModalDialog"
    closable="true"
    resizable="false"
    dynamic="true"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="Plate Capacity Exceeded!" />
    </f:facet>
    <h:outputText value="Not all samples were added to the plate as the maximum plate capacity was reached." />
  </p:dialog>
</ui:composition>
