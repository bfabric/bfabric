<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column exportable="false">
    <f:facet name="header">
      <h:panelGrid
        columns="1"
        styleClass="nospace noborder">
        <p:commandButton
          id="#{constants.ADD}#{constants.ALL}#{constants.BUTTON}"
          value="#{messages.selectAll}"
          title="#{messages.assignSamplesToPlateAllHint}"
          actionListener="#{plateManager.selectAllSamples}"
          disabled="#{(plate.plateLayout.capacity - plateManager.emptyPositionIndices.size()) eq plate.plateLayout.capacity}"
          disableOnAjax="false"
          process="@this, assignSamples:plateGrid"
          update="@this, assignSamples:plateGrid"
          oncomplete="fixOversize();">
          <f:attribute
            name="#{constants.TABLE_CLIENT_ID}"
            value="#{tableReference.clientId}" />
        </p:commandButton>
      </h:panelGrid>
    </f:facet>
    <p:commandButton
      id="#{constants.ADD}#{constants.BUTTON}"
      value="#{messages.add}"
      disabled="#{plateManager.selectedSamplesIds.contains(entity.id)}"
      disableOnAjax="false"
      actionListener="#{plateManager.selectSample(entity)}"
      process="@this"
      update="@this, assignSamples:plateGrid, @([id$=#{constants.ADD}#{constants.ALL}#{constants.BUTTON}])"
      oncomplete="fixOversize();"
      styleClass="inline" />
  </p:column>
  <ui:include src="/sample/columns.xhtml" />
</ui:composition>
