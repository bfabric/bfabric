<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui">
  <p:column>
    <h:outputText value="#{item.id}" />
  </p:column>
  <p:column>
    <h:outputText value="#{item.name}" />
  </p:column>
  <p:column>
    <h:outputText value="#{item.plateType.name}" />
  </p:column>
  <p:column>
    <h:outputText value="#{item.status.label}" styleClass="#{item.status.label}" />
  </p:column>
</ui:composition>
