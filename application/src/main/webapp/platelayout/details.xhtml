<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />

      <h:outputText value="#{messages.capacity}" />
      <h:outputText value="#{instance.capacity}" />

      <h:outputText value="#{messages.columns}" />
      <h:outputText value="#{instance.columns}" />

      <h:outputText value="#{messages.rows}" />
      <h:outputText value="#{instance.rows}" />

      <ui:include src="/fragments/details/description.xhtml" />
      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="5"
      styleClass="action">
      <ui:include src="/fragments/button/edit-clone-links-delete-list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
