<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('orders') and project.renderedOrders}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="order" />
      <ui:param
        name="tableContext"
        value="#{project.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{project.orders}" />
      <ui:param
        name="hideColumns"
        value="project, oldProjectOrderId, oldServiceOrderId" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
    <h:panelGrid
      columns="1"
      styleClass="action">
      <p:button
        outcome="/order/edit.xhtml"
        value="#{messages.create}"
        rendered="#{project.orderCreatable}">
        <f:param
          name="projectId"
          value="#{project.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
