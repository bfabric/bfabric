<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('resources') and project.accepted and not projectManager.fullView}">
    <c:if test="#{project.orders.size() > 0 and resourceList.getLazyModelByContainers(project.associatedContainers).size() > 0}">
      <ui:include src="/fragments/switch.xhtml">
        <ui:param
          name="widgetVarName"
          value="'projectresource'" />
        <ui:param
          name="type"
          value="resource" />
        <ui:param
          name="count"
          value="#{resourceList.getLazyModelByContainers(project.associatedContainers).size()}" />
        <ui:param
          name="update"
          value="#{project.tableContext}resourcetableform" />
      </ui:include>
    </c:if>
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="resource" />
      <ui:param
        name="tableContext"
        value="#{project.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{resourceList.getLazyModelByContainerId(project.id, project.associatedContainers, projectManager.containerAll)}" />
      <ui:param
        name="hideColumns"
        value="#{not entityManager.containerAll ? 'container' : ''}" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
