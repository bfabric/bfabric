<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('reviews') and project.renderedReviews}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="review" />
      <ui:param
        name="tableContext"
        value="#{project.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{project.reviews}" />
    </ui:include>
    <h:panelGrid
      columns="1"
      styleClass="action">
      <p:button
        outcome="/review/edit.xhtml"
        value="#{messages.createReview}"
        rendered="#{project.reviewable}">
        <f:param
          name="projectId"
          value="#{project.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
