<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{configuration.workflowEnabled and sidebarHelper.isTab('workflows') and project.hasCurrentUserRole('containerReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workflow" />
      <ui:param
        name="tableContext"
        value="#{project.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{project.workflows}" />
    </ui:include>
    <h:panelGrid
      columns="4"
      styleClass="action">
      <p:button
        outcome="/workflow/edit.xhtml"
        value="#{messages.createWorkflow}"
        rendered="#{project.renderedAddWorkflowButton}">
        <f:param
          name="containerId"
          value="#{project.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
