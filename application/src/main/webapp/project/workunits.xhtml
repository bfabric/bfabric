<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('workunits') and project.accepted}">
    <c:if test="#{project.orders.size() > 0 and workunitList.getLazyModelByContainers(project.associatedContainers).size() > 0}">
      <ui:include src="/fragments/switch.xhtml">
        <ui:param
          name="widgetVarName"
          value="'projectworkunit'" />
        <ui:param
          name="type"
          value="workunit" />
        <ui:param
          name="count"
          value="#{workunitList.getLazyModelByContainers(project.associatedContainers).size()}" />
        <ui:param
          name="update"
          value="#{project.tableContext}workunittableform" />
      </ui:include>
    </c:if>
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workunit" />
      <ui:param
        name="tableContext"
        value="#{project.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{workunitList.getLazyModelByContainerId(project.id, project.associatedContainers, projectManager.containerAll)}" />
      <ui:param
        name="hideColumns"
        value="#{not entityManager.containerAll ? 'container' : ''}" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
    <h:panelGrid
      columns="4"
      styleClass="action">
      <h:form>
        <p:commandButton
          rendered="#{project.hasDeletableFailedWorkunits()}"
          action="#{projectManager.removeFailedWorkunits}"
          value="#{messages.removeFailedWorkunits}"
          title="#{messages.removeFailedWorkunitsHint}"
          global="true" />
      </h:form>
    </h:panelGrid>
  </c:if>
</ui:composition>
