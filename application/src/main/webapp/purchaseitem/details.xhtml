<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id.xhtml" />
      <ui:include src="/fragments/details/purchase.xhtml" />
      <ui:include src="/fragments/details/consumable.xhtml" />
      <ui:include src="/fragments/details/quantity.xhtml" />

      <c:if test="#{not empty instance.basicPrice}">
        <h:outputText value="#{messages.basicNetPrice}" />
        <h:outputText value="#{instance.basicPrice}" />
      </c:if>

      <c:if test="#{not empty instance.totalPrice}">
        <h:outputText value="#{messages.totalNetPrice}" />
        <h:outputText value="#{instance.totalPrice}" />
      </c:if>

      <c:if test="#{not empty instance.totalPriceDefaultCurrency}">
        <h:outputText value="#{messages.totalNetPriceDefaultCurrency}" />
        <h:outputText value="#{instance.totalPriceDefaultCurrency}" />
      </c:if>
    </h:panelGrid>

    <h:panelGrid
      columns="2"
      styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <ui:include src="/fragments/button/delete.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
