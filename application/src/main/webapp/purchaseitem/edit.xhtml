<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{purchaseItemManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.purchase}" />
          <ui:decorate template="/fragments/display.xhtml">
            <ui:include src="/fragments/entity-link-displayname.xhtml">
              <ui:param
                name="instance"
                value="#{purchaseItem.purchase}" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.consumable}" />
          <ui:include src="/fragments/autocomplete-required.xhtml">
            <ui:param
              name="listContext"
              value="consumable" />
            <ui:param
              name="value"
              value="#{purchaseItem.consumable}" />
            <o:methodParam
              name="completeMethod"
              value="#{purchaseItemManager.getConsumablesFiltered}" />
            <ui:param
              name="itemLabel"
              value="#{item.displayName}" />
            <ui:param
              name="styleClass"
              value="editWidthExtraLarge" />
          </ui:include>

          <h:outputText value="#{messages.quantity}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:inputNumber
              id="quantity"
              thousandSeparator=""
              value="#{purchaseItem.quantity}"
              valueChangeListener="#{purchaseItem.quantityChanged}"
              styleClass="editWidthExtraLarge">
              <p:ajax
                event="change"
                update="edit:totalPrice" />
            </p:inputNumber>
          </ui:decorate>

          <h:outputText value="#{messages.basicNetPrice}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:inputNumber
              id="basicPrice"
              thousandSeparator=""
              value="#{purchaseItem.basicPrice}"
              valueChangeListener="#{purchaseItem.basicPriceChanged}"
              styleClass="editWidthExtraLarge">
              <p:ajax
                event="change"
                update="edit:totalPrice" />
            </p:inputNumber>
          </ui:decorate>

          <h:outputText value="#{messages.totalNetPrice}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:inputNumber
              id="totalPrice"
              thousandSeparator=""
              value="#{purchaseItem.totalPrice}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.totalNetPrice} #{configuration.getDefaultCurrencyCode()}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:inputNumber
              id="totalPriceDefaultCurrency"
              thousandSeparator=""
              value="#{purchaseItem.totalPriceDefaultCurrency}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.recalculatePrice}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="recalculatePriceCheckbox"
              title="#{messages.recalculatePriceHint}"
              value="#{purchaseItemManager.purchaseItem.purchase.recalculatePriceChecked}">
              <p:ajax
                event="change"
                listener="#{purchaseItemManager.purchaseItem.purchase.recalculatePriceCheckedChanged}"
                immediate="true" />
            </h:selectBooleanCheckbox>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
