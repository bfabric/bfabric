<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:fo="http://www.w3.org/1999/XSL/Format">
  <!-- Header logo -->
  <fo:block margin-left="2mm">
    <c:if test="#{configuration.deployerFGCZ}">
      <fo:external-graphic
        src="images/uzh_eth_logo_d_pos_standard.png"
        height="17mm"
        content-height="17mm" />
    </c:if>
    <c:if test="#{configuration.isDeployer('UZH')}">
      <fo:external-graphic
        src="images/uzh_logo_d_pos_standard.tif"
        height="27mm"
        content-height="27mm" />
    </c:if>
    <c:if test="#{configuration.isDeployer('ETH')}">
      <fo:external-graphic
        src="images/eth_logo_d_pos_standard.png"
        height="27mm"
        content-height="27mm" />
    </c:if>
  </fo:block>
</ui:composition>
