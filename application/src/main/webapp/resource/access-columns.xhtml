<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <ui:include src="/access/columns.xhtml">
    <ui:param
      name="hideColumns"
      value="storage, enabled, createdBy, createdOn" />
  </ui:include>
  <p:column
    sortBy="#{resourceEntity.relativePath}"
    filterBy="#{resourceEntity.relativePath}"
    headerText="#{messages.relativePath}"
    exportValue="#{resourceEntity.relativePath}">
    <h:outputText
      value="#{stringHelper.truncate(resourceEntity.relativePath)}"
      title="#{resourceEntity.uri}" />
  </p:column>
  <p:column
    sortBy="#{resourceEntity.getUriByAccessType(entity.accessType.name)}"
    filterBy="#{resourceEntity.getUriByAccessType(entity.accessType.name)}"
    headerText="#{messages.url}">
    <h:outputLink
      value="#{resourceEntity.getUriByAccessType(entity.accessType.name)}"
      target="_blank"
      rel="noopener">#{resourceEntity.getUriByAccessType(entity.accessType.name)}
    </h:outputLink>
  </p:column>
</ui:composition>
