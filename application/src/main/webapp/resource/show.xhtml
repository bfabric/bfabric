<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{resourceManager}" />

  <ui:decorate template="/fragments/sidebar/show.xhtml">
    <ui:define name="pageTitleExtension">
      <ui:include src="/fragments/status-label.xhtml" />
      <h:panelGroup rendered="#{instance.junk}">
        <i class="fas fa-exclamation-circle warning" title="#{messages.resourceMarkedAsJunkHint}" />
      </h:panelGroup>
    </ui:define>

    <ui:define name="pageTitleSuffix">
      <c:if test="#{instance.downloadManagerDownloadButtonRendered}">
        <p:link
          outcome="/fragments/download-jnlp.xhtml"
          title="#{messages.resourceDownloadHint}">
          <i class="fas fa-download download-icon icon-button-padding" />
          <f:param
            name="resourceId"
            value="#{instance.id}" />
        </p:link>
      </c:if>
      <c:if test="#{instance.downloadHttpButtonRendered and instance.downloadButtonRendered}">
        <p:commandLink
          title="#{messages.resourceDownloadHttpHint}"
          onclick="remoteGetJson([{name: 'entity', value: '#{instance}'}])">
          <i class="fas fa-file-download download-icon icon-button-padding" />
        </p:commandLink>
        <p:remoteCommand
          name="remoteGetJson"
          action="#{jsonService.getJson}"
          oncomplete="download_files(args.json)" />
      </c:if>
      <c:if test="#{instance.downloadHttpButtonRendered and not instance.downloadButtonRendered}">
        <h:outputLink
          value="#{instance.uriDownloadHttp}"
          title=" #{messages.resourceDownloadHttpHint}">
          <i class="fas fa-file-download download-icon icon-button-padding" />
          <p:ajax
            event="click"
            global="false"
            listener="#{instance.createDownloadHttpEntityLog()}" />
        </h:outputLink>
      </c:if>
      <c:if test="#{instance.downloadManagerDownloadButtonRendered or instance.downloadButtonRendered or instance.downloadHttpButtonRendered}">
        <a
          href="#{configuration.urlUserManual}?page=ResourceDownload"
          title="#{messages.downloadHelpLink}"
          target="_blank"
          rel="noopener"><i class="far fa-question-circle download-icon icon-button-padding" /></a>
      </c:if>
    </ui:define>
  </ui:decorate>
</ui:composition>
