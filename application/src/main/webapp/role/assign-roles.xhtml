<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('admin')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.assignRoles}" />
  </ui:define>

  <ui:define name="body">
    <h:form id="assignRolesForm">
      <h:panelGrid
        id="assign-roles"
        columns="2"
        columnClasses="rtdm, ltd">
        <h:outputText value="#{messages.roles}" />
        <ui:decorate template="/fragments/display.xhtml">
          <h:panelGroup id="assign-roles-roles-options">
            <ui:include src="/fragments/datatable.xhtml">
              <ui:param
                name="tableContext"
                value="availableRole" />
              <ui:param
                name="tableContent"
                value="#{roleList.lazyModel}" />
              <ui:param
                name="include"
                value="/role/assign-roles-role-columns.xhtml" />
              <ui:param
                name="showColumns"
                value="addCheckbox" />
              <ui:param
                name="styleClass"
                value="line-height-initial" />
            </ui:include>
          </h:panelGroup>
        </ui:decorate>
        <p:spacer height="10" />
        <p:spacer height="10" />
        <h:panelGroup id="assign-roles-roles-options-selected-text">
          <h:outputText
            rendered="#{not empty roleManager.selectedRoles}"
            value="#{messages.selectedRoles} (#{roleManager.selectedRoles.size()})"
            styleClass="bold" />
        </h:panelGroup>
        <h:panelGroup id="assign-roles-roles-options-selected">
          <ui:decorate template="/fragments/display.xhtml">
            <h:panelGroup rendered="#{not empty roleManager.selectedRoles}">
              <ui:include src="/fragments/datatable.xhtml">
                <ui:param
                  name="tableContext"
                  value="selectedRole" />
                <ui:param
                  name="tableContent"
                  value="#{roleManager.selectedRoles}" />
                <ui:param
                  name="include"
                  value="/role/assign-roles-role-columns.xhtml" />
                <ui:param
                  name="showColumns"
                  value="removeCheckbox" />
                <ui:param
                  name="styleClass"
                  value="line-height-initial" />
                <ui:param
                  name="customRowsPerPageTemplate"
                  value="#{configuration.defaultRowsPerPageTemplate}" />
              </ui:include>
            </h:panelGroup>
          </ui:decorate>
        </h:panelGroup>
        <p:spacer height="10" />
        <p:spacer height="10" />
        <h:outputText value="#{messages.users}" />
        <ui:decorate template="/fragments/display.xhtml">
          <h:panelGroup id="assign-roles-users-options">
            <ui:include src="/fragments/datatable.xhtml">
              <ui:param
                name="tableContext"
                value="availableUser" />
              <ui:param
                name="tableContent"
                value="#{userList.lazyModel}" />
              <ui:param
                name="include"
                value="/role/assign-roles-user-columns.xhtml" />
              <ui:param
                name="showColumns"
                value="addCheckbox" />
              <ui:param
                name="styleClass"
                value="line-height-initial" />
            </ui:include>
          </h:panelGroup>
        </ui:decorate>
        <p:spacer height="10" />
        <p:spacer height="10" />
        <h:panelGroup id="assign-roles-users-options-selected-text">
          <h:outputText
            rendered="#{not empty roleManager.selectedUsers}"
            value="#{messages.selectedUsers} (#{roleManager.selectedUsers.size()})"
            styleClass="bold" />
        </h:panelGroup>
        <h:panelGroup id="assign-roles-users-options-selected">
          <ui:decorate template="/fragments/display.xhtml">
            <h:panelGroup rendered="#{not empty roleManager.selectedUsers}">
              <ui:include src="/fragments/datatable.xhtml">
                <ui:param
                  name="tableContext"
                  value="selectedUser" />
                <ui:param
                  name="tableContent"
                  value="#{roleManager.selectedUsers}" />
                <ui:param
                  name="include"
                  value="/role/assign-roles-user-columns.xhtml" />
                <ui:param
                  name="showColumns"
                  value="removeCheckbox" />
                <ui:param
                  name="styleClass"
                  value="line-height-initial" />
                <ui:param
                  name="customRowsPerPageTemplate"
                  value="#{configuration.defaultRowsPerPageTemplate}" />
              </ui:include>
            </h:panelGroup>
          </ui:decorate>
        </h:panelGroup>
      </h:panelGrid>

      <h:panelGrid
        id="buttons"
        columns="3"
        styleClass="action">
        <p:commandButton
          rendered="#{roleManager.renderSaveAssignRoles}"
          action="#{roleManager.assignRoles}"
          value="#{messages.save}"
          update="@form" />
        <p:commandButton
          action="#{roleManager.cancelAssignRoles}"
          value="#{messages.cancel}"
          immediate="true" />
        <p:commandButton
          rendered="#{roleManager.renderClearAssignRoles}"
          action="#{roleManager.clearForm}"
          value="#{messages.clear}"
          immediate="true"
          update="@form">
        </p:commandButton>
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
