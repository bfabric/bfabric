<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />

      <c:if test="#{not empty role.parents}">
        <h:outputText value="#{messages.parentRoles}" />
        <h:panelGroup styleClass="inner-repeat">
          <ui:repeat
            value="#{role.parents}"
            var="item">
            <ui:include src="/fragments/entity-link-name.xhtml">
              <ui:param
                name="instance"
                value="#{item}" />
            </ui:include>
            <br />
          </ui:repeat>
        </h:panelGroup>
      </c:if>

      <c:if test="#{not empty role.groups}">
        <h:outputText value="#{messages.groups}" />
        <h:panelGroup styleClass="inner-repeat">
          <ui:repeat
            value="#{role.groups}"
            var="item">
            <ui:include src="/fragments/entity-link-name.xhtml">
              <ui:param
                name="instance"
                value="#{item}" />
            </ui:include>
            <br />
          </ui:repeat>
        </h:panelGroup>
      </c:if>

      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="3"
      styleClass="action"
      rendered="#{identityManager.hasCurrentUserRole('admin')}">
      <ui:include src="/fragments/button/edit-delete-list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
