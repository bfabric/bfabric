<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('parents')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="role" />
      <ui:param
        name="tableContext"
        value="#{role.tableContext}_parent" />
      <ui:param
        name="tableContent"
        value="#{role.parents}" />
      <ui:param
        name="hideColumns"
        value="descendants, parents" />
    </ui:include>
  </c:if>
</ui:composition>
