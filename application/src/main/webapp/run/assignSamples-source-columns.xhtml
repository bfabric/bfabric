<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <p:column
    id="#{constants.CHECK_BOX}#{constants.SOURCE}#{constants.SAMPLE}#{constants.COLUMN}"
    exportable="false">
    <f:facet name="header">
      <h:panelGrid
        columns="1"
        styleClass="nospace noborder">
        <h:outputText value="#{messages.select}" />
        <h:panelGrid
          columns="2"
          styleClass="select-icon">
          <p:commandLink
            actionListener="#{runManager.markSamplesForSelection(true, true)}"
            title="#{messages.markAllNotReadySampleForRunAssignmentsHint}"
            immediate="true"
            global="false"
            update="@this, #{constants.EDIT}:sourceTableGroup"
            process="@this, #{constants.EDIT}:sourceTableGroup"
            oncomplete="fixOversize();">
            <i class="far fa-check-square" />
          </p:commandLink>
          <p:commandLink
            actionListener="#{runManager.markSamplesForSelection(false, true)}"
            title="#{messages.markAllReadySamplesForRunAssignmentHint}"
            immediate="true"
            global="false"
            update="@this, #{constants.EDIT}:sourceTableGroup"
            process="@this, #{constants.EDIT}:sourceTableGroup"
            oncomplete="fixOversize();">
            <i class="far fa-square" />
          </p:commandLink>
        </h:panelGrid>
      </h:panelGrid>
    </f:facet>
    <h:selectBooleanCheckbox
      id="#{constants.CHECK_BOX}#{constants.SOURCE}#{constants.SAMPLE}#{constants.INPUT}"
      value="#{runManager.markedSourceSamplesMap[entity]}"
      disabled="#{not runManager.showSamplesLaneSeparated ? runManager.selectedSamples.contains(entity) : false}"
      style="width: 100%">
      <p:ajax
        event="change"
        global="false"
        ignoreAutoUpdate="true"
        partialSubmit="true"
        listener="#{runManager.markSample(entity, runManager.markedSourceSamplesMap[entity], true, null)}"
        update="@this, #{constants.EDIT}:#{constants.SOURCE}#{constants.SAMPLE}#{constants.BUTTONS}"
        process="@this, #{constants.EDIT}:#{constants.SOURCE}#{constants.SAMPLE}#{constants.BUTTONS}"
        oncomplete="fixOversize();" />
    </h:selectBooleanCheckbox>
  </p:column>

  <c:if test="#{not runManager.showSamplesLaneSeparated}">
    <c:forEach
      items="#{run.lanePositions}"
      var="lanePosition"
      varStatus="lanePositionStatus">
      <p:column
        id="#{constants.POSITION_COLUMN}#{lanePosition}"
        headerText="#{messages.lane} #{lanePosition}"
        exportable="false">
        <h:selectBooleanCheckbox
          id="#{constants.CHECK_BOX_POSITION_COLUMN}#{lanePosition}#{constants.INPUT}"
          value="#{run.samplesRunUnitLanesPositions.containsKey(entity) ? run.samplesRunUnitLanesPositions[entity][lanePosition] : false}"
          disabled="true"
          style="width: 100%" />
      </p:column>
    </c:forEach>

    <p:column
      id="#{constants.POSITION_COLUMN_ALL}"
      headerText="#{messages.laneAll}"
      exportable="false">
      <h:selectBooleanCheckbox
        id="#{constants.CHECK_BOX_POSITION_COLUMN_ALL}#{constants.INPUT}"
        value="#{run.samplesRunUnitLanesAll.containsKey(entity) ? run.samplesRunUnitLanesAll[entity] : false}"
        disabled="true"
        style="width: 100%" />
    </p:column>
  </c:if>

  <ui:include src="/sample/columns.xhtml">
    <ui:param
      name="hideColumns"
      value="#{not runManager.showAllColumns ? 'specific, customAttributes, qualityControlValues, createdBy, createdOn, modifiedBy, modifiedOn, ' : ''}listOrders, parentsSize, childrenSize, resourceCount, workflows, workflowSteps" />
  </ui:include>

  <c:if test="#{not runManager.showAllColumns}">
    <ui:include src="/fragments/column/customstatus.xhtml">
      <o:methodParam
        name="completeMethod"
        value="#{containerService.getCurrentCustomContainerStatesFiltered}" />
      <ui:param
        name="fieldPrefix"
        value="container." />
      <ui:param
        name="entity"
        value="#{entity.container}" />
    </ui:include>
  </c:if>
</ui:composition>
