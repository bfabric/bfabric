<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('containers')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="include"
        value="/run/container-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="#{run.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{run.containers}" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
