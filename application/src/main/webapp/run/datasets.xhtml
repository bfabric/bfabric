<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('datasets')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="dataset" />
      <ui:param
        name="tableContext"
        value="#{run.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{run.datasets}" />
      <ui:param
        name="hideColumns"
        value="run" />
    </ui:include>

    <h:form>
      <h:panelGrid
        columns="1"
        styleClass="action">
        <p:button
          outcome="assignDatasets.xhtml"
          value="#{empty run.datasets ? messages.assignDatasets : messages.reassignDatasets}">
          <f:param
            name="id"
            value="#{run.id}" />
        </p:button>
      </h:panelGrid>
    </h:form>
  </c:if>
</ui:composition>
