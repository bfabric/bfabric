<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{runSampleManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form
        id="#{constants.EDIT}"
        onsubmit="#{runSampleManager.resetRefererURL()}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <ui:include src="/fragments/details/id.xhtml" />
          <ui:include src="/fragments/details/run.xhtml" />
          <ui:include src="/fragments/details/sample.xhtml" />

          <h:outputText value="#{messages.readCountTotal}" />
          <p:inputNumber
            id="readCountTotal"
            value="#{runSample.readCountTotal}"
            decimalPlaces="32"
            thousandSeparator=","
            padControl="false" />
        </h:panelGrid>

        <ui:include src="/fragments/edit/customattributes.xhtml" />

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
