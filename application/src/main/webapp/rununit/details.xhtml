<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />
      <ui:include src="/fragments/details/rununittype.xhtml" />
      <ui:include src="/fragments/details/run.xhtml" />
      <h:outputText value="#{messages.numberOfLanes}" />
      <h:outputText value="#{runUnit.runUnitLanes.size()}" />
      <ui:include src="/fragments/details/physicalseparation.xhtml" />
      <ui:include src="/fragments/details/cellId.xhtml" />
      <ui:include src="/fragments/details/description-links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="4"
      styleClass="action">
      <c:if test="#{identityManager.hasCurrentUserRole('admin')}">
        <ui:include src="/fragments/button/edit-clone-delete-list.xhtml" />
      </c:if>
    </h:panelGrid>
  </c:if>
</ui:composition>
