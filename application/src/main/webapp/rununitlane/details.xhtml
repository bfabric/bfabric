<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id.xhtml" />
      <ui:include src="/fragments/details/rununit.xhtml" />
      <ui:include src="/fragments/details/run.xhtml">
        <ui:param name="instance" value="#{runUnitLane.runUnit}" />
      </ui:include>
      <ui:include src="/fragments/details/position.xhtml" />
      <h:outputText value="#{messages.sample} #{messages.count}" />
      <h:outputText value="#{runUnitLane.samples.size()}" />
      <ui:include src="/fragments/details/unassignedreads.xhtml" />
      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="2"
      styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <ui:include src="/fragments/button/list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
