<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />

      <ui:include src="/fragments/details/instrument.xhtml" />

      <h:outputText value="#{messages.capacity}" />
      <h:outputText value="#{runUnitType.capacity}" />

      <h:outputText value="#{messages.numberOfLanes}" />
      <h:outputText value="#{runUnitType.numberOfLanes}" />

      <h:outputText value="#{messages.physicalSeparation}" />
      <h:outputText value="#{runUnitType.physicalSeparation}" />

      <h:outputText value="#{messages.enabled}" />
      <h:outputText value="#{runUnitType.enabled}" />

      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="4"
      styleClass="action">
      <ui:include src="/fragments/button/edit-clone-delete-list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
