<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">

  <p:dialog
    id="assignSampleModalPanel"
    widgetVar="assignSampleModalDialog"
    dynamic="true"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{messages.assign} #{messages.sample} to #{resourceHelper.selectedResource == null ? 'All Resources' : resourceHelper.selectedResource}" />
    </f:facet>

    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="include"
        value="/sample/assign-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="assignsample" />
      <ui:param
        name="tableContent"
        value="#{workunit.container.samples}" />
      <ui:param
        name="rowsPerPageDropdown"
        value="none" />
      <ui:param
        name="resources"
        value="#{workunit.resources}" />
    </ui:include>

    <h:panelGrid
      columns="1"
      styleClass="action">
      <p:commandButton
        value="#{messages.cancel}"
        immediate="true"
        global="false"
        oncomplete="PF('assignSampleModalDialog').hide()" />
    </h:panelGrid>
  </p:dialog>
</ui:composition>
