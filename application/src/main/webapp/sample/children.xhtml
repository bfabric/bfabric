<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('children')}">
    <h:panelGrid
      columns="1"
      styleClass="action">
      <h:form>
        <p:commandButton
          value="#{sampleTreeTableManager.treeTableView ? ''.concat(messages.table.concat(' ').concat(messages.view)) : ''.concat(messages.tree.concat(' ').concat(messages.view))}"
          action="#{sampleTreeTableManager.switchTreeTableView()}"
          process="@this"
          update="@this, children-samples-tab-content"
          oncomplete="fixOversize();" />
      </h:form>
    </h:panelGrid>

    <h:panelGroup id="children-samples-tab-content">
      <h:panelGroup
        id="tableView"
        rendered="#{not sampleTreeTableManager.treeTableView}">
        <ui:include src="/fragments/show-datatable.xhtml">
          <ui:param
            name="tableType"
            value="sample" />
          <ui:param
            name="tableContext"
            value="#{sample.tableContext}_children" />
          <ui:param
            name="tableContent"
            value="#{sample.childrenAsList}" />
        </ui:include>
      </h:panelGroup>

      <h:panelGroup
        id="treeTableView"
        rendered="#{sampleTreeTableManager.treeTableView}">
        <c:if test="#{sampleTreeTableManager.treeTableView}">
          <ui:include src="/fragments/show-treetable.xhtml">
            <ui:param
              name="tableType"
              value="sample" />
            <ui:param
              name="tableContext"
              value="#{sample.tableContext}_children" />
            <ui:param
              name="treeTableContent"
              value="#{sampleTreeTableManager.getTreeTableContent(sample.children, sample, false)}" />
            <ui:param
              name="contentSize"
              value="#{sample.descendants.size()}" />
            <ui:param
              name="hideColumns"
              value="container" />
            <o:methodParam
              name="nodeExpandListener"
              value="#{sampleTreeTableManager.nodeExpandListener}" />
            <o:methodParam
              name="nodeCollapseListener"
              value="#{sampleTreeTableManager.nodeCollapseListener}" />
          </ui:include>
        </c:if>
      </h:panelGroup>
    </h:panelGroup>
  </c:if>
</ui:composition>
