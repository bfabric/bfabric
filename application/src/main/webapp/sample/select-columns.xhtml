<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">

  <p:column
    id="#{constants.SELECTION}#{constants.COLUMN}"
    exportable="false"
    width="35">
    <f:facet name="header">
      <h:panelGrid
        columns="1"
        styleClass="nospace noborder">
        <h:outputText value="#{messages.select}" />
        <h:panelGrid
          columns="2"
          styleClass="select-icon">
          <p:commandLink
            actionListener="#{orderItemBatchManager.markSamples(true)}"
            immediate="true"
            global="false"
            update="@form"
            oncomplete="fixOversize();">
            <f:attribute
              name="#{constants.TABLE_CLIENT_ID}"
              value="#{tableReference.clientId}" />
            <i class="far fa-check-square" />
          </p:commandLink>
          <p:commandLink
            actionListener="#{orderItemBatchManager.markSamples(false)}"
            immediate="true"
            global="false"
            update="@form"
            oncomplete="fixOversize();">
            <f:attribute
              name="#{constants.TABLE_CLIENT_ID}"
              value="#{tableReference.clientId}" />
            <i class="far fa-square" />
          </p:commandLink>
        </h:panelGrid>
      </h:panelGrid>
    </f:facet>
    <h:selectBooleanCheckbox value="#{orderItemBatchManager.markedSamplesMap[entity]}">
      <p:ajax
        event="change"
        global="false"
        ignoreAutoUpdate="true"
        partialSubmit="true"
        listener="#{orderItemBatchManager.markSample(entity, orderItemBatchManager.markedSamplesMap[entity])}"
        update="@this, selectSamplesForm:actions"
        oncomplete="fixOversize();" />
    </h:selectBooleanCheckbox>
  </p:column>

  <ui:include src="/fragments/column/id.xhtml" />
  <ui:include src="/fragments/column/name-trunc.xhtml" />
</ui:composition>
