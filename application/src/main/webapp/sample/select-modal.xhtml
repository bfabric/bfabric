<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:dialog
    id="selectSamplesModalPanel"
    widgetVar="selectSamplesModalDialog"
    resizable="false"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{messages.selectSamples}" />
    </f:facet>
    <h:form id="selectSamplesForm">
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param
          name="include"
          value="/sample/select-columns.xhtml" />
        <ui:param
          name="tableType"
          value="sample" />
        <ui:param
          name="tableContext"
          value="available" />
        <ui:param
          name="tableContent"
          value="#{orderItemBatchManager.availableSamples}" />
        <ui:param
          name="lazy"
          value="true" />
      </ui:include>

      <h:panelGrid
        id="actions"
        columns="2"
        styleClass="action">
        <p:commandButton
          id="applyButton"
          disabled="#{orderItemBatchManager.addNewItemsSampleDisabled}"
          action="#{orderItemBatchManager.useSelectedSamples}"
          value="#{messages.save}"
          global="true"
          styleClass="addItemsUsingSamplesApplyButton"
          onclick="hasChanged=true; setNavigateAway('.addItemsUsingSamplesApplyButton[id$=\'applyButton\']'); jQuery(this).change();"
          oncomplete="hideDialogOnSuccess(args, 'selectSamplesModalDialog'); jumpToPage('batch', args.jumpToPage); fixOversize();"
          update="selectSamplesForm, @([id$=#{constants.EDIT}])" />
        <p:commandButton
          value="#{messages.cancel}"
          immediate="true"
          global="false"
          oncomplete="PF('selectSamplesModalDialog').hide(); fixOversize();" />
      </h:panelGrid>
    </h:form>
  </p:dialog>
</ui:composition>
