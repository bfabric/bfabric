<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{configuration.workflowEnabled and sidebarHelper.isTab('workflowsteps')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workflowstep" />
      <ui:param
        name="tableContext"
        value="#{sample.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{sample.workflowSteps}" />
      <ui:param
        name="hideColumns"
        value="sample" />
    </ui:include>
  </c:if>
</ui:composition>
