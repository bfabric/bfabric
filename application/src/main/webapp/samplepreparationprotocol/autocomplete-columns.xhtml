<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <p:column>
    <h:outputText value="#{item.displayName}" />
  </p:column>
  <p:column>
    <h:outputText value="#{item.created}" />
  </p:column>
  <p:column>
    <h:outputText value="#{item.createdBy}" />
  </p:column>
  <p:column>
    <h:outputText value="#{collectionHelper.printNames(item.sampleTypes)}" />
  </p:column>
</ui:composition>
