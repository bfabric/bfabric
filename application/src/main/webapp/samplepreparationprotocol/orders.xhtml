<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if
    test="#{configuration.orderEnabled and sidebarHelper.isTab('orders') and not empty samplePreparationProtocol.orders and identityManager.hasCurrentUserRole('samplePreparationProtocolReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="order" />
      <ui:param
        name="tableContext"
        value="#{samplePreparationProtocol.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{orderList.getOrdersLazyModelBySamplePreparationProtocolId(samplePreparationProtocol.id)}" />
      <ui:param
        name="hideColumns"
        value="samplepreparationprotocol, oldProjectOrderId, oldServiceOrderId" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
