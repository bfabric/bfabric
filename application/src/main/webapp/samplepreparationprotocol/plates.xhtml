<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('plates') and identityManager.hasCurrentUserRole('samplePreparationProtocolReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="plate" />
      <ui:param
        name="tableContext"
        value="#{samplePreparationProtocol.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{samplePreparationProtocol.platesLazyModel}" />
      <ui:param
        name="hideColumns"
        value="samplepreparationprotocol" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
