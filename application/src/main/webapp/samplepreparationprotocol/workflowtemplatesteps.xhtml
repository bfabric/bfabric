<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('workflowtemplatesteps') and not empty samplePreparationProtocol.workflowTemplateSteps and identityManager.hasCurrentUserRole('samplePreparationProtocolReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workflowtemplatestep" />
      <ui:param
        name="tableContext"
        value="#{samplePreparationProtocol.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{samplePreparationProtocol.workflowTemplateSteps}" />
      <ui:param
        name="hideColumns"
        value="samplePreparationProtocol" />
    </ui:include>
  </c:if>
</ui:composition>
