<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('admin')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.scheduledJobLog}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/lazylist.xhtml">
      <ui:param
        name="tableType"
        value="scheduledjoblog" />
    </ui:include>

    <o:importConstants type="org.bfabric.enums.JobEnum" />
    <h:form>
      <ui:repeat value="#{scheduledJobLogManager.getJobEnumsInvokableAnytime()}" var="jobEnum">
        <p:commandButton
          action="#{scheduledJobLogManager.triggerJob(jobEnum)}"
          value="#{messages[jobEnum]}"
          update="@form"
          style="margin: 10px 4px 0 0" />
      </ui:repeat>
    </h:form>
  </ui:define>
</ui:composition>
