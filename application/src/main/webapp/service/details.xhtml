<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />
      <ui:include src="/fragments/details/servicearea.xhtml">
        <ui:param
          name="instance"
          value="#{service.serviceType}" />
      </ui:include>
      <ui:include src="/fragments/details/servicetype.xhtml" />
      <ui:include src="/fragments/details/servicecode.xhtml" />
      <ui:include src="/fragments/details/description.xhtml" />
      <ui:include src="/fragments/details/users-table.xhtml" />
      <ui:include src="/fragments/details/enabled.xhtml" />

      <c:if test="#{not empty service.fullCost}">
        <h:outputText value="#{messages.fullCost}" />
        <h:outputText value="#{service.fullCost}" />
      </c:if>

      <h:outputText value="#{messages.prices}" />
      <p:dataTable
        id="serviceOrganizationTypeTable"
        value="#{service.serviceOrganizationTypePricesAsList}"
        var="item"
        styleClass="inner">
        <p:column
          field="organizationType.name"
          headerText="#{messages.organizationType}" />
        <p:column
          field="basicPrice"
          headerText="#{messages.basicPrice}">
          <h:outputText
            value="#{item.basicPrice}"
            style="float:right">
            <f:convertNumber pattern="0.00" />
          </h:outputText>
        </p:column>
        <p:column
          field="euGrantPrice"
          headerText="#{messages.euGrantPrice}">
          <h:outputText
            value="#{item.euGrantPrice}"
            style="float:right">
            <f:convertNumber pattern="0.00" />
          </h:outputText>
        </p:column>
        <c:if test="#{service.additionalPriceColumnRendered}">
          <p:column
            field="additionalPrice"
            headerText="#{messages.additionalPrice}">
            <h:outputText
              value="#{item.additionalPrice}"
              style="float:right">
              <f:convertNumber pattern="0.00" />
            </h:outputText>
          </p:column>
        </c:if>
      </p:dataTable>

      <ui:include src="/fragments/details/parents.xhtml" />
      <ui:include src="/fragments/details/children.xhtml" />

      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="7"
      styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <ui:include src="/fragments/button/clone.xhtml" />
      <h:form>
        <p:commandButton
          action="#{serviceManager.switchTracked()}"
          value="#{service.tracked ? messages.untrack : messages.track}"
          title="#{service.tracked ? messages.untrackServiceHint : messages.trackServiceHint}"
          update="@form" />
      </h:form>
      <ui:include src="/fragments/button/delete.xhtml" />
      <h:form rendered="#{service.clearPricesRendered}">
        <p:commandButton
          action="#{serviceManager.clearPrices()}"
          value="#{messages.clearPrices}"
          title="#{messages.clearPricesHint}"
          update="@form">
          <ui:include src="/fragments/confirm-dialog-action.xhtml" />
        </p:commandButton>
      </h:form>
      <ui:include src="/fragments/button/list.xhtml" />
      <ui:include src="/fragments/button/export-and-download-xml.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
