<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('serviceReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.servicePrices}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="include"
        value="/service/prices-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="#{service.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{serviceList.lazyModel}" />
    </ui:include>
  </ui:define>
</ui:composition>
