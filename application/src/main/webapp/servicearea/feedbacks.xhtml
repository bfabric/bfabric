<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('feedbacks') and serviceArea.feedbacksRendered}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="feedback" />
      <ui:param
        name="tableContext"
        value="#{serviceArea.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{serviceArea.feedbacks}" />
      <ui:param
        name="hideColumns"
        value="serviceArea" />
    </ui:include>
  </c:if>
</ui:composition>
