<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('orders')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="order" />
      <ui:param
        name="tableContext"
        value="#{serviceArea.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{orderList.getLazyModelByServiceAreaId(serviceArea.id)}" />
      <ui:param
        name="hideColumns"
        value="serviceArea" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
