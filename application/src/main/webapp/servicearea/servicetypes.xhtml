<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('servicetypes')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="servicetype" />
      <ui:param
        name="tableContext"
        value="#{serviceArea.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{serviceArea.serviceTypes}" />
      <ui:param
        name="hideColumns"
        value="serviceArea" />
      <ui:param
        name="showColumns"
        value="coachBackup, internal" />
    </ui:include>

    <h:panelGrid styleClass="action">
      <p:button
        outcome="/servicetype/edit.xhtml"
        value="#{messages.createServiceType}"
        rendered="#{identityManager.hasCurrentUserRole('serviceManager')}">
        <f:param
          name="serviceAreaId"
          value="#{serviceArea.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
