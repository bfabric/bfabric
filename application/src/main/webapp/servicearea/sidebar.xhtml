<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  <ui:include src="/fragments/sidebar/details.xhtml" />
  <ui:include src="/fragments/sidebar/notes.xhtml" />
  <ui:include src="/fragments/sidebar/servicetypes.xhtml">
    <ui:param
      name="showAlways"
      value="true" />
  </ui:include>

  <ui:include src="/fragments/sidebar/services.xhtml">
    <ui:param
      name="content"
      value="#{serviceList.getLazyModelByServiceAreaId(serviceArea.id)}" />
    <ui:param
      name="showAlways"
      value="true" />
  </ui:include>

  <ui:include src="/fragments/sidebar/orders.xhtml">
    <ui:param
      name="content"
      value="#{orderList.getLazyModelByServiceAreaId(serviceArea.id)}" />
  </ui:include>

  <ui:include src="/fragments/sidebar/charges.xhtml">
    <ui:param
      name="content"
      value="#{chargeList.getLazyModelByServiceAreaId(serviceArea.id)}" />
  </ui:include>

  <ui:include src="/fragments/sidebar/feedbacks.xhtml">
    <ui:param
      name="enabled"
      value="#{serviceArea.feedbacksRendered}" />
  </ui:include>

  <ui:include src="/fragments/sidebar/feedbackanswers.xhtml">
    <ui:param
      name="enabled"
      value="#{serviceArea.feedbacksRendered}" />
  </ui:include>

  <ui:include src="/fragments/sidebar/mails.xhtml" />
  <ui:include src="/fragments/sidebar/statistics.xhtml" />
</ui:composition>
