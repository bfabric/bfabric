<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">

  <p:dialog
    id="addServiceTypePanel"
    widgetVar="addServiceTypeDialog"
    dynamic="true"
    resizable="false"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText
        id="addServiceTypeHeader"
        value="#{messages.addNew}" />
    </f:facet>
    <h:form id="addServiceType">
      <h:panelGrid
        columns="2"
        columnClasses="rtdm, ltd">
        <h:outputText value="#{messages.serviceArea}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:selectOneMenu
            id="serviceArea"
            value="#{serviceHelper.serviceArea}"
            valueChangeListener="#{serviceHelper.serviceAreaChanged}"
            styleClass="editWidthExtraLarge"
            converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.selectAnItem}" />
            <f:selectItems
              value="#{serviceAreaList.enabledServiceAreas}"
              var="item"
              itemLabel="#{item.name}" />
          </h:selectOneMenu>
        </ui:decorate>

        <h:outputText value="#{messages.serviceType}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:inputText
            id="serviceTypeName"
            maxlength="256"
            value="#{serviceHelper.serviceTypeName}"
            required="true"
            styleClass="editWidthExtraLarge" />
        </ui:decorate>
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          id="saveServiceTypeButton"
          action="#{serviceHelper.save}"
          value="#{messages.save}"
          global="false"
          update="addServiceType, @([id$=enabledDecorate]), @([id$=serviceArea]), @([id$=serviceType], @([id$=serviceTypeautocomplete])"
          oncomplete="hideDialogOnSuccess(args, 'addServiceTypeDialog')" />
        <p:commandButton
          value="#{messages.cancel}"
          id="cancelServiceTypeButton"
          immediate="true"
          global="false"
          oncomplete="PF('addServiceTypeDialog').hide()" />
      </h:panelGrid>
    </h:form>
  </p:dialog>
</ui:composition>
