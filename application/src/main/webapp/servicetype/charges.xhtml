<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('charges')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="charge" />
      <ui:param
        name="tableContext"
        value="#{serviceType.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{chargeList.getLazyModelByServiceTypeId(serviceType.id)}" />
      <ui:param
        name="hideColumns"
        value="serviceType" />
      <ui:param
        name="showColumns"
        value="organization" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
