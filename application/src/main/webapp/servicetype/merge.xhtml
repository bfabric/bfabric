<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <ui:define name="pageTitle">
    <h:outputText value="#{messages.mergeServiceTypes}" />
  </ui:define>

  <ui:define name="body">
    <h:form id="merge">
      <h:panelGrid
        columns="4"
        columnClasses=", textright padding-right-small, , textleft"
        styleClass="align-middle">
        <h:outputText value="#{messages.id}" />
        <ui:include src="/fragments/entity-link.xhtml">
          <ui:param
            name="instance"
            value="#{serviceTypeManager.serviceType}" />
        </ui:include>
        <span />
        <ui:include src="/fragments/entity-link.xhtml">
          <ui:param
            name="instance"
            value="#{serviceTypeManager.merged}" />
        </ui:include>

        <h:outputText value="#{messages.name}" />
        <h:outputText value="#{serviceTypeManager.serviceType.name}" />
        <h:selectOneRadio
          id="#{constants.NAME}"
          layout="lineDirection"
          value="#{serviceTypeManager.mergeSelection.name}">
          <f:selectItem itemValue="#{serviceTypeManager.serviceType.name}" />
          <f:selectItem itemValue="#{serviceTypeManager.merged.name}" />
        </h:selectOneRadio>
        <h:outputText value="#{serviceTypeManager.merged.name}" />

        <h:outputText value="#{messages.serviceArea}" />
        <ui:include src="/fragments/entity-link-displayname.xhtml">
          <ui:param
            name="instance"
            value="#{serviceTypeManager.serviceType.serviceArea}" />
        </ui:include>
        <h:selectOneRadio
          id="serviceArea"
          layout="lineDirection"
          value="#{serviceTypeManager.mergeSelection.serviceArea}"
          converter="omnifaces.SelectItemsConverter">
          <f:selectItem itemValue="#{serviceTypeManager.serviceType.serviceArea}" />
          <f:selectItem itemValue="#{serviceTypeManager.merged.serviceArea}" />
        </h:selectOneRadio>
        <ui:include src="/fragments/entity-link-displayname.xhtml">
          <ui:param
            name="instance"
            value="#{serviceTypeManager.merged.serviceArea}" />
        </ui:include>

        <c:if test="#{not empty serviceTypeManager.serviceType.description or not empty serviceTypeManager.merged.description}">
          <h:outputText value="#{messages.description}" />
          <h:outputText value="#{serviceTypeManager.serviceType.getDescriptionTrunc(40)}" title="#{serviceTypeManager.serviceType.description}" />
          <h:selectOneRadio
            id="description"
            layout="lineDirection"
            value="#{serviceTypeManager.mergeSelection.description}">
            <f:selectItem itemValue="#{serviceTypeManager.serviceType.description}" />
            <f:selectItem itemValue="#{serviceTypeManager.merged.description}" />
          </h:selectOneRadio>
          <h:outputText value="#{serviceTypeManager.merged.getDescriptionTrunc(40)}" title="#{serviceTypeManager.merged.description}" />
        </c:if>

        <h:outputText value="#{messages.enabled}" />
        <h:outputText value="#{serviceTypeManager.serviceType.enabled}" />
        <h:selectOneRadio
          id="enabled"
          layout="lineDirection"
          value="#{serviceTypeManager.mergeSelection.enabled}">
          <f:selectItem itemValue="#{serviceTypeManager.serviceType.enabled}" />
          <f:selectItem itemValue="#{serviceTypeManager.merged.enabled}" />
        </h:selectOneRadio>
        <h:outputText value="#{serviceTypeManager.merged.enabled}" />

        <h:outputText value="#{messages.requiresProject}" />
        <h:outputText value="#{serviceTypeManager.serviceType.requiresProject}" />
        <h:selectOneRadio
          id="requiresProject"
          layout="lineDirection"
          value="#{serviceTypeManager.mergeSelection.requiresProject}">
          <f:selectItem itemValue="#{serviceTypeManager.serviceType.requiresProject}" />
          <f:selectItem itemValue="#{serviceTypeManager.merged.requiresProject}" />
        </h:selectOneRadio>
        <h:outputText value="#{serviceTypeManager.merged.requiresProject}" />

        <h:outputText value="#{messages.processesSamples}" />
        <h:outputText value="#{serviceTypeManager.serviceType.processesSamples}" />
        <h:selectOneRadio
          id="processesSamples"
          layout="lineDirection"
          value="#{serviceTypeManager.mergeSelection.processesSamples}">
          <f:selectItem itemValue="#{serviceTypeManager.serviceType.processesSamples}" />
          <f:selectItem itemValue="#{serviceTypeManager.merged.processesSamples}" />
        </h:selectOneRadio>
        <h:outputText value="#{serviceTypeManager.merged.processesSamples}" />

        <h:outputText value="#{messages.serviceColumnEnabled}" />
        <h:outputText value="#{serviceTypeManager.serviceType.serviceColumnEnabled}" />
        <h:selectOneRadio
          id="serviceColumnEnabled"
          layout="lineDirection"
          value="#{serviceTypeManager.mergeSelection.serviceColumnEnabled}">
          <f:selectItem itemValue="#{serviceTypeManager.serviceType.serviceColumnEnabled}" />
          <f:selectItem itemValue="#{serviceTypeManager.merged.serviceColumnEnabled}" />
        </h:selectOneRadio>
        <h:outputText value="#{serviceTypeManager.merged.serviceColumnEnabled}" />

        <c:if test="#{not empty serviceTypeManager.serviceType.sampleType or not empty serviceTypeManager.merged.sampleType}">
          <h:outputText value="#{messages.sampleType}" />
          <h:outputText value="#{serviceTypeManager.serviceType.sampleType.displayName}" />
          <h:selectOneRadio
            id="sampleType"
            layout="lineDirection"
            value="#{serviceTypeManager.mergeSelection.sampleType}"
            converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{serviceTypeManager.serviceType.sampleType}" />
            <f:selectItem itemValue="#{serviceTypeManager.merged.sampleType}" />
          </h:selectOneRadio>
          <h:outputText value="#{serviceTypeManager.merged.sampleType.displayName}" />
        </c:if>

        <c:if test="#{not empty serviceTypeManager.serviceType.instructionLink or not empty serviceTypeManager.merged.instructionLink}">
          <h:outputText value="#{messages.instructionLink}" />
          <h:outputText value="#{serviceTypeManager.serviceType.instructionLink}" />
          <h:selectOneRadio
            id="instructionLink"
            layout="lineDirection"
            value="#{serviceTypeManager.mergeSelection.instructionLink}">
            <f:selectItem itemValue="#{serviceTypeManager.serviceType.instructionLink}" />
            <f:selectItem itemValue="#{serviceTypeManager.merged.instructionLink}" />
          </h:selectOneRadio>
          <h:outputText value="#{serviceTypeManager.merged.instructionLink}" />
        </c:if>

        <c:if test="#{not empty serviceTypeManager.serviceType.coach or not empty serviceTypeManager.merged.coach}">
          <h:outputText value="#{messages.coach}" />
          <h:outputText value="#{serviceTypeManager.serviceType.coach.displayName}" />
          <h:selectOneRadio
            id="coach"
            layout="lineDirection"
            value="#{serviceTypeManager.mergeSelection.coach}"
            converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{serviceTypeManager.serviceType.coach}" />
            <f:selectItem itemValue="#{serviceTypeManager.merged.coach}" />
          </h:selectOneRadio>
          <h:outputText value="#{serviceTypeManager.merged.coach.displayName}" />
        </c:if>

        <c:if test="#{not empty serviceTypeManager.serviceType.coachBackup or not empty serviceTypeManager.merged.coachBackup}">
          <h:outputText value="#{messages.coachBackup}" />
          <h:outputText value="#{serviceTypeManager.serviceType.coachBackup.displayName}" />
          <h:selectOneRadio
            id="coachBackup"
            layout="lineDirection"
            value="#{serviceTypeManager.mergeSelection.coachBackup}"
            converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{serviceTypeManager.serviceType.coachBackup}" />
            <f:selectItem itemValue="#{serviceTypeManager.merged.coachBackup}" />
          </h:selectOneRadio>
          <h:outputText value="#{serviceTypeManager.merged.coachBackup.displayName}" />
        </c:if>

        <h:outputText value="#{messages.orderPosition}" />
        <h:outputText value="#{serviceTypeManager.serviceType.orderPosition}" />
        <h:selectOneRadio
          id="orderPosition"
          layout="lineDirection"
          value="#{serviceTypeManager.mergeSelection.orderPosition}">
          <f:selectItem itemValue="#{serviceTypeManager.serviceType.orderPosition}" />
          <f:selectItem itemValue="#{serviceTypeManager.merged.orderPosition}" />
        </h:selectOneRadio>
        <h:outputText value="#{serviceTypeManager.merged.orderPosition}" />

        <p:spacer height="10" />
        <h:outputText value="" />
        <h:outputText value="" />
        <h:outputText value="" />

        <h:outputText value="#{messages.services}" />
        <h:outputText value="#{serviceTypeManager.serviceType.services.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{serviceTypeManager.merged.services.size()}" />

        <h:outputText value="#{messages.orders}" />
        <h:outputText value="#{serviceTypeManager.serviceType.orders.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{serviceTypeManager.merged.orders.size()}" />

        <h:outputText value="#{messages.charges}" />
        <h:outputText value="#{chargeList.getLazyModelByServiceTypeId(serviceTypeManager.serviceType.id).size()}" />
        <h:outputText value="" />
        <h:outputText value="#{chargeList.getLazyModelByServiceTypeId(serviceTypeManager.merged.id).size()}" />

        <h:outputText value="#{messages.users}" />
        <h:outputText value="#{serviceTypeManager.serviceType.users.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{serviceTypeManager.merged.users.size()}" />

        <h:outputText value="#{messages.sequencingApplications}" />
        <h:outputText value="#{serviceTypeManager.serviceType.sequencingApplications.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{serviceTypeManager.merged.sequencingApplications.size()}" />

        <h:outputText value="#{messages.instruments}" />
        <h:outputText value="#{serviceTypeManager.serviceType.instruments.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{serviceTypeManager.merged.instruments.size()}" />

        <h:outputText value="#{messages.orderAttributes}" />
        <h:outputText value="#{serviceTypeManager.serviceType.orderAttributes.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{serviceTypeManager.merged.orderAttributes.size()}" />

        <h:outputText value="#{messages.workflowTemplates}" />
        <h:outputText value="#{serviceTypeManager.serviceType.workflowTemplates.size()}" />
        <h:outputText value="" />
        <h:outputText value="#{serviceTypeManager.merged.workflowTemplates.size()}" />
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{serviceTypeManager.merge}"
          value="#{messages.merge}"
          update="@form" />
        <p:commandButton
          action="#{serviceTypeManager.getManageDuplicatesScreenRedirectURL()}"
          value="#{messages.cancel}"
          immediate="true" />
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
