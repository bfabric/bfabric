<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('services')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="service" />
      <ui:param
        name="tableContext"
        value="#{serviceType.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{serviceType.services}" />
      <ui:param
        name="hideColumns"
        value="serviceType, serviceArea" />
    </ui:include>

    <h:panelGrid styleClass="action">
      <p:button
        outcome="/service/edit.xhtml"
        value="#{messages.createService}"
        rendered="#{identityManager.hasCurrentUserRole('serviceManager')}">
        <f:param
          name="serviceTypeId"
          value="#{serviceType.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
