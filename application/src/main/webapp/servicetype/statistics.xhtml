<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('statistics')}">
    <h:outputText rendered="#{empty statisticsList.getBookedChargeServiceType(serviceType.id)}" value="#{messages.statisticsEmptyHint}" />

    <p:spacer height="20" />
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="include"
        value="/fragments/grouped-charge-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="#{serviceType.tableContext}_statistics" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.getBookedChargeServiceType(serviceType.id)}" />
      <ui:param
        name="rowsPerPageDropdown"
        value="all" />
    </ui:include>

    <p:spacer height="20" />

    <p:barChart
      model="#{barChart.getHorizontal(statisticsList.getBookedChargeServiceTypeChart(serviceType.id), messages.charges, messages.serviceTypeBookedChargesPerYear, messages.serviceType, null, null)}"
      style="height:200px;width:400px" />
  </c:if>
</ui:composition>
