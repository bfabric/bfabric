<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <ui:define name="pageTitle">
    <h:outputText value="Welcome to #{configuration.applicationName} via Shibboleth" />
  </ui:define>

  <ui:define name="body">
    <p>Please enter your #{configuration.applicationName} login name and password to associate your #{configuration.applicationName} account with your Shibboleth account
      (#{shibbolethManager.userDetails}).</p>

    <h:form id="map-account">
      <h:panelGrid
        columns="2"
        columnClasses="rtdm, ltd">

        <h:outputText value="#{messages.login}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:inputText
            id="userName"
            value="#{shibbolethManager.userName}"
            required="true"
            maxlength="64"
            autocomplete="off"
            validator="#{shibbolethManager.validateMappedAccountLogin}"
            styleClass="editWidth" />
        </ui:decorate>

        <h:outputText value="#{messages.password}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:inputSecret
            id="password"
            converter="charArrayConverter"
            value="#{shibbolethManager.password}"
            required="true"
            redisplay="true"
            autocomplete="off"
            maxlength="32"
            validator="#{shibbolethManager.validateMappedAccountPassword}"
            styleClass="editWidth" />
        </ui:decorate>
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{shibbolethManager.mapToShibbolethAccount}"
          value="#{messages.associateAccount}"
          title="#{messages.associateAccountHint}"
          update="map-account" />
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
