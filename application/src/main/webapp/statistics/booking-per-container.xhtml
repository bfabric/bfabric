<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.income} #{messages.per} #{messages.containers}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="bookingPerContainer" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.bookingPerContainer}" />
      <ui:param
        name="include"
        value="/statistics/booking-per-container-columns.xhtml" />
    </ui:include>
  </ui:define>
</ui:composition>
