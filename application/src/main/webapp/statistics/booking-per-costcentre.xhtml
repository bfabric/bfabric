<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.income} #{messages.per} #{messages.costCentre}" />
  </ui:define>

  <ui:define name="body">
    <h3><h:outputText value="#{messages.totalPriceBookedBillableCharges}" /></h3>
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="bookingPerCostCentre" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.bookingPerCostCentre}" />
      <ui:param
        name="include"
        value="/statistics/booking-per-costcentre-columns.xhtml" />
    </ui:include>
    <p:spacer height="20" />
    <h3><h:outputText value="#{messages.totalPriceNonBookedBillableCharges}" /></h3>
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="nonBookedBillableCharges" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.nonBookedBillableCharges}" />
      <ui:param
        name="include"
        value="/statistics/non-booked-billable-charge-columns.xhtml" />
    </ui:include>
  </ui:define>
</ui:composition>
