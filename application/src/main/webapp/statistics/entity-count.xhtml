<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.entities} #{messages.count}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="cubePerYear" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.entityCounts}" />
      <ui:param
        name="include"
        value="/statistics/entity-count-columns.xhtml" />
      <ui:param
        name="paginator"
        value="true" />
    </ui:include>
    <p:dataGrid value="#{statisticsList.entityCounts}" var="entity" columns="6" layout="tabular">
      <p:panel header="#{entity[0]}" style="text-align:center; background-color: hsla(0, 100%, 50%, #{entity[1] / 10000});">
        <h:outputText value="#{entity[1]}" style="color: hsla(100%, 100%, 100%, #{entity[1] / 10000});" />
      </p:panel>
    </p:dataGrid>
  </ui:define>
</ui:composition>
