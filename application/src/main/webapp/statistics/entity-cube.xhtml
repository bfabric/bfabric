<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.entities}" />
  </ui:define>

  <ui:define name="body">
    <h:form>
      <h:panelGroup>
        <p:selectOneMenu
          value="#{statisticsManager.entityClassName}"
          valueChangeListener="#{statisticsManager.entityClassNameChanged}"
          filter="true"
          filterMatchMode="contains">
          <f:selectItem itemLabel="#{messages.selectAnItem}" />
          <f:selectItems
            value="#{classHelper.baseEntityClassNamesList}"
            var="item" />
          <p:ajax
            event="change"
            global="false"
            update="cubePerYear" />
        </p:selectOneMenu>
      </h:panelGroup>
      <div>
        <p:spacer height="10" />
      </div>
      <h:panelGroup id="cubePerYear">
        <h:panelGroup rendered="#{not empty statisticsList.getCubePerYear(statisticsManager.entityClassName)}">
          <ui:include src="/fragments/datatable.xhtml">
            <ui:param
              name="tableContext"
              value="cubePerYear" />
            <ui:param
              name="tableContent"
              value="#{statisticsList.getCubePerYear(statisticsManager.entityClassName)}" />
            <ui:param
              name="include"
              value="/statistics/entity-cube-columns.xhtml" />
            <ui:param
              name="rowsPerPageDropdown"
              value="all" />
            <ui:param
              name="exportSuffix"
              value="#{statisticsManager.entityClassName}" />
          </ui:include>
          <p:spacer height="20" />
          <p:barChart
            model="#{barChart.getHorizontal(statisticsList.getCubePerYearChart(statisticsManager.entityClassName),null,null,messages.entityPerYear,null,null)}"
            style="width:400px" />
        </h:panelGroup>
      </h:panelGroup>
    </h:form>
  </ui:define>
</ui:composition>
