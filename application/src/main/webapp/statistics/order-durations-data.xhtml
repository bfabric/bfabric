<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  template="/layout/template.xhtml">

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.orderDurations} [#{messages.days}]" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="all" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.orderDurationsData}" />
      <ui:param
        name="include"
        value="/statistics/order-durations-data-columns.xhtml" />
      <ui:param
        name="rowsPerPageDropdown"
        value="all" />
    </ui:include>
  </ui:define>
</ui:composition>
