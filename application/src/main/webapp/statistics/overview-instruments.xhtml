<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.instruments} #{messages.overview}" />
  </ui:define>

  <ui:define name="body">
    <p:barChart
      model="#{barChart.getHorizontalStacked([statisticsList.getReservationdaysInstrumentsYearly(), statisticsList.getMaintenanceInstrumentsYearly()], [messages.reservation, messages.maintenance], messages.kpiInstPerformanceInst, null, null, null)}"
      style="width:600px" />
  </ui:define>
</ui:composition>
