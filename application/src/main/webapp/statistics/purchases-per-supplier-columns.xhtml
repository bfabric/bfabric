<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">

  <p:columnGroup type="header">
    <p:row>
      <p:column colspan="1" headerText="#{messages.year}" />
      <p:column colspan="1" headerText="#{messages.month}" />
      <p:column colspan="2" headerText="#{messages.supplier}" />
      <p:column colspan="1" headerText="#{messages.technology}" />
      <p:column colspan="1" headerText="#{messages.quantity}" />
      <p:column colspan="2" headerText="#{messages.amount}" />
      <p:column colspan="2" headerText="#{messages.amount}" />
    </p:row>
    <p:row>
      <p:column headerText="&#160;" sortBy="#{entity[0]}" filterBy="#{entity[0]}" />
      <p:column headerText="&#160;" sortBy="#{entity[1]}" filterBy="#{entity[1]}" />
      <p:column headerText="#{messages.id}" sortBy="#{entity[2]}" filterBy="#{entity[2]}" />
      <p:column headerText="#{messages.name}" sortBy="#{entity[3]}" filterBy="#{entity[3]}" />
      <p:column headerText="&#160;" sortBy="#{entity[4]}" filterBy="#{entity[4]}" />
      <p:column headerText="#{messages.purchases}" sortBy="#{entity[5]}" filterBy="#{entity[5]}" />
      <p:column headerText="#{messages.orders}" sortBy="#{entity[6]}" filterBy="#{entity[6]}" />
      <p:column headerText="#{messages.currency}" sortBy="#{entity[7]}" filterBy="#{entity[7]}" />
      <p:column headerText="#{messages.invoiced}" sortBy="#{entity[8]}" filterBy="#{entity[8]}" />
      <p:column headerText="#{messages.currency}" sortBy="#{entity[9]}" filterBy="#{entity[9]}" />
    </p:row>
  </p:columnGroup>

  <ui:include src="/statistics/fragments/column/year-month.xhtml" />
  <ui:include src="/fragments/column/value-id-name.xhtml">
    <ui:param
      name="headerTextId"
      value="#{messages.supplierId}" />
    <ui:param
      name="headerTextName"
      value="#{messages.name}" />
    <ui:param
      name="valueId"
      value="#{entity[2]}" />
    <ui:param
      name="valueName"
      value="#{entity[3]}" />
    <ui:param
      name="valueClass"
      value="supplier" />
    <ui:param
      name="grouped"
      value="true" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/text.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.technologies}" />
    <ui:param
      name="value"
      value="#{entity[4]}" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/integer.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.purchases}" />
    <ui:param
      name="value"
      value="#{entity[5]}" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/money.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.orderPrice}" />
    <ui:param
      name="value"
      value="#{entity[6]}" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/text.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.currency}" />
    <ui:param
      name="value"
      value="#{entity[7]}" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/money.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.invoicedPrice}" />
    <ui:param
      name="value"
      value="#{entity[8]}" />
  </ui:include>
  <ui:include src="/statistics/fragments/column/text.xhtml">
    <ui:param
      name="headerText"
      value="#{messages.currency}" />
    <ui:param
      name="value"
      value="#{entity[9]}" />
  </ui:include>
</ui:composition>
