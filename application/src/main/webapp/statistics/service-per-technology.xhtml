<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.services} #{messages.per} #{messages.technology}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="include"
        value="/statistics/service-per-technology-columns.xhtml" />
      <ui:param
        name="tableContext"
        value="services-per-technology" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.servicesPerTechnology}" />
      <ui:param
        name="rowsPerPageDropdown"
        value="all" />
    </ui:include>
  </ui:define>
</ui:composition>
