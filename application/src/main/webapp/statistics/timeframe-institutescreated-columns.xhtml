<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <p:column width="75" headerText="#{messages.id}">
    <p:link
      outcome="/institute/show.xhtml"
      value="#{entity[0]}">
      <f:param
        name="id"
        value="#{entity[0]}" />
    </p:link>
  </p:column>
  <p:column width="700" headerText="#{messages.name}">
    <p:link
      outcome="/institute/show.xhtml"
      value="#{entity[1]}">
      <f:param
        name="id"
        value="#{entity[0]}" />
    </p:link>
  </p:column>
  <p:column width="65" headerText="#{messages.created}">
    <h:outputText value="#{entity[2]}" />
  </p:column>
</ui:composition>
