<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.timeframe}: #{messages.timeframeProjectsApproved}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/statistics/timeframe-select.xhtml" />
    <h:outputText
      rendered="#{empty statisticsManager.lastApprovedProjects}"
      value="No project!" />
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="lastapprovedprojects" />
      <ui:param
        name="tableContent"
        value="#{statisticsManager.lastApprovedProjects}" />
      <ui:param
        name="include"
        value="/statistics/timeframe-projectsapproved-columns.xhtml" />
    </ui:include>
  </ui:define>
</ui:composition>
