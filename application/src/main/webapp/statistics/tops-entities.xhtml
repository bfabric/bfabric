<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.topEntities}" />
  </ui:define>

  <ui:define name="body">
    <p:dataTable
      value="#{statisticsList.topEntityCounts}"
      var="item">
      <p:column
        headerText="#{messages.count}"
        styleClass="textright">
        <h:outputText value="#{item[1]}" />
      </p:column>
      <p:column
        headerText="#{messages.entity}">
        <h:outputText value="#{item[0]}" />
      </p:column>
    </p:dataTable>
  </ui:define>
</ui:composition>
