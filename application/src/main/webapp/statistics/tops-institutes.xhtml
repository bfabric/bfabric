<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.top} #{messages.institutes}" />
  </ui:define>

  <ui:define name="body">
    <h:panelGroup styleClass="statistics-block">
      <p:dataTable
        value="#{statisticsList.view('statisticscontainerinstitute')}"
        var="item">
        <p:column
          headerText="#{messages.containers}"
          styleClass="textright">
          <h:outputText value="#{item[2]}" />
        </p:column>
        <p:column headerText="#{messages.institute}">
          <p:link
            rendered="#{not empty item[0]}"
            outcome="/institute/show.xhtml"
            value="#{item[1]}">
            <f:param
              name="id"
              value="#{item[0]}" />
          </p:link>
        </p:column>
      </p:dataTable>
    </h:panelGroup>
    <h:panelGroup styleClass="statistics-block">
      <p:dataTable
        value="#{statisticsList.view('statisticsuserinstitute')}"
        var="item">
        <p:column
          headerText="#{messages.users}"
          styleClass="textright">
          <h:outputText value="#{item[2]}" />
        </p:column>
        <p:column headerText="#{messages.institute}">
          <p:link
            rendered="#{not empty item[0]}"
            outcome="/institute/show.xhtml"
            value="#{item[1]}">
            <f:param
              name="id"
              value="#{item[0]}" />
          </p:link>
        </p:column>
      </p:dataTable>
    </h:panelGroup>
  </ui:define>
</ui:composition>
