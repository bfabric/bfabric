<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:dataTable
    value="#{statisticsList.view('statisticsprojecttechnology')}"
    var="element">
    <p:column
      headerText="#{messages.projects}"
      styleClass="textright">
      <h:outputText value="#{element[2]}" />
    </p:column>
    <p:column headerText="#{messages.technology}">
      <p:link
        rendered="#{not empty element[0]}"
        outcome="/userlab/show-technology.xhtml"
        value="#{element[1]}">
        <f:param
          name="id"
          value="#{element[0]}" />
      </p:link>
    </p:column>
  </p:dataTable>
</ui:composition>
