<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.top} #{messages.users}" />
  </ui:define>

  <ui:define name="body">
    <p:dataTable
      value="#{statisticsList.view('statisticsmember')}"
      var="item">
      <p:column
        headerText="#{messages.total}"
        styleClass="textright">
        <h:outputText value="#{item[4]}" />
      </p:column>
      <p:column headerText="#{messages.member}">
        <p:link
          rendered="#{not empty item[0]}"
          outcome="/user/show.xhtml"
          value="#{item[1]} #{item[2]} #{item[3]}">
          <f:param
            name="id"
            value="#{item[0]}" />
        </p:link>
      </p:column>
    </p:dataTable>
  </ui:define>
</ui:composition>
