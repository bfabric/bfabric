<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrict(identityManager.hasCurrentUserRole('statisticsReader') and configuration.statisticsEnabled)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.workunitStatus}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="workunitStatus" />
      <ui:param
        name="tableContent"
        value="#{statisticsList.workunitStatusCounts}" />
      <ui:param
        name="include"
        value="/statistics/workunitstatus-count-columns.xhtml" />
      <ui:param
        name="paginator"
        value="true" />
    </ui:include>
    <p:spacer height="30" />
    <p:barChart model="#{barChart.getHorizontal(statisticsList.workunitStatusCounts,null,null,messages.workunitStatus,null,null)}" style="width:400px" />
  </ui:define>
</ui:composition>
