<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('accesses')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="access" />
      <ui:param
        name="tableContext"
        value="#{storage.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{storage.accesses}" />
      <ui:param
        name="hideColumns"
        value="storage" />
    </ui:include>
    <h:panelGrid
      rendered="#{storage.adminOrSupervisor}"
      columns="1"
      styleClass="action">
      <p:button
        outcome="/access/edit.xhtml"
        value="#{messages.create}">
        <f:param
          name="storageId"
          value="#{storage.id}" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
