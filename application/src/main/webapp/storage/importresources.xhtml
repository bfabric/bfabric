<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('importResources')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="importresource" />
      <ui:param
        name="tableContext"
        value="#{storage.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{importResourceList.getLazyModelByStorageId(storage.id)}" />
      <ui:param
        name="hideColumns"
        value="storage" />
    </ui:include>
  </c:if>
</ui:composition>
