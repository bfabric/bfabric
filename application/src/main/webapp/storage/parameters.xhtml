<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('parameters')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="parameter" />
      <ui:param
        name="tableContext"
        value="#{storage.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{storage.parameters}" />
    </ui:include>
  </c:if>
</ui:composition>
