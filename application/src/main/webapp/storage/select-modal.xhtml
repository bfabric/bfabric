<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">

  <p:dialog
    id="selectStorageModalPanel"
    widgetVar="selectStorageModalDialog"
    dynamic="true"
    modal="true"
    onShow="repositionDialog()">
    <f:facet name="header">
      <h:outputText value="#{messages.select} #{messages.storage}" />
    </f:facet>
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="storage" />
      <ui:param
        name="tableContent"
        value="#{storageList.enabledStorages}" />
      <ui:param
        name="include"
        value="/storage/select-columns.xhtml" />
      <ui:param
        name="rowsPerPageDropdown"
        value="none" />
    </ui:include>

    <h:panelGrid
      columns="1"
      styleClass="action">
      <p:commandButton
        value="#{messages.cancel}"
        immediate="true"
        global="false"
        oncomplete="PF('selectStorageModalDialog').hide()" />
    </h:panelGrid>
  </p:dialog>
</ui:composition>
