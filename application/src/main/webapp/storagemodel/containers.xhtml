<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('containers')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param name="tableType" value="container" />
      <ui:param name="tableContext" value="#{storageModel.tableContext}" />
      <ui:param name="tableContent" value="#{containerList.getLazyModelByStorageModelId(storageModel.id)}" />
      <ui:param name="hideColumns" value="libraryType, readType, region, insertSize, multiplexing" />
    </ui:include>
  </c:if>
</ui:composition>
