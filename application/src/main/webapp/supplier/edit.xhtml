<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{supplierManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{supplier.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.companyId}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:inputMask
              id="companyId"
              value="#{supplier.companyId}"
              title="#{messages.companyIdHint}"
              mask="aaa-999.999.999"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.phone}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:panelGrid
              id="phone"
              columns="8"
              styleClass="noborder-rightpadding">
              <h:outputText value="#{messages.countryCode}" />
              <h:selectOneMenu
                id="phoneCountryCode"
                value="#{supplier.phoneNumber.countryCode}"
                styleClass="width-auto">
                <f:selectItems
                  var="item"
                  value="#{countryList.countryDialingCodes}"
                  itemLabel="#{item}" />
              </h:selectOneMenu>
              <h:outputText value="#{messages.areaCode}" />
              <p:inputMask
                id="phoneAreaCode"
                value="#{supplier.phoneNumber.areaCode}"
                mask="9[999]"
                size="4" />
              <p:message
                for="phoneAreaCode"
                styleClass="errorMessage" />
              <h:outputText value="#{messages.localNumber}" />
              <p:inputMask
                id="phoneLocalNumber"
                value="#{supplier.phoneNumber.localNumber}"
                mask="9[9999999]"
                size="8" />
              <p:message
                for="phoneLocalNumber"
                styleClass="errorMessage" />
            </h:panelGrid>
          </ui:decorate>

          <h:outputText value="#{messages.email}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="email"
              value="#{supplier.email}"
              validator="#{supplier.validateEmail}"
              styleClass="editWidthExtraLarge">
              <f:attribute
                name="supplierEmail"
                value="supplierEmail" />
            </h:inputText>
          </ui:decorate>

          <h:outputText value="#{messages.address} #{messages.street}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="address"
              value="#{supplier.address.street}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.address} #{messages.zip}" title="#{messages.zipHint}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="zip"
              value="#{supplier.address.zip}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.address} #{messages.city}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="city"
              value="#{supplier.address.city}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.address} #{messages.country}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="country" />
              <ui:param
                name="value"
                value="#{supplier.address.country}" />
              <o:methodParam
                name="completeMethod"
                value="#{countryService.getCountriesByIdOrNameFiltered}" />
              <ui:param
                name="itemLabel"
                value="#{item.displayName}" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.address} #{messages.room}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="room"
              value="#{supplier.address.room}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.address} #{messages.supplement}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="supplement"
              value="#{supplier.address.supplement}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.url}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="url"
              value="#{supplier.url}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.contactTitle}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectOneMenu
              id="contactTitle"
              value="#{supplier.contactTitle}"
              styleClass="editWidthExtraLarge">
              <f:selectItem itemLabel="" />
              <f:selectItem itemValue="Dr." />
              <f:selectItem itemValue="Prof. Dr." />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText value="#{messages.contactSalutation}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectOneMenu
              id="contactSalutation"
              value="#{supplier.contactSalutation}"
              styleClass="editWidthExtraLarge">
              <f:selectItem itemLabel="" />
              <f:selectItem itemValue="Mr" />
              <f:selectItem itemValue="Ms" />
            </h:selectOneMenu>
          </ui:decorate>

          <h:outputText value="#{messages.contactFirstName}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="contactFirstName"
              value="#{supplier.contactFirstName}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.contactLastName}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="contactLastName"
              value="#{supplier.contactLastName}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.contactPhone}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:panelGrid
              id="contactPhone"
              columns="8"
              styleClass="noborder-rightpadding">
              <h:outputText value="#{messages.countryCode}" />
              <h:selectOneMenu
                id="contactPhoneCountryCode"
                value="#{supplier.contactPhoneNumber.countryCode}"
                styleClass="width-auto">
                <f:selectItems
                  var="item"
                  value="#{countryList.countryDialingCodes}"
                  itemLabel="#{item}" />
              </h:selectOneMenu>
              <h:outputText value="#{messages.areaCode}" />
              <p:inputMask
                id="contactPhoneAreaCode"
                value="#{supplier.contactPhoneNumber.areaCode}"
                mask="9[999]"
                size="4" />
              <p:message
                for="phoneAreaCode"
                styleClass="errorMessage" />
              <h:outputText value="#{messages.localNumber}" />
              <p:inputMask
                id="contactPhoneLocalNumber"
                value="#{supplier.contactPhoneNumber.localNumber}"
                mask="9[9999999]"
                size="8" />
              <p:message
                for="phoneLocalNumber"
                styleClass="errorMessage" />
            </h:panelGrid>
          </ui:decorate>

          <h:outputText value="#{messages.contactEmail}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="contactEmail"
              value="#{supplier.contactEmail}"
              validator="#{supplier.validateEmail}"
              styleClass="editWidthExtraLarge">
              <f:attribute
                name="contactEmail"
                value="contactEmail" />
            </h:inputText>
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="description"
              value="#{supplier.description}"
              rows="3"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <ui:include src="/fragments/edit/customattributes.xhtml" />

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
