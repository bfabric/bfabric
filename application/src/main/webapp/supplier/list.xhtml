<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('supplierReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.supplier}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/lazylist-with-create.xhtml">
      <ui:param
        name="tableType"
        value="supplier" />
      <ui:param
        name="tableContext"
        value="all" />
      <ui:param
        name="showColumns"
        value="name, companyId, phone, street, zip, city, country, room, supplement, url, contactName, contactPhone, contactEmail, description" />
      <ui:param
        name="buttonRendered"
        value="#{identityManager.hasCurrentUserRole('supplierManager')}" />
    </ui:include>
  </ui:define>
</ui:composition>
