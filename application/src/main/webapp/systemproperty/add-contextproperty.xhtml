<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('configurationManager')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.addContextProperty}" />
  </ui:define>

  <ui:define name="body">
    <o:importConstants type="org.bfabric.enums.ContextPropertyDiscriminator" />

    <h:form id="addContextProperty">
      <h:panelGrid
        columns="2"
        columnClasses="rtdm, ltd">
        <h:outputText value="#{messages.name}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:inputText
            id="contextPropertyValue"
            maxlength="256"
            value="#{systemPropertyManager.contextPropertyValue}"
            validator="#{stringHelper.validateNameValue}"
            styleClass="editWidthExtraLarge" />
        </ui:decorate>

        <h:outputText value="#{messages.type}" />
        <ui:decorate template="/fragments/required.xhtml">
          <h:selectOneMenu
            id="type"
            value="#{systemPropertyManager.contextPropertyDiscriminator}"
            required="true"
            styleClass="editWidthExtraLarge">
            <f:selectItem
              id="itemDeployer"
              itemLabel="#{messages.deployer}"
              itemValue="#{ContextPropertyDiscriminator.D}" />
            <f:selectItem
              id="itemEnvironment"
              itemLabel="#{messages.environment}"
              itemValue="#{ContextPropertyDiscriminator.E}" />
            <f:selectItem
              id="itemInstance"
              itemLabel="#{messages.instance}"
              itemValue="#{ContextPropertyDiscriminator.I}" />
          </h:selectOneMenu>
        </ui:decorate>
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{systemPropertyManager.saveContextProperty}"
          value="#{messages.save}"
          update="@form" />
        <p:commandButton
          action="#{systemPropertyManager.cancel}"
          value="#{messages.cancel}"
          immediate="true" />
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
