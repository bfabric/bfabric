<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column
    field="#{fieldPrefix}id"
    headerText="#{messages.workunit} #{messages.id}">
    <p:link
      outcome="/workunit/assignSamples.xhtml"
      value="#{entity.id}"
      title="#{messages.assignSampleHint}">
      <f:param
        name="id"
        value="#{entity.id}" />
    </p:link>
  </p:column>
  <ui:include src="/workunit/columns.xhtml">
    <ui:param
      name="hideColumns"
      value="basket, entityId, createdBy, createdOn" />
  </ui:include>
</ui:composition>
