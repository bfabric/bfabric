<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <h:panelGroup rendered="#{configuration.labEnabled and sidebarHelper.isTab('finishrun') and identityManager.hasCurrentUserRole('labManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableContext"
        value="nonFinished" />
      <ui:param
        name="tableType"
        value="run" />
      <ui:param
        name="tableContent"
        value="#{runList.getNonFinishedRuns(identityManager.currentUser.id)}" />
    </ui:include>
  </h:panelGroup>
</ui:composition>
