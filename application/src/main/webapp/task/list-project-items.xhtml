<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <h:panelGroup rendered="#{not empty tasksList and (tasksRendered or identityManager.hasCurrentUserRole('containerManager'))}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="project" />
      <ui:param
        name="tableContext"
        value="#{tasksId}" />
      <ui:param
        name="tableContent"
        value="#{tasksList}" />
      <ui:param
        name="hideColumns"
        value="#{hideColumns}, totalBookedCharges, totalBillableCharges, failedWorkunitsCount, department, institute, division, createdBy, createdOn, customAttributes" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </h:panelGroup>
</ui:composition>
