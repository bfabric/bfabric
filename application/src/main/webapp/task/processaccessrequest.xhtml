<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <h:panelGroup rendered="#{configuration.accessRequestEnabled and sidebarHelper.isTab('processaccessrequest') and identityManager.hasCurrentUserRole('accessRequestManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="accessrequest" />
      <ui:param
        name="tableContext"
        value="processaccessrequest" />
      <ui:param
        name="tableContent"
        value="#{accessRequestList.processAccessRequestTasksLazyModel}" />
      <ui:param
        name="hideColumns"
        value="status, modifiedBy, modifiedOn, createdBy, createdOn" />
    </ui:include>
  </h:panelGroup>
</ui:composition>
