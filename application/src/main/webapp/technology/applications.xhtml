<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('applications') and not empty technology.applications}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="application" />
      <ui:param
        name="tableContext"
        value="#{technology.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{technology.applications}" />
      <ui:param
        name="hideColumns"
        value="technology" />
    </ui:include>
  </c:if>
</ui:composition>
