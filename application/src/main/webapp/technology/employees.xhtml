<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('employees')}">
    <!--@elvariable id="entity" type="org.bfabric.entity.User"-->
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="user" />
      <ui:param
        name="tableContext"
        value="#{technology.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{technology.employees}" />
      <ui:param
        name="include"
        value="/user/columns-reduced.xhtml" />
      <ui:param
        name="styleClass"
        value="column-width-auto" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.unitHead ? 'background-yellow' : ''}" />
      <ui:param
        name="rowTitle"
        value="#{entity.unitHead ? messages.technologyHeadHint : ''}" />
      <ui:param
        name="paginator"
        value="false" />
    </ui:include>
  </c:if>
</ui:composition>
