<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('instrumentreservations')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="instrumentreservation" />
      <ui:param
        name="tableContext"
        value="#{technology.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{instrumentReservationList.getLazyModelByTechnology(technology)}" />
      <ui:param
        name="hideColumn"
        value="selectCheckbox" />
    </ui:include>
  </c:if>
</ui:composition>
