<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('purchases') and not empty technology.purchases}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="purchase" />
      <ui:param
        name="tableContext"
        value="#{technology.tableContext}" />

        name="tableContent"
        value="#{technology.purchases}" />
    </ui:include>
  </c:if>
</ui:composition>
