<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <p:column style="min-width:250px;" headerText="#{messages.departments}">
    <ui:include src="/fragments/entity-link-displayname.xhtml">
      <ui:param
        name="instance"
        value="#{entity}" />
    </ui:include>
  </p:column>
  <p:column>
    <f:facet name="header">
      <p:commandButton
        action="#{unassignedObjectsService.deleteUnassignedDepartmentsAndRedirect}"
        value="#{messages.deleteAll}"
        update="pageTitle, deleteUnassignedObjects"
        styleClass="inlinemiddle" />
    </f:facet>
    <p:commandButton
      action="#{unassignedObjectsService.deleteUnassignedDepartmentAndRedirect(entity.id)}"
      value="#{messages.delete}"
      update="pageTitle, deleteUnassignedObjects"
      styleClass="inlinemiddle" />
  </p:column>
</ui:composition>
