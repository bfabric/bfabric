<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('accessrequests') and user.updatable}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="accessrequest" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{accessRequestList.getLazyModelByUserId(user.id)}" />
    </ui:include>
  </c:if>
</ui:composition>
