  xmlns:f="http://xmlns.jcp.org/jsf/core">

    <f:viewParam
      id="codeId"
      name="code"
      value="#{userAccountManager.code}"
      required="true" />
    <f:viewParam
      id="userId"
      name="id"
      value="#{userAccountManager.id}"
      required="true" />
    <f:viewAction action="#{userAccountManager.activate}" />
  </f:metadata>
</ui:composition>
