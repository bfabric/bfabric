<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui">
  <!--@elvariable id="entity" type="org.bfabric.entity.User"-->
  <p:column
    rendered="#{showColumns.contains('addCheckbox')}"
    exportable="false">
    <h:selectBooleanCheckbox disabled="#{userManager.selectedUsers.contains(entity)}">
      <p:ajax
        listener="#{userManager.selectUser(entity)}"
        update="@([id$=assign-trainedinstruments-users-options]), @([id$=assign-trainedinstruments-users-options-selected]), @([id$=assign-trainedinstruments-users-options-selected-text]) @([id$=buttons])"
        process="@([id$=assign-trainedinstruments-users-options]), @([id$=assign-trainedinstruments-users-options-selected])"
        immediate="true"
        oncomplete="if(PF['selectedUser']){PF('selectedUser').filter();} fixOversize();"
        global="false" />
    </h:selectBooleanCheckbox>
  </p:column>
  <p:column
    rendered="#{showColumns.contains('removeCheckbox')}"
    exportable="false">
    <h:selectBooleanCheckbox value="#{userManager.userSelected}">
      <p:ajax
        listener="#{userManager.deselectUser(entity)}"
        update="@([id$=assign-trainedinstruments-users-options]), @([id$=assign-trainedinstruments-users-options-selected]), @([id$=assign-trainedinstruments-users-options-selected-text]) @([id$=buttons])"
        process="@([id$=assign-trainedinstruments-users-options]), @([id$=assign-trainedinstruments-users-options-selected])"
        immediate="true"
        oncomplete="if(PF['selectedUser']){PF('selectedUser').filter();} fixOversize();"
        global="false" />
    </h:selectBooleanCheckbox>
  </p:column>
  <ui:include src="/user/columns.xhtml">
    <ui:param
      name="hideColumns"
      value="division, institute, emailActive, emailAddress, emailVerified, computerLoginEnabled, dataAccessEnabled, computerLoginActivated, massMailEnabled, invalidLoginAttempts, LastLoginDate, LastActionTime, createdBy, createdOn" />
    <ui:param
      name="firstNameStyleClass"
      value="min-width-150" />
    <ui:param
      name="lastNameStyleClass"
      value="min-width-150" />
  </ui:include>
</ui:composition>
