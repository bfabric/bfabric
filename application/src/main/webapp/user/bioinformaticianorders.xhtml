<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('bioinformaticianorders') and identityManager.hasCurrentUserRole('userManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="order" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}_bioinformatician" />
      <ui:param
        name="tableContent"
        value="#{orderList.getBioinformaticianOrdersLazyModelByUserId(user.id)}" />
    </ui:include>
  </c:if>
</ui:composition>
