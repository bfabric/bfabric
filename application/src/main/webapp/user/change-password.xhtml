<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:event
      type="preRenderView"
      listener="#{identityManager.restrict(user.changePasswordAllowed)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.changePassword}" />
  </ui:define>

  <ui:define name="body">
    <h:form id="#{constants.EDIT}">
      <h:panelGrid
        columns="2"
        columnClasses="rtdm, ltd">
        <h:outputText value="#{messages.user}" />
        <ui:decorate template="/fragments/display.xhtml">
          <h:outputText value="#{user.name} (#{user.login})" />
        </ui:decorate>

        <h:outputText
          value="#{messages.oldPassword}"
          rendered="#{configuration.askOldPasswordOnChangeRequest and user.managed and not user.hasRoleUserManager()}" />
        <h:panelGrid rendered="#{configuration.askOldPasswordOnChangeRequest and user.managed and not user.hasRoleUserManager()}">
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputSecret
              id="oldPassword"
              converter="charArrayConverter"
              value="#{userManager.oldPassword}"
              validator="#{user.validateOldPassword}"
              maxlength="32"
              styleClass="editWidthExtraLarge">
            </h:inputSecret>
          </ui:decorate>
        </h:panelGrid>

        <h:outputText value="&#160;" />
        <ui:decorate template="/fragments/display.xhtml">
          <h:outputText
            value="#{messages.passwordHint}"
            styleClass="pending" />
        </ui:decorate>

        <h:outputText value="#{messages.newPassword}" />
        <ui:decorate template="/fragments/required.xhtml">
          <p:password
            id="newPassword"
            converter="charArrayConverter"
            value="#{userManager.password}"
            validator="#{user.validatePassword}"
            maxlength="32"
            styleClass="editWidthExtraLarge">
            <f:attribute
              name="loginId"
              value="" />
            <f:attribute
              name="firstNameId"
              value="" />
            <f:attribute
              name="lastNameId"
              value="" />
          </p:password>
        </ui:decorate>

        <h:outputText value="#{messages.confirmNewPassword}" />
        <ui:decorate template="/fragments/required.xhtml">
          <p:password
            id="confirmNewPassword"
            converter="charArrayConverter"
            value="#{userManager.confirmPassword}"
            validator="#{user.validateConfirmPassword}"
            autocomplete="off"
            maxlength="32"
            styleClass="editWidthExtraLarge">
            <f:attribute
              name="loginId"
              value="" />
            <f:attribute
              name="firstNameId"
              value="" />
            <f:attribute
              name="lastNameId"
              value="" />
          </p:password>
        </ui:decorate>
      </h:panelGrid>

      <h:panelGrid
        columns="2"
        styleClass="action">
        <p:commandButton
          action="#{userManager.savePassword}"
          value="#{messages.save}"
          update="@form" />
        <p:commandButton
          action="#{userManager.cancel}"
          value="#{messages.cancel}"
          immediate="true" />
      </h:panelGrid>
    </h:form>
  </ui:define>
</ui:composition>
