<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('chargercharges') and (identityManager.hasCurrentUserRole('containerReader') or user.equals(currentUser))}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="charge" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}_created" />
      <ui:param
        name="tableContent"
        value="#{chargeList.getLazyModelByChargerId(user.id)}" />
      <ui:param
        name="hideColumns"
        value="discountedPrice, chargeDiscount, orderDiscount, taxType" />
    </ui:include>
  </c:if>
</ui:composition>
