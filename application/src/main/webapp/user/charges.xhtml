<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('charges') and (identityManager.hasCurrentUserRole('containerManager') or user.equals(currentUser))}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="charge" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}_budgetofficer" />
      <ui:param
        name="tableContent"
        value="#{chargeList.getLazyModelByContainerBudgetOfficerId(user.id)}" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
