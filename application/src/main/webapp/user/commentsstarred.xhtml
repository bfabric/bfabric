<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('commentsstarred') and (identityManager.hasCurrentUserRole('containerReader') or user.equals(currentUser))}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="comment" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{commentList.getLazyModelByUserIdStarred(user.id)}" />
    </ui:include>
  </c:if>
</ui:composition>
