<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('credits') and (identityManager.hasCurrentUserRole('employeeManager') or user.equals(currentUser)) and user.hasRoleEmployee()}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="credit" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{creditList.getLazyModelByUserId(user.id)}" />
    </ui:include>
  </c:if>
</ui:composition>
