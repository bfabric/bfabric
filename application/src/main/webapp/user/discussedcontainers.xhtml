<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('discussedcontainers') and identityManager.hasCurrentUserRole('userManager')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="container" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}_discussed" />
      <ui:param
        name="tableContent"
        value="#{containerList.getLazyDataModelByDiscussedWith(user.id)}" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </c:if>
</ui:composition>
