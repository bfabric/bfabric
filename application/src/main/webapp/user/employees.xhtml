<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('employeeReader')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.employees}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="user" />
      <ui:param
        name="tableContext"
        value="employee" />
      <ui:param
        name="tableContent"
        value="#{userList.employees}" />
      <ui:param
        name="hideColumns"
        value="entityId, company, division, computerLoginActivated, invalidLoginAttempts, LastLoginDate, LastActionTime" />
      <ui:param
        name="showColumns"
        value="empDegree, creditsTotal, accountedDays, remainingDays, creditsYearly, birthDay, age, homeAddress, homeCity, homePhone" />
    </ui:include>
  </ui:define>
</ui:composition>
