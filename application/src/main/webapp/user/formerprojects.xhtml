<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('formerprojects') and user.identityUserOrUserManager}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="project" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}_former" />
      <ui:param
        name="tableContent"
        value="#{projectList.getFormerProjectsLazyModelByUserId(user.id)}" />
    </ui:include>
  </c:if>
</ui:composition>
