<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('instrumentreservations') and user.identityUserOrUserManager}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="instrumentreservation" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{instrumentReservationList.getLazyModelByUserId(user.id)}" />
    </ui:include>
    <h:panelGrid
      columns="3"
      styleClass="action">
      <ui:include src="/fragments/sync-instrumentreservations-button.xhtml">
        <ui:param
          name="callerEntity"
          value="#{user}" />
        <ui:param
          name="contextManager"
          value="#{contextManager}" />
      </ui:include>
      <ui:include src="/fragments/sync-button.xhtml">
        <ui:param
          name="callerEntity"
          value="#{user}" />
        <ui:param
          name="contextManager"
          value="#{contextManager}" />
        <ui:param
          name="urlContainingToken"
          value="#{user.urlCalendarForUserInstrumentReservations}" />
      </ui:include>
      <p:button
        outcome="/eventschedule/show.xhtml"
        value="#{messages.schedule}"
        rendered="#{user.eventScheduleRendered}">
        <f:param
          name="userId"
          value="#{user.id}" />
        <f:param
          name="view"
          value="instrumentreservations" />
      </p:button>
    </h:panelGrid>
  </c:if>
</ui:composition>
