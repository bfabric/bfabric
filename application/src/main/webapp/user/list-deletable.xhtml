<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('admin')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.deletable} #{messages.users}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="user" />
      <ui:param
        name="tableContext"
        value="deletable" />
      <ui:param
        name="tableContent"
        value="#{userList.deletableUsers}" />
      <ui:param
        name="hideColumns"
        value="deletable" />
    </ui:include>

    <h:panelGrid
      columns="1"
      styleClass="action"
      rendered="#{not empty userList.deletableUsers}">
      <h:form>
        <p:commandButton
          action="#{userManager.deleteDeletableUsers}"
          value="#{messages.deleteAll}"
          title="#{messages.deleteDeletableUsersHint}"
          update="@form" />
      </h:form>
    </h:panelGrid>
  </ui:define>
</ui:composition>
