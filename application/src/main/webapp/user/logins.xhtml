<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('admin')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.loggedInUsers}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="user" />
      <ui:param
        name="tableContext"
        value="login" />
      <ui:param
        name="tableContent"
        value="#{userManager.loggedInUsers}" />
      <ui:param
        name="hideColumns"
        value="backup, active, emailVerified, dataAccessEnabled, computerLoginActivated, computerLoginEnabled, massMailEnabled, invalidLoginAttempts, company, division, institute, department, organization" />
    </ui:include>
  </ui:define>
</ui:composition>
