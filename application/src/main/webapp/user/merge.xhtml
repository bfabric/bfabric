<ui:composition

  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"

    <h:outputText value="#{messages.mergeUsers}" />
  </ui:define>

        columnClasses=", textright padding-right-small, , textleft"

            name="instance"
            value="#{userMergeManager.userLeft}" />

        <h:outputText value="" />
        <ui:include src="/fragments/user-link.xhtml">
          <ui:param
            name="instance"
            value="#{userMergeManager.merged}" />
        </ui:include>

        <h:outputText value="#{messages.login}" />
        <h:outputText value="#{userMergeManager.userLeft.login}" />
        <h:selectOneRadio
          id="login"
          layout="lineDirection"
          value="#{userMergeManager.mergeSelection.login}">
          <f:selectItem itemValue="#{userMergeManager.userLeft.login}" />
          <f:selectItem itemValue="#{userMergeManager.merged.login}" />
        </h:selectOneRadio>
        <h:outputText value="#{userMergeManager.merged.login}" />

        <h:outputText value="#{messages.password}" />
        <h:outputText value="#{stringHelper.truncate(userMergeManager.userLeft.password, 32)}" title="#{userMergeManager.userLeft.password}" />

        <h:outputText value="#{stringHelper.truncate(userMergeManager.merged.password, 32)}" title="#{userMergeManager.merged.password}" />

          id="accountEnabled"
          layout="lineDirection"
          value="#{userMergeManager.mergeSelection.accountEnabled}"
          disabled="#{userMergeManager.userLeft.accountEnabled == userMergeManager.merged.accountEnabled}">
          <f:selectItem itemValue="#{userMergeManager.userLeft.accountEnabled}" />
          <f:selectItem itemValue="#{userMergeManager.merged.accountEnabled}" />
        </h:selectOneRadio>
        <h:outputText value="#{userMergeManager.merged.accountEnabled}" />

            id="title"
            layout="lineDirection"
            value="#{userMergeManager.mergeSelection.title}"
            disabled="#{userMergeManager.userLeft.title == userMergeManager.merged.title}">
            <f:selectItem itemValue="#{userMergeManager.userLeft.title}" />
            <f:selectItem itemValue="#{userMergeManager.merged.title}" />
          </h:selectOneRadio>
          <h:outputText value="#{userMergeManager.merged.title}" />
