<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui"
  template="/layout/template.xhtml">
  <ui:define name="pageTitle">
    <h:outputText value="#{messages.forgotLoginDetails}" />
  </ui:define>

  <ui:define name="body">
    <div>
      <p>Provide your login name or email address you used for the registration to receive an email with a link to reset your password. If you have forgotten both or you have no access anymore to your registered email, please contact
        <a
          href="mailto:#{configuration.supportEmail}">support</a>.</p>

      <h:form id="password-lost">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText
            value="#{messages.loginOrEmail}"
            styleClass="extraBottomMargin" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="loginOrEmail"
              value="#{userAccountManager.loginOrEmail}"
              autocomplete="off"
              required="true"
              styleClass="editWidthMedium" />
          </ui:decorate>

          <c:if test="#{not configuration.environmentLocal}">
            <h:outputText />
            <ui:decorate template="/fragments/edit.xhtml">
              <p:captcha
                id="captcha"
                requiredMessage="#{messages.captchaError}" />
            </ui:decorate>
          </c:if>

          <h:outputText />
          <ui:decorate template="/fragments/display.xhtml">
            <p:commandButton
              action="#{userAccountManager.requestPasswordReset}"
              value="#{messages.requestPasswordReset}"
              title="#{messages.requestPasswordResetHint}"
              styleClass="margin-top-8"
              update="@form" />
          </ui:decorate>
        </h:panelGrid>
      </h:form>
    </div>
  </ui:define>
</ui:composition>
