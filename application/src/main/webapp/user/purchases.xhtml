<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('purchases') and (identityManager.hasCurrentUserRole('bookingManager') or user.equals(currentUser)) and user.hasRoleEmployee()}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="purchase" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}_all" />
      <ui:param
        name="tableContent"
        value="#{purchaseList.getLazyModelByUserId(user.id)}" />
    </ui:include>
  </c:if>
</ui:composition>
