<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('services') and identityManager.hasCurrentUserRole('containerReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="service" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{user.services}" />
      <ui:param
        name="hideColumns"
        value="parent" />
      <ui:param
        name="showColumns"
        value="internal" />
    </ui:include>
  </c:if>
</ui:composition>
