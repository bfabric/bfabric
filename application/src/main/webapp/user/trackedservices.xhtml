<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('trackedservices') and identityManager.hasCurrentUserRole('serviceReader')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="service" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}_tracked" />
      <ui:param
        name="tableContent"
        value="#{user.trackedServices}" />
    </ui:include>
  </c:if>
</ui:composition>
