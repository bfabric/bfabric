<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html">
  <h:panelGroup rendered="#{sidebarHelper.isTab('workunits') and user.identityUserOrUserManager}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workunit" />
      <ui:param
        name="tableContext"
        value="#{user.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{workunitList.getLazyModelContainerDependentByContainerIds(user.containerIds)}" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>
  </h:panelGroup>
</ui:composition>
