<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{userGroupManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{userGroup.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="description"
              value="#{userGroup.description}"
              rows="2"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <ui:include src="/fragments/supervisor-autocomplete-required.xhtml">
            <ui:param
              name="instance"
              value="#{userGroup}" />
            <ui:param
              name="styleClass"
              value="editWidthExtraLarge" />
          </ui:include>

          <h:outputText value="#{messages.members}" />
          <ui:include src="/fragments/autocomplete-required.xhtml">
            <ui:param
              name="listContext"
              value="userGroup" />
            <ui:param
              name="value"
              value="#{userGroup.usersAsList}" />
            <o:methodParam
              name="completeMethod"
              value="#{userGroupManager.getUsers}" />
            <ui:param
              name="itemLabel"
              value="#{item.name}" />
            <ui:param
              name="multiple"
              value="true" />
            <ui:param
              name="styleClass"
              value="editWidthExtraLarge" />
          </ui:include>

          <h:outputText value="#{messages.forEmployeesOnly}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="forEmployeesOnly"
              value="#{userGroup.forEmployeesOnly}"
              title="#{messages.editUserGroupForEmployeesOnlyHint}"
              valueChangeListener="#{userGroup.forEmployeesOnlyChanged}"
              immediate="true">
              <p:ajax
                event="change"
                update="userGroupautocomplete" />
            </h:selectBooleanCheckbox>
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{userGroup.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.internal}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="internal"
              value="#{userGroup.internal}"
              title="#{messages.editUserGroupInternalHint}" />
          </ui:decorate>

          <h:outputText value="#{messages.hidden}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="hidden"
              value="#{userGroup.hidden}"
              title="#{messages.editUserGroupHiddenHint}" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          columns="1"
          columnClasses="rtdm, ltd">
          <ui:include src="/fragments/select-affiliations.xhtml">
            <ui:param
              name="callerEntity"
              value="#{userGroup}" />
            <ui:param
              name="required"
              value="false" />
          </ui:include>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
