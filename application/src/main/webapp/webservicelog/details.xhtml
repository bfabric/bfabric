<ui:composition

  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id.xhtml" />
      <ui:include src="/fragments/details/status.xhtml" />
      <ui:include src="/fragments/details/entityClassName.xhtml" />
      <ui:include src="/fragments/details/action.xhtml" />
      <ui:include src="/fragments/details/log.xhtml" />
      <ui:include src="/fragments/details/duration.xhtml" />
      <ui:include src="/fragments/details/created.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="1"
      styleClass="action">
      <ui:include src="/fragments/button/list.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
