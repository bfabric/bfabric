<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html">
  <ui:param name="entityManager" value="#{widgetTypeManager}" />
  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid columns="2" columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText id="#{constants.NAME}" value="#{widgetType.name}" styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.columns}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="columns" value="#{widgetType.columns}" />
          </ui:decorate>

          <h:outputText value="#{messages.decimalPlaces}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="decimalPlaces" value="#{widgetType.decimalPlaces}" />
          </ui:decorate>

          <h:outputText value="#{messages.maxValue}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="maxValue" value="#{widgetType.maxValue}" />
          </ui:decorate>

          <h:outputText value="#{messages.minValue}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="minValue" value="#{widgetType.minValue}" />
          </ui:decorate>

          <h:outputText value="#{messages.rows}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="rows" value="#{widgetType.rows}" />
          </ui:decorate>

          <h:outputText value="#{messages.step}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="step" value="#{widgetType.step}" />
          </ui:decorate>

          <h:outputText value="#{messages.symbol}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="symbol" value="#{widgetType.symbol}" />
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox id="enabled" value="#{widgetType.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea id="description" value="#{widgetType.description}" rows="3" styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>
        <h:panelGrid columns="2" styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
