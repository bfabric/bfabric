<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:o="http://omnifaces.org/ui"
                template="/layout/template.xhtml">
  <f:metadata>
    <f:event type="preRenderView" listener="#{identityManager.restrict(workflow.editable)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{empty workflow.plates ? messages.assignPlates : messages.reassignPlates}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-assign.xhtml">
      <ui:param name="entityName" value="#{messages.plates}" />
      <ui:param name="onSubmit" value="#{workflowManager.resetRefererURL()}" />
      <ui:param name="tableType" value="plate" />
      <!-- Parameters for the source table -->
      <ui:param name="sourceTableContent" value="#{plateList.lazyModel}" />
      <ui:param name="addButtonDisabled" value="#{workflowManager.selectedPlates.contains(entity)}" />
      <ui:param name="addAllButtonListener" value="#{dataTableHelper.addAllEntitiesFromDataTableToSelection(workflowManager.selectedPlates)}" />
      <ui:param name="addButtonListener" value="#{workflowManager.addPlateToSelection(entity)}" />
      <!-- Parameters for the target table -->
      <ui:param name="targetTableContent" value="#{workflowManager.selectedPlates}" />
      <ui:param name="removeAllButtonListener" value="#{dataTableHelper.removeAllEntitiesFromSelection(workflowManager.selectedPlates)}" />
      <ui:param name="removeButtonListener" value="#{dataTableHelper.removeEntityFromSelection(workflowManager.selectedPlates, entity)}" />
      <ui:param name="rowStyleClass" value="#{entity.rowStyleClass}" />
      <!-- Parameters for the assignment actions -->
      <o:methodParam name="saveAction" value="#{workflowManager.assignPlates}" />
      <o:methodParam name="cancelAction" value="#{workflowManager.cancel}" />
    </ui:include>
  </ui:define>
</ui:composition>
