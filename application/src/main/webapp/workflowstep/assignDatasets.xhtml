<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:o="http://omnifaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:event
      type="preRenderView"
      listener="#{identityManager.restrict(workflowStep.editable)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{empty workflowStep.datasets ? messages.assignDatasets : messages.reassignDatasets}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-assign.xhtml">
      <ui:param
        name="entityName"
        value="#{messages.datasets}" />
      <ui:param
        name="onSubmit"
        value="#{workflowStepManager.resetRefererURL()}" />
      <ui:param
        name="tableType"
        value="dataset" />
      <!-- Parameters for the source table -->
      <ui:param
        name="sourceTableContent"
        value="#{datasetList.lazyModel}" />
      <ui:param
        name="addButtonDisabled"
        value="#{workflowStepManager.selectedDatasets.contains(entity)}" />
      <ui:param
        name="addAllButtonListener"
        value="#{dataTableHelper.addAllEntitiesFromDataTableToSelection(workflowStepManager.selectedDatasets)}" />
      <ui:param
        name="addButtonListener"
        value="#{workflowStepManager.addDatasetToSelection(entity)}" />
      <!-- Parameters for the target table -->
      <ui:param
        name="targetTableContent"
        value="#{workflowStepManager.selectedDatasets}" />
      <ui:param
        name="removeAllButtonListener"
        value="#{dataTableHelper.removeAllEntitiesFromSelection(workflowStepManager.selectedDatasets)}" />
      <ui:param
        name="removeButtonListener"
        value="#{dataTableHelper.removeEntityFromSelection(workflowStepManager.selectedDatasets, entity)}" />
      <!-- Parameters for the assignment actions -->
      <o:methodParam
        name="saveAction"
        value="#{workflowStepManager.assignDatasets}" />
      <o:methodParam
        name="cancelAction"
        value="#{workflowStepManager.cancel}" />
    </ui:include>
  </ui:define>
</ui:composition>
