<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:o="http://omnifaces.org/ui"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:event
      type="preRenderView"
      listener="#{identityManager.restrict(workflowStep.editable)}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{empty workflowStep.workunits ? messages.assignWorkunits : messages.reassignWorkunits}" />
  </ui:define>

  <ui:define name="body">
    <ui:include src="/fragments/show-assign.xhtml">
      <ui:param
        name="entityName"
        value="#{messages.workunits}" />
      <ui:param
        name="onSubmit"
        value="#{workflowStepManager.resetRefererURL()}" />
      <ui:param
        name="tableType"
        value="workunit" />
      <ui:param
        name="hideColumns"
        value="basket" />
      <!-- Parameters for the source table -->
      <ui:param
        name="sourceTableContent"
        value="#{workunitList.lazyModel}" />
      <ui:param
        name="addButtonDisabled"
        value="#{workflowStepManager.selectedWorkunits.contains(entity)}" />
      <ui:param
        name="addAllButtonListener"
        value="#{dataTableHelper.addAllEntitiesFromDataTableToSelection(workflowStepManager.selectedWorkunits)}" />
      <ui:param
        name="addButtonListener"
        value="#{workflowStepManager.addWorkunitToSelection(entity)}" />
      <!-- Parameters for the target table -->
      <ui:param
        name="targetTableContent"
        value="#{workflowStepManager.selectedWorkunits}" />
      <ui:param
        name="removeAllButtonListener"
        value="#{dataTableHelper.removeAllEntitiesFromSelection(workflowStepManager.selectedWorkunits)}" />
      <ui:param
        name="removeButtonListener"
        value="#{dataTableHelper.removeEntityFromSelection(workflowStepManager.selectedWorkunits, entity)}" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
      <!-- Parameters for the assignment actions -->
      <o:methodParam
        name="saveAction"
        value="#{workflowStepManager.assignWorkunits}" />
      <o:methodParam
        name="cancelAction"
        value="#{workflowStepManager.cancel}" />
    </ui:include>
  </ui:define>
</ui:composition>
