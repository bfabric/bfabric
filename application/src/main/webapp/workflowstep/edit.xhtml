<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{workflowStepManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <o:importConstants type="org.bfabric.enums.StatusEnum" />

      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.workflowTemplate}" />
          <ui:decorate template="/fragments/display.xhtml">
            <h:outputText value="#{workflowStep.workflow.workflowTemplate.name}" />
          </ui:decorate>

          <h:outputText value="#{messages.workflowTemplateStep}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="workflowTemplateStep"
              value="#{workflowStep.workflowTemplateStep}"
              valueChangeListener="#{workflowStep.workflowTemplateStepChangeListener}"
              converter="omnifaces.SelectItemsConverter"
              styleClass="editWidthExtraLarge">
              <f:selectItem
                itemLabel="#{messages.selectAnItem}"
                itemDisabled="true" />
              <f:selectItems
                value="#{workflowStep.workflow.workflowTemplate.workflowTemplateSteps}"
                var="item"
                itemLabel="#{item.name}" />
              <p:ajax
                event="change"
                global="false"
                update="#{constants.EDIT}:workflowTemplateStepDescription, #{constants.EDIT}:expectedDuration, #{constants.EDIT}:samplePreparationProtocolautocomplete" />
            </h:selectOneMenu>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGroup id="workflowTemplateStepDescription">
          <h:panelGrid
            rendered="#{not empty workflowStep.workflowTemplateStep}"
            columns="2"
            columnClasses="rtdm, ltd">
            <h:outputText value="#{messages.description}" />
            <ui:decorate template="/fragments/display.xhtml">
              <h:outputText value="#{workflowStep.workflowTemplateStep.description}" />
            </ui:decorate>
          </h:panelGrid>
        </h:panelGroup>

        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.status}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:selectOneMenu
              id="status"
              value="#{workflowStep.status}"
              styleClass="editWidthExtraLarge">
              <f:selectItems
                value="#{workflowStepList.statusEnums}"
                var="item"
                itemLabel="#{item.label}" />
            </h:selectOneMenu>
          </ui:decorate>

          <ui:include src="/fragments/supervisor-autocomplete-required.xhtml">
            <ui:param
              name="instance"
              value="#{workflowStep}" />
          </ui:include>

          <h:outputText value="#{messages.startDateTime}" />
          <ui:decorate template="/fragments/required.xhtml">
            <p:datePicker
              id="startDateTime"
              value="#{workflowStep.startDateTime}" />
          </ui:decorate>

          <h:outputText value="#{messages.endDateTime}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <p:datePicker
              id="endDateTime"
              value="#{workflowStep.endDateTime}" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          id="expectedDurationGrid"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.expectedDuration}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputText
              id="expectedDuration"
              value="#{workflowStep.expectedDuration}"
              styleClass="editWidthExtraLarge">
            </h:inputText>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          id="samplePreparationProtocolGrid"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.samplePreparationProtocol}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="samplePreparationProtocol" />
              <ui:param
                name="value"
                value="#{workflowStep.samplePreparationProtocol}" />
              <o:methodParam
                name="completeMethod"
                value="#{workflowStepManager.getFilteredEnabledSamplePreparationProtocolsIncluding}" />
              <ui:param
                name="itemLabel"
                value="#{item.displayName}" />
            </ui:include>
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          id="commentGrid"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.comment}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="comment"
              value="#{workflowStep.comment.comment}"
              style="height: 150px; width: 450px;" />
          </ui:decorate>
          <h:outputText
            value="#{messages.attachments} " />
          <h:panelGroup>
            <ui:decorate template="/fragments/edit.xhtml">
              <h:panelGrid
                id="attachmentsGrid"
                columns="1">
                <ui:include src="/fragments/datatable.xhtml">
                  <ui:param
                    name="include"
                    value="/comment/attachment-columns.xhtml" />
                  <ui:param
                    name="tableContext"
                    value="comment" />
                  <ui:param
                    name="tableContent"
                    value="#{workflowStep.comment.attachments}" />
                  <ui:param
                    name="showColumns"
                    value="buttons" />
                  <ui:param
                    name="styleClass"
                    value="noborder hide-table-header" />
                  <ui:param
                    name="paginator"
                    value="false" />
                  <ui:param
                    name="editable"
                    value="true" />
                  <ui:param
                    name="styleClass"
                    value="inner" />
                </ui:include>
                <ui:include src="/fragments/edit/fileupload.xhtml">
                  <o:methodParam name="listener" value="#{fileUploadHelper.listener}" />
                  <ui:param name="update" value="attachmentsGrid" />
                  <ui:param name="multiple" value="true" />
                </ui:include>
                <ui:include src="/fragments/datatable.xhtml">
                  <ui:param
                    name="include"
                    value="/fragments/column/uploadfile.xhtml" />
                  <ui:param
                    name="tableContext"
                    value="uploadfile" />
                  <ui:param
                    name="tableContent"
                    value="#{fileUploadHelper.uploadedFiles}" />
                  <ui:param
                    name="showColumns"
                    value="buttons" />
                  <ui:param
                    name="styleClass"
                    value="noborder hide-table-header" />
                  <ui:param
                    name="paginator"
                    value="false" />
                  <ui:param
                    name="updateOnDelete"
                    value="@([id$=attachmentsGrid])" />
                </ui:include>
              </h:panelGrid>
            </ui:decorate>
          </h:panelGroup>

          <h:outputText value="#{messages.container} #{messages.filter}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="selectedcontainers" />
              <ui:param
                name="value"
                value="#{workflowStepManager.selectedContainersAsList}" />
              <ui:param
                name="multiple"
                value="true" />
              <o:methodParam
                name="completeMethod"
                value="#{workflowStepManager.getSelectableContainers}" />
              <ui:param
                name="itemLabel"
                value="#{item.id}" />
              <ui:param
                name="includeColumns"
                value="/container/autocomplete-columns.xhtml" />
              <ui:param
                name="styleClass"
                value="editWidthExtraLarge disableItems" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.datasets}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="dataset" />
              <ui:param
                name="value"
                value="#{workflowStep.datasetsAsList}" />
              <o:methodParam
                name="completeMethod"
                value="#{workflowStepManager.getDatasets}" />
              <ui:param
                name="itemLabel"
                value="#{item.displayName}" />
              <ui:param
                name="multiple"
                value="true" />
              <ui:param
                name="styleClass"
                value="editWidthHuge" />
              <ui:param
                name="includeColumns"
                value="/dataset/autocomplete-columns.xhtml" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.samples}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="sample" />
              <ui:param
                name="value"
                value="#{workflowStep.samplesAsList}" />
              <o:methodParam
                name="completeMethod"
                value="#{workflowStepManager.getSamples}" />
              <ui:param
                name="itemLabel"
                value="#{item.displayName}" />
              <ui:param
                name="multiple"
                value="true" />
              <ui:param
                name="styleClass"
                value="editWidthHuge" />
              <ui:param
                name="includeColumns"
                value="/sample/autocomplete-columns.xhtml" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.workunits}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="workunit" />
              <ui:param
                name="value"
                value="#{workflowStep.workunitsAsList}" />
              <o:methodParam
                name="completeMethod"
                value="#{workflowStepManager.getWorkunits}" />
              <ui:param
                name="itemLabel"
                value="#{item.displayName}" />
              <ui:param
                name="multiple"
                value="true" />
              <ui:param
                name="styleClass"
                value="editWidthHuge" />
              <ui:param
                name="includeColumns"
                value="/workunit/autocomplete-columns.xhtml" />
            </ui:include>
          </ui:decorate>

          <h:outputText value="#{messages.plates}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <ui:include src="/fragments/autocomplete.xhtml">
              <ui:param
                name="listContext"
                value="plate" />
              <ui:param
                name="value"
                value="#{workflowStep.platesAsList}" />
              <o:methodParam
                name="completeMethod"
                value="#{workflowStepManager.getPlates}" />
              <ui:param
                name="itemLabel"
                value="#{item.displayName}" />
              <ui:param
                name="multiple"
                value="true" />
              <ui:param
                name="styleClass"
                value="editWidthHuge" />
              <ui:param
                name="includeColumns"
                value="/plate/autocomplete-columns.xhtml" />
            </ui:include>
          </ui:decorate>
        </h:panelGrid>

        <ui:include src="/fragments/edit/customattributes.xhtml" />

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
