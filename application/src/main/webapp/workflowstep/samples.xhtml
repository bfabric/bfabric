<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('samples')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="sample" />
      <ui:param
        name="tableContext"
        value="#{workflowStep.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{workflowStep.samples}" />
      <ui:param
        name="hideColumns"
        value="workflowstep" />
      <ui:param
        name="rowStyleClass"
        value="#{entity.rowStyleClass}" />
    </ui:include>

    <h:form>
      <h:panelGrid
        columns="1"
        styleClass="action">
        <p:button
          rendered="#{workflowStep.editable}"
          outcome="assignSamples.xhtml"
          value="#{empty workflowStep.samples ? messages.assignSamples : messages.reassignSamples}">
          <f:param
            name="id"
            value="#{workflowStep.id}" />
        </p:button>
      </h:panelGrid>
    </h:form>
  </c:if>
</ui:composition>
