<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />
      <ui:include src="/fragments/details/servicetypes.xhtml" />
      <ui:include src="/fragments/details/description-enabled-links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="3"
      styleClass="action">
      <ui:include src="/fragments/button/edit-delete-list.xhtml" />
    </h:panelGrid>

    <h:panelGrid styleClass="content-subheader">
      <h:outputText value="#{messages.steps} (#{workflowTemplate.workflowTemplateSteps.size()})" />
    </h:panelGrid>

    <h:panelGroup>
      <h:outputText
        value="#{messages.noStepsYet}"
        styleClass="pending"
        rendered="#{empty workflowTemplate.workflowTemplateSteps}" />

      <ui:include src="/fragments/show-datatable.xhtml">
        <ui:param
          name="tableType"
          value="workflowtemplatestep" />
        <ui:param
          name="tableContext"
          value="workflowTemplate" />
        <ui:param
          name="tableContent"
          value="#{workflowTemplate.workflowTemplateSteps}" />
        <ui:param
          name="hideColumns"
          value="workflowTemplateParent" />
      </ui:include>

      <h:panelGrid
        columns="4"
        styleClass="action">
        <p:button
          outcome="/workflowtemplatestep/edit.xhtml"
          value="#{messages.createStep}"
          rendered="#{workflowTemplate.updatable}">
          <f:param
            name="workflowTemplateId"
            value="#{workflowTemplate.id}" />
        </p:button>
        <h:form rendered="#{not empty workflowTemplate.workflowTemplateSteps}">
          <p:commandButton
            rendered="#{workflowTemplate.lastWorkflowTemplateStep.deletable}"
            action="#{workflowTemplateManager.remove(workflowTemplate.lastWorkflowTemplateStep)}"
            value="#{messages.delete} #{messages.step} '#{workflowTemplate.lastWorkflowTemplateStep.displayName}'"
            title="#{messages.deleteLastWorkflowTemplateStepHint}" />
        </h:form>
      </h:panelGrid>
    </h:panelGroup>
  </c:if>
</ui:composition>
