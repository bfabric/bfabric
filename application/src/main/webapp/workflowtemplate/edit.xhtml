<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:o="http://omnifaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{workflowTemplateManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{workflowTemplate.name}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{workflowTemplate.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.serviceTypes}" />
          <h:panelGroup>
            <ui:decorate template="/fragments/edit.xhtml">
              <ui:include src="/fragments/autocomplete.xhtml">
                <ui:param
                  name="listContext"
                  value="selectedservicetypes" />
                <ui:param
                  name="value"
                  value="#{workflowTemplate.serviceTypesAsList}" />
                <ui:param
                  name="multiple"
                  value="true" />
                <o:methodParam
                  name="completeMethod"
                  value="#{workflowTemplateManager.getServiceTypesFiltered}" />
                <ui:param
                  name="itemLabel"
                  value="#{item.displayName}" />
              </ui:include>
            </ui:decorate>
          </h:panelGroup>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:decorate>
</ui:composition>
