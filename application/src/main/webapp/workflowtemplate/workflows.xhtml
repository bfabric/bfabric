<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('workflows') and identityManager.hasCurrentUserRole('containerReader') and not empty workflowTemplate.workflows}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workflow" />
      <ui:param
        name="tableContext"
        value="#{workflowTemplate.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{workflowTemplate.workflows}" />
      <ui:param
        name="hideColumns"
        value="workflowTemplate" />
    </ui:include>
  </c:if>
</ui:composition>
