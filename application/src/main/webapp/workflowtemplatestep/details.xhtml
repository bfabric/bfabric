<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.details}">
    <h:panelGrid
      columns="2"
      columnClasses="rtd, ltd">
      <ui:include src="/fragments/details/id-name.xhtml" />
      <ui:include src="/fragments/details/workflowtemplate.xhtml" />
      <ui:include src="/fragments/details/description.xhtml" />

      <h:outputText value="#{messages.expectedDuration}" />
      <h:outputText value="#{workflowTemplateStep.expectedDuration}" />

      <h:outputText value="#{messages.runsPerProcess}" />
      <h:outputText value="#{workflowTemplateStep.runsPerProcess}" />

      <h:outputText value="#{messages.samplesPerProcess}" />
      <h:outputText value="#{workflowTemplateStep.samplesPerProcess}" />

      <ui:include src="/fragments/details/samplepreparationprotocol.xhtml" />
      <ui:include src="/fragments/details/enabled.xhtml" />
      <ui:include src="/fragments/details/links-customattributes-created-modified.xhtml" />
    </h:panelGrid>

    <h:panelGrid
      columns="3"
      styleClass="action">
      <ui:include src="/fragments/button/edit.xhtml" />
      <ui:include src="/fragments/button/delete.xhtml" />
    </h:panelGrid>
  </c:if>
</ui:composition>
