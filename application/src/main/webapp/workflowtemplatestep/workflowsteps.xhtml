<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('workflowsteps') and identityManager.hasCurrentUserRole('containerReader') and not empty workflowTemplateStep.workflowSteps}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="workflowstep" />
      <ui:param
        name="tableContext"
        value="#{workflowTemplateStep.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{workflowTemplateStep.workflowSteps}" />
      <ui:param
        name="hideColumns"
        value="workflowTemplateStep, workflowTemplate" />
    </ui:include>
  </c:if>
</ui:composition>
