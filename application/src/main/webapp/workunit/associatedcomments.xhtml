<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('associatedComments')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="comment" />
      <ui:param
        name="tableContext"
        value="all" />
      <ui:param
        name="tableContent"
        value="#{workunit.associatedComments}" />
      <ui:param
        name="hideColumns"
        value="discriminator, parentClassName" />
    </ui:include>
  </c:if>
</ui:composition>
