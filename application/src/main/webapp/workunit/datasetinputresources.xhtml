<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('datasetinputresources') and not empty workunit.inputDataset}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="resource" />
      <ui:param
        name="tableContext"
        value="#{workunit.tableContext}_inputdataset" />
      <ui:param
        name="tableContent"
        value="#{workunit.inputDataset.inputResources}" />
      <ui:param
        name="hideColumns"
        value="project,checksum" />
    </ui:include>
  </c:if>
</ui:composition>
