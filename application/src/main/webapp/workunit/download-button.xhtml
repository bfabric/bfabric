<ui:composition
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <!--@elvariable id="instance" type="org.bfabric.entity.Workunit"-->
  <h:panelGroup>
    <c:if test="#{showName}">
      <ui:include src="/fragments/entity-link-name.xhtml" />
      <h:outputText value="&#160;" />
    </c:if>
    <c:if test="#{not hideStatus}">
      <h:outputText
        value="#{instance.status.label} "
        title="#{instance.status.hint}"
        styleClass="#{instance.status.label}" />
    </c:if>
    <c:if test="#{not empty printSize}">
      <h:outputText value="#{instance.printSize}" />
    </c:if>
    <p:link
      outcome="/fragments/download-jnlp.xhtml"
      title="#{messages.downloadWorkunitDownloadManagerHint} #{messages.downloadableResourceHint}"
      rendered="#{instance.downloadManagerDownloadButtonRendered}">
      <i class="fas fa-download download-icon" />
      <f:param
        name="workunitId"
        value="#{instance.id}" />
    </p:link>
    <p:commandLink
      title="#{messages.downloadWorkunitHint}  #{messages.downloadableResourceHint}"
      rendered="#{instance.downloadButtonRendered}"
      onclick="remoteGetJson([{name: 'entity', value: '#{instance}'}])">
      <i class="fas fa-cloud-download-alt download-icon" />
    </p:commandLink>
    <p:remoteCommand
      name="remoteGetJson"
      action="#{jsonService.getJson}"
      oncomplete="download_files(args.json)" />
    <h:panelGroup rendered="#{instance.downloadManagerDownloadButtonRendered or instance.downloadButtonRendered}">
      <a
        href="#{configuration.urlUserManual}?page=WorkunitDownload"
        title="#{messages.downloadHelpLink}"
        target="_blank"
        rel="noopener"><i class="far fa-question-circle download-icon" /></a>
    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
