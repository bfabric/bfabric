<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('executables')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="executable" />
      <ui:param
        name="tableContext"
        value="#{workunit.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{workunit.executables}" />
      <ui:param
        name="hideColumns"
        value="version, predecessors" />
      <ui:param
        name="showColumns"
        value="wrapperCreatorExecutable, workunitSize" />
    </ui:include>
  </c:if>
</ui:composition>
