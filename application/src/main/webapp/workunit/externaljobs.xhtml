<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <c:if test="#{sidebarHelper.isTab('externaljobs')}">
    <h:form>
      <ui:include src="/fragments/datatable.xhtml">
        <ui:param
          name="tableType"
          value="externaljob" />
        <ui:param
          name="tableContext"
          value="#{workunit.tableContext}" />
        <ui:param
          name="tableContent"
          value="#{workunit.externalJobs}" />
      </ui:include>

      <h:panelGrid styleClass="action">
        <p:commandButton
          action="#{workunitManager.resubmit}"
          rendered="#{workunit.resubmitButtonVisible}"
          value="#{messages.resubmit}"
          title="#{messages.resubmitHint}"
          global="false"
          update="@form" />
      </h:panelGrid>
    </h:form>
  </c:if>
</ui:composition>
