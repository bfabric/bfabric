<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/layout/template.xhtml">
  <f:metadata>
    <f:viewAction action="#{identityManager.restrictRole('containerManager')}" />
  </f:metadata>

  <ui:define name="pageTitle">
    <h:outputText value="#{messages.samplesReassignableWorkunits}" />
  </ui:define>

  <ui:define name="body">
    <h:panelGroup rendered="#{not empty workunitList.workunitsSamplesReassignable}">
      <ui:include src="/fragments/show-datatable.xhtml">
        <ui:param
          name="tableType"
          value="workunit" />
        <ui:param
          name="tableContext"
          value="allSampleResignable" />
        <ui:param
          name="tableContent"
          value="#{workunitList.workunitsSamplesReassignable}" />
      </ui:include>
    </h:panelGroup>
  </ui:define>
</ui:composition>
