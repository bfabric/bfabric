<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('succeedingdatasets')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="dataset" />
      <ui:param
        name="tableContext"
        value="#{workunit.tableContext}_succeeding" />
      <ui:param
        name="tableContent"
        value="#{datasetList.getLazyModelSucceedingDatasetsByWorkunitId(workunit.id)}" />
    </ui:include>
  </c:if>
</ui:composition>
