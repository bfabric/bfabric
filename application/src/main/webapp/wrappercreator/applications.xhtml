<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  <c:if test="#{sidebarHelper.isTab('applications')}">
    <ui:include src="/fragments/show-datatable.xhtml">
      <ui:param
        name="tableType"
        value="application" />
      <ui:param
        name="tableContext"
        value="#{wrapperCreator.tableContext}" />
      <ui:param
        name="tableContent"
        value="#{wrapperCreator.applications}" />
      <ui:param
        name="hideColumns"
        value="run,help,pageflow,executable,wrapperCreator,submitter" />
    </ui:include>
  </c:if>
</ui:composition>
