<ui:composition
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:p="http://primefaces.org/ui">
  <ui:param
    name="entityManager"
    value="#{wrapperCreatorManager}" />

  <ui:decorate template="/fragments/edit-screen.xhtml">
    <ui:define name="body">
      <h:form id="#{constants.EDIT}">
        <h:panelGrid
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.name}" />
          <ui:decorate template="/fragments/required.xhtml">
            <h:inputText
              id="#{constants.NAME}"
              value="#{wrapperCreator.name}"
              title="#{messages.wrapperCreatorNameHint}"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>

          <c:if test="#{wrapperCreator.supervisorEditable}">
            <ui:include src="/fragments/supervisor-autocomplete-required.xhtml">
              <ui:param
                name="instance"
                value="#{wrapperCreator}" />
            </ui:include>
          </c:if>

          <h:outputText value="#{messages.enabled}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="enabled"
              value="#{wrapperCreator.enabled}" />
          </ui:decorate>

          <h:outputText value="#{messages.valid}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:selectBooleanCheckbox
              id="valid"
              value="#{wrapperCreator.valid}"
              title="#{messages.wrapperCreatorValidHint}" />
          </ui:decorate>

          <h:outputText value="#{messages.description}" />
          <ui:decorate template="/fragments/edit.xhtml">
            <h:inputTextarea
              id="description"
              value="#{wrapperCreator.description}"
              title="#{messages.wrapperCreatorDescriptionHint}"
              rows="10"
              styleClass="editWidthExtraLarge" />
          </ui:decorate>
        </h:panelGrid>

        <h:panelGrid
          id="executable"
          columns="2"
          columnClasses="rtdm, ltd">
          <h:outputText value="#{messages.wrapperCreatorExecutable}" />
          <ui:decorate template="/fragments/display.xhtml">
            <h:panelGrid
              columns="3"
              styleClass="noborder-rightpadding">
              <h:outputText
                value="#{wrapperCreator.executable.displayName}"
                rendered="#{not empty wrapperCreator.executable}" />
              <p:commandButton
                value="#{messages.replace}"
                immediate="true"
                oncomplete="PF('selectWrapperCreatorExecutableModalDialog').show()"
                styleClass="inlinemiddle"
                rendered="#{not empty wrapperCreator.executable}"
                update="#{constants.EDIT}:executable" />
              <p:commandButton
                value="#{messages.select}"
                immediate="true"
                oncomplete="PF('selectWrapperCreatorExecutableModalDialog').show()"
                styleClass="inlinemiddle"
                rendered="#{empty wrapperCreator.executable}"
                update="#{constants.EDIT}:executable" />
            </h:panelGrid>
          </ui:decorate>

          <h:outputText
            value="#{messages.modifiableParameters}"
            rendered="#{not empty wrapperCreator.parametersInUse}" />
          <h:panelGroup rendered="#{not empty wrapperCreator.parametersInUse}">
            <ui:decorate template="/fragments/display.xhtml">
              <ui:include src="/fragments/datatable.xhtml">
                <ui:param
                  name="tableType"
                  value="parameter" />
                <ui:param
                  name="tableContext"
                  value="editWrapperCreator" />
                <ui:param
                  name="tableContent"
                  value="#{wrapperCreator.parametersInUse}" />
                <ui:param
                  name="include"
                  value="/parameter/edit-columns.xhtml" />
                <ui:param
                  name="styleClass"
                  value="inner" />
              </ui:include>
            </ui:decorate>
          </h:panelGroup>
        </h:panelGrid>

        <h:panelGrid
          columns="2"
          styleClass="action">
          <ui:decorate template="/fragments/button/save-edit-cancel.xhtml" />
        </h:panelGrid>
      </h:form>
      <ui:include src="/wrappercreator/select-executable-modal.xhtml" />
    </ui:define>
  </ui:decorate>
</ui:composition>
